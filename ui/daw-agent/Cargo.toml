[package]
name = "daw-agent"
version = "0.1.0"
edition = "2021"

# The in-app agent's substrate: a typed, self-describing tool interface over the
# engine's control surface, plus structured perception of the song. This is the
# layer an LLM harness (or a script, or a test) drives — action already existed
# via the command ring; what was missing was legible perception and a discoverable
# capability manifest. Kept model-agnostic: no network, no API keys here.

[dependencies]
daw-bridge = { path = "../daw-bridge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "daw_agent"
path = "src/lib.rs"
