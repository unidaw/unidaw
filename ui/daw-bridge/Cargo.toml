[package]
name = "daw-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
memmap2 = "0.9"
static_assertions = "1.1"
memoffset = "0.9"

[build-dependencies]
bindgen = "0.70"
# For the provenance sidecar build.rs writes beside the generated bindings. A standard
# implementation rather than a hand-rolled one: the checker reads the same fingerprint from
# Python's hashlib, and two hand-written hashes that must agree bit for bit is a seam worth
# one crate to remove. Every dependency of sha2 was already in this lock.
sha2 = "0.10"

[lib]
name = "daw_bridge"
path = "src/lib.rs"
