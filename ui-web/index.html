<!doctype html>
<meta charset="utf-8">
<title>Uni — tracker</title>
<link rel="stylesheet" href="src/fonts.css">
<link rel="stylesheet" href="src/icons/phosphor.css">
<link rel="stylesheet" href="src/tokens.css">
<link rel="stylesheet" href="src/tracker.css">
<link rel="stylesheet" href="src/arrange.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--uni-surface-tracker-bg); color: var(--base-text); }
  body { font-family: var(--font-chrome); font-size: var(--font-size-chrome); overflow: hidden; }
  /* Its own strip along the bottom, so it never sits on top of a cell. */
  #hud { position: absolute; left: 0; right: 0; bottom: 0; height: 16px;
         display: flex; align-items: center; justify-content: flex-end; gap: 12px;
         padding: 0 8px; box-sizing: border-box; font-family: var(--font-mono);
         font-size: var(--font-size-fx); letter-spacing: var(--font-tracking-fx);
         color: var(--base-neutral-600); background: var(--uni-surface-header-bg);
         border-top: 1px solid var(--uni-rule-gutter); pointer-events: none; z-index: 3; }
  /* The header is a sibling, not part of the scrolled band: it must not move
     vertically, and the tracker must start below it rather than under it. */
  #head { position: absolute; left: 0; right: 0; top: 38px; height: var(--metrics-header-height);
          overflow: hidden; background: var(--uni-surface-header-bg);
          border-bottom: 1px solid var(--uni-rule-gutter); z-index: 3; }
  #head .hrow { position: absolute; display: flex; height: 100%; }
  #head .hgut { position: sticky; left: 0; z-index: 2; flex: 0 0 var(--metrics-gutter-width);
                width: var(--metrics-gutter-width); background: var(--uni-surface-header-bg);
                display: flex; align-items: center; padding: 0 8px; box-sizing: border-box;
                font-size: var(--font-size-fx); letter-spacing: var(--font-tracking-fx);
                color: var(--uni-text-gutter); }
  #head .htrack { display: flex; align-items: center; justify-content: center;
                  box-sizing: border-box; font-family: var(--font-mono);
                  font-size: var(--font-size-inst); letter-spacing: var(--font-tracking-fx);
                  color: var(--uni-text-instrument);
                  border-right: var(--uni-rule-track-width) solid var(--uni-rule-track); }
  #tracker, #arrange { position: absolute; left: 0; right: 0; bottom: 16px;
             top: calc(38px + var(--metrics-header-height)); }
  #arrange[hidden] { display: none; }
  #hud { background: var(--uni-surface-tracker-bg); padding: 1px 4px; }
</style>

<div id="chrome"></div>
<div id="head"></div>
<div id="tracker"></div>
<div id="arrange" hidden></div>
<div id="hud"></div>

<script type="module">
import { Tracker } from './src/tracker.js';
import { buildViewModel, ZOOM_LEVELS, createBuffer } from './src/viewmodel.js';
import M from './design/out/tokens.js';
import { connectEngine } from './src/engine.js';
import { createChrome } from './src/chrome.js';
import { Arrange } from './src/arrange.js';
import { buildArrangeModel, createArrangeBuffer, ARRANGE_ZOOM } from './src/arrangemodel.js';
import { createEntry, feed, cancel, begin, parseToken, editing, NOTE_KEYS, NOTE_OFF_KEY,
         TOKEN_KEY, pitchOf, pitchToToken, hexValue, shiftDigit } from './src/entry.js';

const metrics = {
  rowHeight: M.metrics.rowHeight,
  gutterWidth: M.metrics.gutterWidth,
  laneWidth: M.metrics.laneWidth,
  cellWidth: M.metrics.cellWidth,
};

const host = document.getElementById('tracker');
const head = document.getElementById('head');
const chrome = createChrome(document.getElementById('chrome'), {
  onPlay: () => cmd('play'),
  onStop: () => {
    if (!engine || !engine.transport) { state.reject = 'not playing'; schedule(); return; }
    cmd('stop');
    state.reject = 'stopped (engine has no rewind yet)';
    schedule();
  },
});
// No write path yet — the command ring needs a channel the write-only socket
// does not have. The buttons exist and say so rather than pretending.
function cmd(what) { if (!conn || !conn.send({ type: what })) { state.link = 'no engine'; schedule(); } }
const hud = document.getElementById('hud');
const tracker = new Tracker(host, metrics);
const arrangeHost = document.getElementById('arrange');
const arrange = new Arrange(arrangeHost, metrics);
const ARRANGE_LANE_H = 44;
let arrangeBuf = null;

// A 100,000-row timeline. Nothing materialises it; the pool is viewport-sized.
const TOTAL_ROWS = 100000;
// Declared up here, not beside connectEngine: draw() reads it, and draw() runs
// before the connection is made.
// Declared before draw() because draw() reads them and runs first. Three TDZ
// throws in this file so far; anything draw() touches gets hoisted here.
let engine = null;
let conn = null;
let lastViewportKey = -1;
const state = { start: 0, scrollX: 0, tracks: 16, columns: 3, link: 'connecting', selection: null,
  // Entry state, shown in the chrome so you can see what you are typing into.
  octave: 4, editStep: 1, velocity: 100, zoom: 3, digitCell: -1, digitAcc: 0,
  // Which surface is showing. Both consume the same engine store; only the
  // projection differs, which is the whole point of the view-model boundary.
  view: 'tracker', arrangeZoom: 3, arrangeStart: 0, selectedPlacement: -1, cursor: { row: 0, track: 0, col: 0 }, playhead: 0 };

// The HUD is a diagnostic, so it lives entirely on a timer — never in draw().
// It was allocating several strings and a Text node every frame, which is
// exactly what GUIDELINES.md 3.1 and 3.10 forbid.
const hudText = document.createTextNode('');
hud.appendChild(hudText);
setInterval(() => {
  const v = tracker.vm; if (!v || state.hudFrozen) return;
  const st = conn.stats();
  hudText.nodeValue = (engine ? 'engine ' + st.framesIn + 'f' + (st.gaps ? ' ' + st.gaps + ' gaps' : '') : state.link)
    + '   ' + v.zoom.label + '   row ' + state.cursor.row
    + '   T' + (state.cursor.track + 1) + '   x' + state.scrollX
    + '   ' + tracker.poolSize + ' pooled   ' + document.querySelectorAll('*').length + ' nodes';
}, 500);

// Two buffers, alternating: the renderer diffs prev against current, so they
// have to be distinct objects. Steady-state allocation is zero.
const entry = createEntry();

/**
 * Optimistic edits: drawn immediately, dropped when the engine's clip version
 * moves past the version they were composed against.
 *
 * That version IS the reconciliation key — it is why base_version exists and why
 * commands never needed to be synchronised with a frame. An edit sent against
 * clipVersion N has been seen by the engine once a frame arrives with anything
 * greater than N, whether it was applied or rejected. Either way the feed is now
 * authoritative and the local guess must stop being drawn, or a rejected edit
 * would linger on screen forever looking like data.
 *
 * Entries are pooled; a handful are ever in flight.
 */
const pending = [];
let pendingCount = 0;
const PENDING_TIMEOUT_MS = 2000;

function addPending(row, track, col, text, base) {
  const e = pending[pendingCount] || (pending[pendingCount] =
    { row: 0, track: 0, col: 0, text: '', base: 0, at: 0 });
  e.row = row; e.track = track; e.col = col; e.text = text; e.base = base;
  e.at = performance.now();
  pendingCount++;
}

/** Drop anything the engine has now answered, or that never came back. */
function reapPending(clipVersion, now) {
  let w = 0;
  for (let i = 0; i < pendingCount; i++) {
    const e = pending[i];
    const answered = clipVersion > e.base;
    const stale = now - e.at > PENDING_TIMEOUT_MS;
    if (answered || stale) continue;          // engine owns it now
    if (w !== i) { const t = pending[w]; pending[w] = e; pending[i] = t; }
    w++;
  }
  pendingCount = w;
}
const bufs = [null, null];
let bi = 0;

// Track headers: built once, then only transformed. They scroll horizontally
// with the strip and never vertically.
let headRow = null;
function buildHead() {
  head.textContent = '';
  headRow = document.createElement('div'); headRow.className = 'hrow';
  const g = document.createElement('div'); g.className = 'hgut'; g.textContent = 'TIME';
  headRow.append(g);
  // Width comes from the renderer's MEASURED track stride, not from
  // cellWidth * columns. The arithmetic omits the per-track border — 2px each,
  // compounding, so by track 16 the headers sit 32px left of their columns.
  // Same mistake as the scroll clamp; see GUIDELINES.md 3.11.
  const stride = tracker.trackStride || metrics.cellWidth * state.columns;
  for (let t = 0; t < state.tracks; t++) {
    const el = document.createElement('div'); el.className = 'htrack';
    el.dataset.track = String(t);
    el.style.width = `${stride}px`;
    el.style.flex = `0 0 ${stride}px`;
    el.appendChild(document.createTextNode(`T${String(t + 1).padStart(2, '0')}`));
    // The lane's grid, shown because it is not derivable from anything on
    // screen: a lane at 3 lines/beat looks like a lane at 4 with gaps in it.
    const lpb = document.createElement('span');
    lpb.className = 'hlpb';
    lpb.appendChild(document.createTextNode(''));
    el.appendChild(lpb);
    el._lpbEl = lpb; el._lpb = -1;
    headRow.append(el);
  }
  head.append(headRow);
  paintHeadLpb();
}

/** Write each lane's lines-per-beat into its header. Guarded, so a frame where
 *  nothing changed writes nothing — this runs from draw(). */
function paintHeadLpb() {
  if (!headRow) return;
  for (let t = 0; t < state.tracks; t++) {
    const el = headRow.children[t + 1];
    if (!el || !el._lpbEl) continue;
    const n = engine && engine.lpb[t] ? engine.lpb[t] : 0;
    if (el._lpb === n) continue;
    el._lpb = n;
    el._lpbEl.firstChild.nodeValue = n ? ' ' + n + '/b' : '';
  }
}

const NANOTICKS_PER_BEAT = 960000;
/** Ticks per row on a given lane's own grid. This is a note's DURATION. */
function laneRowTicks(track) {
  const n = engine && engine.lpb[track] ? engine.lpb[track] : 4;
  return NANOTICKS_PER_BEAT / n;
}
/**
 * Whether a lane actually has a row here. Lanes share one row axis (the
 * viewport's), and a lane at 4/beat only lands on every third row of a 12/beat
 * axis — the rows in between belong to the triplet and sextuplet lanes. There is
 * nothing to write into there, and offering an empty cell would imply otherwise.
 */
function onLaneGrid(row, track) {
  const lane = engine && engine.lpb[track] ? engine.lpb[track] : ZOOM_LEVELS[state.zoom].linesPerBeat;
  const stride = ZOOM_LEVELS[state.zoom].linesPerBeat / lane;
  return stride < 1 || row % Math.round(stride) === 0;
}
/** The tick the cursor's row means. Rows are viewport rows — one axis, and the
 *  same one the sidecar projects notes into. */
function tickOfCursorRow() {
  return state.cursor.row * ZOOM_LEVELS[state.zoom].rowNanoticks;
}

/**
 * Turn a committed cell token into an engine command. The parser decides what
 * the text means; this decides what to do about it. An invalid token is left
 * visible rather than dropped — a cell that silently ignores what you typed is
 * indistinguishable from one that took it.
 */
/**
 * Commit a typed token. Only reached from the `@` buffer now — piano keys and
 * value digits commit on their own keystroke and never come through here.
 */
function commitToken(text) {
  const r = parseToken(text, state.cursor.col);
  if (r.kind === 'note') {
    if (!writePitch(r.pitch)) return;
  } else if (r.kind === 'off') {
    noteOffAtCursor();
  } else if (r.kind === 'empty') {
    deleteAtCursor();
  } else {
    // degree and chord forms parse but have no engine command yet — WriteChord
    // and a param path are needed. Left visibly unaccepted rather than faked.
    state.reject = 'cannot write "' + text + '" yet';
    return;                            // cursor stays put so it can be fixed
  }
  state.reject = null;
  state.cursor.row += state.editStep;
  follow();
}

// The playhead arrives as a tick and has to be projected like everything else.
function tickToRow(tick) {
  return Math.floor(tick / ZOOM_LEVELS[state.zoom].rowNanoticks);
}

/** Arrange draws from the same store; only the projection differs. */
function drawArrange() {
  const lanes = Math.min(state.tracks, 16);
  if (!arrangeBuf || arrangeBuf._shape !== `${lanes}x128`) {
    arrangeBuf = createArrangeBuffer(lanes, 128);
  }
  const vm = buildArrangeModel({
    startTick: state.arrangeStart,
    width: arrangeHost.clientWidth - metrics.gutterWidth,
    zoomIndex: state.arrangeZoom,
    tracks: lanes,
    engine: state.useEngine === false ? null : engine,
    laneHeight: ARRANGE_LANE_H,
    cursor: { track: state.cursor.track, tick: tickOfCursorRow() },
    selectedPlacement: state.selectedPlacement,
  }, arrangeBuf);
  arrange.render(vm);
  chrome.update({
    playheadTick: engine ? engine.playheadTick : 0,
    transport: engine ? engine.transport : 0,
    linkText: engine && engine.stale ? 'engine gone'
      : engine && conn && conn.stats().connected ? 'live' : state.link,
    octave: state.octave, editStep: state.editStep, rejectText: state.reject || '',
  });
}

function draw() {
  // One scheduler, two surfaces. Hiding the other host rather than unmounting it
  // keeps its pools warm, so switching views costs no rebuild.
  const wantArrange = state.view === 'arrange';
  if (arrangeHost.hidden === wantArrange) {
    arrangeHost.hidden = !wantArrange;
    host.style.display = wantArrange ? 'none' : '';
    head.style.display = wantArrange ? 'none' : '';
  }
  if (wantArrange) return drawArrange();
  const shapeChanged = tracker.poolSize === 0 || !headRow || headRow.children.length !== state.tracks + 1;
  tracker.resize(host.clientHeight, state.tracks, state.columns);
  if (shapeChanged) buildHead();
  paintHeadLpb();
  if (headRow && headRow._x !== state.scrollX) {
    headRow._x = state.scrollX;
    headRow.style.transform = 'translateX(' + (-state.scrollX) + 'px)';
  }
  bi ^= 1;
  const vm = bufs[bi] = buildViewModel({
    startRow: state.start, rowCount: tracker.poolSize,
    tracks: state.tracks, columns: state.columns, zoomIndex: state.zoom,
    cursor: state.cursor, playheadRow: state.playhead, selection: state.selection,
    engine: state.useEngine === false ? null : engine,
    pending, pendingCount,
    entryOverlay: entry.active
      ? { row: entry.row, track: entry.track, col: entry.col, text: entry.text }
      : null,
  }, bufs[bi]);
  vm.scrollX = state.scrollX;
  chrome.update({
    playheadTick: engine ? engine.playheadTick : 0,
    transport: engine ? engine.transport : 0,
    linkText: engine && engine.stale ? 'engine gone'
      : engine && conn && conn.stats().connected ? 'live' : state.link,
    octave: state.octave, editStep: state.editStep, rejectText: state.reject || '',
  });
  // The sidecar owns the projection and the aggregation, so it needs to know
  // what we are looking at. Only sent when it actually moves.
  const vpKey = state.zoom * 1e9 + state.start * 1000 + tracker.poolSize;
  if (conn && vpKey !== lastViewportKey) {
    lastViewportKey = vpKey;
    conn.setViewport(ZOOM_LEVELS[state.zoom].linesPerBeat, state.start, tracker.poolSize);
  }
  tracker.render(vm);
  // The node count is an O(tree) walk. Sampling it every frame cost ~7 ms —
  // more than the render it was reporting on. Diagnostics must not be in the
  // hot path; refresh it on a timer instead.
}

// Input is coalesced into one draw per animation frame. Without this, key
// repeat fires a synchronous draw per keydown — at ~30/s against an 8 ms draw
// that is a quarter of the main thread and several draws can queue inside one
// frame, which is what makes a held zoom or scroll key feel like it lags even
// though a single press is comfortably inside budget.
// Keep the cursor away from both edges of the VIEWPORT — not of the pool. The
// pool is larger than the viewport by the overscan, so thresholding against it
// put the trigger at row 89 of 92 visible: you could press down eighty-nine
// times and nothing would move, which reads as "scrolling is broken".
//
// The cursor centres and the timeline moves under it — the tracker convention
// (Renoise, OpenMPT). It also means scrolling starts on the very first keypress
// that crosses the middle, instead of after a long dead zone.
function follow() {
  const visible = Math.max(1, Math.floor(host.clientHeight / metrics.rowHeight));
  const centre = Math.floor(visible / 2);
  state.start = Math.max(0, Math.min(state.cursor.row - centre, Math.max(0, TOTAL_ROWS - visible)));

  // Horizontal: keep the cursor's cell inside the viewport, scrolling the track
  // strip under the sticky gutter. Same principle as vertical — a margin, not an
  // edge, or the cursor pins to the right-hand side and you cannot see ahead.
  // Geometry comes from the renderer's measurement, not from re-deriving the
  // box model here. The cell's left edge and the scroll extent both include the
  // per-track borders, which arithmetic kept forgetting.
  const viewW = host.clientWidth;
  const cellL = tracker.cellLeft(state.cursor.track, state.cursor.col);
  const cellR = cellL + metrics.cellWidth;
  const gutter = metrics.gutterWidth;                 // sticky: always covers the left edge
  const margin = Math.min(tracker.trackStride || 0, Math.floor((viewW - gutter) / 6));
  if (cellL - state.scrollX < gutter + margin) state.scrollX = cellL - gutter - margin;
  else if (cellR - state.scrollX > viewW - margin) state.scrollX = cellR - viewW + margin;
  state.scrollX = Math.max(0, Math.min(state.scrollX, tracker.maxScrollX(viewW)));
}

let dirty = false;
function schedule() {
  if (dirty) return;
  dirty = true;
  requestAnimationFrame(() => { dirty = false; draw(); });
}

function scrollTo(row) {
  state.start = Math.max(0, Math.min(TOTAL_ROWS - tracker.poolSize, row));
  draw();
}

/** The engine note the cursor is sitting on, or null. */
function noteAtCursor() {
  if (!engine) return null;
  const scale = engine.rowGrid > 0 ? ZOOM_LEVELS[state.zoom].linesPerBeat / engine.rowGrid : 1;
  for (let i = 0; i < engine.noteCount; i++) {
    const n = engine.notes[i];
    if (n.track !== state.cursor.track) continue;
    const r = scale === 1 ? n.row : Math.round(n.row * scale);
    if (r === state.cursor.row) return n;
  }
  return null;
}

/** The engine note SOUNDING at the cursor's tick — it may have started earlier. */
function noteCoveringCursor() {
  if (!engine) return null;
  const tick = tickOfCursorRow();
  for (let i = 0; i < engine.noteCount; i++) {
    const n = engine.notes[i];
    if (n.track === state.cursor.track && n.tOn <= tick && tick < n.tOff) return n;
  }
  return null;
}

/** Rewrite a note in place with a new velocity or duration. */
function rewriteNote(n, { vel = n.velocity, dur = n.tOff - n.tOn } = {}) {
  if (!conn) return false;
  const base = engine ? engine.clipVersion : 0;
  const ok = conn.send({ type: 'note', track: n.track, pitch: n.pitch,
                         tick: n.tOn, dur: Math.max(1, dur), vel });
  return ok ? base : false;
}

/**
 * Note off. A tracker OFF at row R means "whatever is sounding here stops here",
 * which in a model of (t_on, t_off) pairs is a truncation of the covering note —
 * not a new event, and not a deletion unless the note starts on this very row.
 */
function noteOffAtCursor() {
  const n = noteCoveringCursor();
  if (!n) return false;
  const tick = tickOfCursorRow();
  if (n.tOn >= tick) return deleteAtCursor();
  const base = rewriteNote(n, { dur: tick - n.tOn });
  if (base !== false) addPending(state.cursor.row, state.cursor.track, 0, 'OFF', base);
  return base !== false;
}

function deleteAtCursor() {
  if (!conn) return false;
  const base = engine ? engine.clipVersion : 0;
  if (!conn.send({ type: 'delete', track: state.cursor.track, tick: tickOfCursorRow() })) return false;
  addPending(state.cursor.row, state.cursor.track, 0, '', base);
  return true;
}

/** Write a pitch at the cursor, optimistically. */
function writePitch(pitch) {
  if (!onLaneGrid(state.cursor.row, state.cursor.track)) {
    state.reject = 'lane has no row here'; return false;
  }
  const base = engine ? engine.clipVersion : 0;
  const dur = laneRowTicks(state.cursor.track);
  if (!conn || !conn.send({ type: 'note', track: state.cursor.track, pitch,
                            tick: tickOfCursorRow(), dur, vel: state.velocity })) return false;
  addPending(state.cursor.row, state.cursor.track, 0, pitchToToken(pitch), base);
  return true;
}

/**
 * A digit typed into a value column. Commits on the keystroke — there is nothing
 * to confirm, because the field is a fixed width and is always complete.
 * Velocity is carried on the note itself, so this is a rewrite of that note.
 */
function typeValue(digit) {
  // Checked before the note lookup: on this column the missing piece is the
  // command, not the note, and reporting "no note here" would send you looking
  // for the wrong thing.
  if (state.cursor.col !== 1) {
    state.reject = 'effect column needs an engine param path';
    return false;
  }
  const n = noteAtCursor();
  if (!n) { state.reject = 'no note here to carry a value'; return false; }
  {
    // Continue the field if we are still on the same cell, else start fresh.
    const same = state.digitCell === state.cursor.row * 1000 + state.cursor.track;
    state.digitCell = state.cursor.row * 1000 + state.cursor.track;
    const cur = same ? state.digitAcc : 0;
    const v = Math.min(127, shiftDigit(cur, digit));
    state.digitAcc = v;
    const base = rewriteNote(n, { vel: v });
    if (base === false) return false;
    addPending(state.cursor.row, state.cursor.track, 1, ('0' + v).slice(-2), base);
    return true;
  }
}

/** Any cursor move abandons a half-typed token. */
function moveCursor(fn) {
  if (entry.active) cancel(entry);
  state.digitCell = -1;
  fn();
}

addEventListener('keydown', (e) => {
  const k = e.key;
  const done = () => { e.preventDefault(); schedule(); };

  // 1. Modifier combos first, so nothing below can swallow them.
  if (e.metaKey || e.ctrlKey) {
    if (k.toLowerCase() === 'z') {
      conn && conn.send({ type: e.shiftKey ? 'redo' : 'undo' });
      return done();
    }
    return;                                   // leave browser shortcuts alone
  }

  // 2. An open token buffer owns the keyboard, except for navigation.
  if (entry.active && k !== 'Tab') {
    const act = feed(entry, k);
    if (act === 'commit') { commitToken(entry.text); cancel(entry); return done(); }
    if (act === 'consumed' || act === 'cancel') return done();
  }

  // 2.5 View switch, and arrange's own navigation. Arrange has no rows and no
  //     cell editing, so it must not fall through into the tracker's keys.
  if (k === 'Tab') { state.view = state.view === 'arrange' ? 'tracker' : 'arrange'; return done(); }
  if (state.view === 'arrange') {
    const page = arrangeBuf ? arrangeBuf.view.ticksPerPixel * arrangeBuf.view.width : 3840000;
    if (k === 'ArrowRight') { state.arrangeStart += page / 8; return done(); }
    if (k === 'ArrowLeft') { state.arrangeStart = Math.max(0, state.arrangeStart - page / 8); return done(); }
    if (k === 'PageDown') { state.arrangeStart += page; return done(); }
    if (k === 'PageUp') { state.arrangeStart = Math.max(0, state.arrangeStart - page); return done(); }
    if (k === 'Home') { state.arrangeStart = 0; return done(); }
    if (k === 'ArrowDown') { state.cursor.track = Math.min(state.tracks - 1, state.cursor.track + 1); return done(); }
    if (k === 'ArrowUp') { state.cursor.track = Math.max(0, state.cursor.track - 1); return done(); }
    if (k === '-' || k === '_') { state.arrangeZoom = Math.min(ARRANGE_ZOOM.length - 1, state.arrangeZoom + 1); return done(); }
    if (k === '+' || k === '=') { state.arrangeZoom = Math.max(0, state.arrangeZoom - 1); return done(); }
    if (k === ' ') { cmd('play'); return done(); }
    if (k === 'Escape') { state.selectedPlacement = -1; state.reject = null; return done(); }
    // Clip edits need engine commands that do not exist yet (move/resize/
    // duplicate/delete placement). Asked backend; refusing visibly until then.
    if (k === 'Backspace' || k === 'Delete') {
      state.reject = 'clip edits need engine commands (asked backend)';
      return done();
    }
    return;
  }

  // 3. Navigation.
  if (k === 'ArrowDown') { moveCursor(() => state.cursor.row++); follow(); return done(); }
  if (k === 'ArrowUp') { moveCursor(() => { state.cursor.row = Math.max(0, state.cursor.row - 1); }); follow(); return done(); }
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    const d = k === 'ArrowRight' ? 1 : -1;
    moveCursor(() => {
      let f = state.cursor.track * state.columns + state.cursor.col + d;
      f = Math.max(0, Math.min(f, state.tracks * state.columns - 1));
      state.cursor.track = Math.floor(f / state.columns); state.cursor.col = f % state.columns;
    });
    follow(); return done();
  }
  if (k === 'PageDown') { moveCursor(() => { state.start = Math.min(TOTAL_ROWS - tracker.poolSize, state.start + 32); }); return done(); }
  if (k === 'PageUp') { moveCursor(() => { state.start = Math.max(0, state.start - 32); }); return done(); }

  // 4. Global controls. These used to sit AFTER a catch-all typing branch that
  //    consumed every printable key, so none of them were reachable: `-` typed a
  //    dash into a cell instead of zooming, and Backspace edited the buffer
  //    instead of deleting a note.
  if (k === '[') { state.octave = Math.max(0, state.octave - 1); return done(); }
  if (k === ']') { state.octave = Math.min(9, state.octave + 1); return done(); }
  if (k === '-' || k === '_') { moveCursor(() => { state.zoom = Math.max(0, state.zoom - 1); }); return done(); }
  if (k === '+' || k === '=') { moveCursor(() => { state.zoom = Math.min(ZOOM_LEVELS.length - 1, state.zoom + 1); }); return done(); }
  if (k === ' ') { cmd('play'); return done(); }
  if (k === 'Escape') { state.reject = null; return done(); }

  // 5. Editing at the cursor.
  if (k === 'Backspace' || k === 'Delete') {
    deleteAtCursor();
    state.cursor.row += state.editStep; follow();
    return done();
  }
  if (k === TOKEN_KEY) { begin(entry, state.cursor, '@'); return done(); }

  if (k.length !== 1) return;
  state.reject = null;

  if (state.cursor.col === 0) {
    if (k.toLowerCase() === NOTE_OFF_KEY) {
      noteOffAtCursor();
      state.cursor.row += state.editStep; follow();
      return done();
    }
    const pitch = pitchOf(k.toLowerCase(), state.octave);
    if (pitch >= 0) {
      writePitch(pitch);
      state.cursor.row += state.editStep; follow();
      return done();
    }
    return;
  }

  const d = hexValue(k);
  if (d >= 0) { typeValue(d); return done(); }
}, { capture: true });

// Mouse: click moves the cursor, drag selects. Field = track*columns+col, so a
// drag across a track boundary selects the fields between it — what a tracker
// user means by a range.
let dragAnchor = null;
function fieldOf(hit) { return hit.track * state.columns + hit.col; }

arrangeHost.addEventListener('pointerdown', (e) => {
  if (!arrangeBuf) return;
  const hit = arrange.hitTest(e.clientX, e.clientY, arrangeBuf);
  if (!hit) return;
  state.cursor.track = hit.track;
  state.selectedPlacement = hit.placement;
  // Click-to-position needs SetPosition, which the engine does not have; say so
  // rather than moving a playhead the engine will immediately contradict.
  if (hit.placement < 0) state.reject = 'seek needs an engine command (asked backend)';
  else state.reject = null;
  schedule();
});

host.addEventListener('pointerdown', (e) => {
  const hit = tracker.hitTest(e.clientX, e.clientY, state.scrollX);
  if (!hit) return;
  host.setPointerCapture(e.pointerId);
  dragAnchor = hit;
  state.cursor.row = hit.row; state.cursor.track = hit.track; state.cursor.col = hit.col;
  state.selection = null;
  schedule();
});

host.addEventListener('pointermove', (e) => {
  if (!dragAnchor) return;
  const hit = tracker.hitTest(e.clientX, e.clientY, state.scrollX);
  if (!hit) return;
  const a = fieldOf(dragAnchor), b = fieldOf(hit);
  state.selection = {
    r0: Math.min(dragAnchor.row, hit.row), r1: Math.max(dragAnchor.row, hit.row),
    f0: Math.min(a, b), f1: Math.max(a, b),
  };
  state.cursor.row = hit.row; state.cursor.track = hit.track; state.cursor.col = hit.col;
  schedule();
});

host.addEventListener('pointerup', (e) => {
  dragAnchor = null;
  if (host.hasPointerCapture(e.pointerId)) host.releasePointerCapture(e.pointerId);
});

addEventListener('resize', schedule);
draw();

// Live engine, when the sidecar is up. Falls back to the fixture so the page —
// and every golden — still renders standalone. Connected after the first draw:
// connectEngine calls onStatus synchronously, and touching `state` before its
// declaration is a temporal-dead-zone throw that kills the whole module.
conn = connectEngine({
  onStatus: (s, d) => { state.link = s + (d ? ': ' + d : ''); schedule(); },
  onAck: (msg) => { state.ack = String(msg).slice(0, 80);
    (window.__acks || (window.__acks = [])).push(state.ack); },
  onChange: (store) => { engine = store; reapPending(store.clipVersion, performance.now()); state.playhead = tickToRow(store.playheadTick); schedule(); },
});

// Agent / test surface. Structure, not pixels — this is requirement (d).
window.__uni = {
  probe: () => tracker.probe(),
  state: () => JSON.parse(JSON.stringify(state)),
  scrollTo,
  clickAt: (x, y) => { const h2 = tracker.hitTest(x, y, state.scrollX); if (h2) {
    state.cursor.row = h2.row; state.cursor.track = h2.track; state.cursor.col = h2.col; draw(); } return h2; },
  selectTo: (r, f) => { state.selection = { r0: Math.min(state.cursor.row, r), r1: Math.max(state.cursor.row, r),
    f0: Math.min(state.cursor.track * state.columns + state.cursor.col, f),
    f1: Math.max(state.cursor.track * state.columns + state.cursor.col, f) }; draw(); },
  selection: () => state.selection,
  engineStats: () => conn.stats(),
  canSend: () => conn && conn.canSend(),
  // Goldens must not depend on whether a sidecar happens to be running.
  // Pins the fixture AND freezes the HUD: live frame counts and link status are
  // non-deterministic, so leaving them in the render makes every golden flaky.
  // Pins the fixture, freezes the HUD, and CLOSES the socket. Without the close
  // the reconnect backoff keeps firing onStatus -> schedule() -> draw() while a
  // screenshot is being taken, which made goldens pass once and fail twice.
  useFixture: () => { state.useEngine = false; state.hudFrozen = true;
                      conn.close(); hudText.nodeValue = 'fixture'; draw(); },
  // Hermetic reset for tests: a scene that inherits the cursor from whatever ran
  // before it is not a fixture, it is a dependency on execution order.
  reset: () => { state.cursor.row = 0; state.cursor.track = 0; state.cursor.col = 0;
                 state.playhead = 0; state.zoom = 3; state.scrollX = 0; state.start = 0;
                 engine = null; state.useEngine = false; state.view = 'tracker';
                 state.arrangeStart = 0; state.arrangeZoom = 3; state.selectedPlacement = -1;
                 // The HUD carries a live node count and frame counter. Pin it
                 // here too, or a scene inherits whatever the previous scene's
                 // timer last wrote and the golden differs by that strip alone.
                 if (state.hudFrozen) hudText.nodeValue = 'fixture';
                 draw(); },
  /**
   * A synthetic engine frame where lanes DISAGREE about their grid: track 0 at
   * 4/beat, track 1 at 3 (triplets), track 2 at 6 (sextuplets), track 3 at 4.
   *
   * This exists because every previous grid bug was invisible in a fixture where
   * all lanes shared a grid — the projection was wrong in both directions for
   * months and still rendered a perfectly plausible tracker. A golden that cannot
   * distinguish right from wrong is not a test, so this is the one that can.
   *
   * Rows are the viewport's (zoom 0 = 12/beat, the LCM), which is what the
   * sidecar now emits. A lane appears on every (12 / itsLpb)-th row.
   */
  useMixedGrid: () => {
    // useEngine TRUE — the socket is closed so nothing overwrites the store, but
    // draw() must take the engine path or this renders the fixture instead and
    // the scene silently tests nothing. It did exactly that on the first run.
    state.useEngine = true; state.hudFrozen = true;
    conn.close(); hudText.nodeValue = 'mixed-grid';
    state.zoom = 0; state.start = 0; state.scrollX = 0;
    const lpb = [4, 3, 6, 4, 4, 4, 4, 4];
    const notes = [];
    for (let t = 0; t < 4; t++) {
      const stride = 12 / lpb[t];
      for (let k = 0; k * stride < 48; k++) {           // four beats of each lane
        notes.push({ tOn: k * stride * 80000, tOff: 0, id: t * 100 + k,
                     pitch: 48 + t * 5 + (k % 5), velocity: 100, column: 0, track: t,
                     retrigger: 0, probability: 100, delayTicks: 0, row: k * stride,
                     muted: false, isAdd: false, placementId: 1 });
      }
    }
    engine = { ok: true, seq: 1, playheadTick: 0, visualSample: 0, clipVersion: 1,
               harmonyVersion: 0, transport: 0, trackCount: 4,
               peaks: new Float32Array(4), peakCount: 0,
               notes, noteCount: notes.length,
               aggCount: new Uint32Array(0), aggRep: new Uint8Array(0),
               aggLo: new Uint8Array(0), aggHi: new Uint8Array(0), aggRows: 0, aggTracks: 0,
               extents: [], extentCount: 0, extentsRevision: 1,
               lpb: Uint8Array.from(lpb), notesRevision: 1, aggRevision: 1 };
    draw();
  },
  loadProject: (name) => conn && conn.loadProject(name),
  saveProject: (name) => conn && conn.saveProject(name),
  lpb: () => (engine ? Array.from(engine.lpb) : null),
  view: (v) => { if (v) { state.view = v; draw(); } return state.view; },
  arrangeProbe: () => arrange.probe(),
  arrangeZoom: (z) => { state.arrangeZoom = z; draw(); },
  arrangeTo: (tick) => { state.arrangeStart = Math.max(0, tick); draw(); },
  extents: () => (engine ? engine.extents.slice(0, engine.extentCount)
    .map(e => ({ id: e.placementId, clip: e.clipId, tr: e.track, a: e.audio,
                 s: e.startTick, e: e.endTick, n: e.name })) : null),
  /** Raw engine state. The row-projected playhead in state() hides whether the
   *  transport is running at all, which made "play does nothing" ambiguous. */
  engineState: () => (engine ? {
    transport: engine.transport, playheadTick: engine.playheadTick,
    clipVersion: engine.clipVersion, rowGrid: engine.rowGrid,
    stale: engine.stale, noteCount: engine.noteCount, trackCount: engine.trackCount,
  } : null),
  notes: () => (engine ? engine.notes.slice(0, engine.noteCount)
    .map(n => ({ t: n.tOn, row: n.row, tr: n.track })) : null),
  /**
   * A synthetic store for the arrange view, including an AUDIO region — schema
   * v3 ships those with UI_CLIP_EXTENT_AUDIO and they render differently, so a
   * fixture without one cannot tell the two apart.
   */
  useArrangeFixture: () => {
    state.useEngine = true; state.hudFrozen = true; conn.close();
    hudText.nodeValue = 'arrange-fixture';
    state.view = 'arrange'; state.arrangeZoom = 3; state.arrangeStart = 0;
    state.selectedPlacement = 2;
    const B = 3840000;
    const mk = (id, clip, tr, s, e, name, audio) =>
      ({ placementId: id, clipId: clip, track: tr, flags: audio ? 1 : 0,
         startTick: s, endTick: e, name, audio });
    const extents = [
      mk(1, 1, 0, 0, B * 4, 'Bass', false),
      mk(2, 2, 1, B, B * 5, 'Pad', false),
      mk(3, 3, 2, B * 2, B * 3, 'Lead', false),
      mk(4, 4, 3, 0, B * 8, 'Arp', false),
      mk(5, 0, 4, B * 3, B * 7, 'Vocal take', true),
      mk(6, 5, 5, B * 6, B * 9, 'Perc', false),
    ];
    engine = { ok: true, seq: 1, playheadTick: B * 2, visualSample: 0, clipVersion: 1,
               harmonyVersion: 0, transport: 0, trackCount: 6, stale: false,
               peaks: new Float32Array(6), peakCount: 0,
               notes: [], noteCount: 0,
               aggCount: new Uint32Array(0), aggRep: new Uint8Array(0),
               aggLo: new Uint8Array(0), aggHi: new Uint8Array(0), aggRows: 0, aggTracks: 0,
               extents, extentCount: extents.length, extentsRevision: 1,
               lpb: Uint8Array.from([4, 4, 4, 3, 4, 6, 0, 0]),
               rowGrid: 1, notesRevision: 1, aggRevision: 1 };
    draw();
  },
  /** Which rows a lane actually has, for assertions that don't read pixels. */
  laneRows: (track) => {
    const out = [];
    for (let r = 0; r < 12; r++) if (onLaneGrid(r, track)) out.push(r);
    return out;
  },
  scrollX: (x) => { state.scrollX = Math.max(0, x); draw(); },
  right: () => { let f = Math.min(state.cursor.track*state.columns+state.cursor.col+1, state.tracks*state.columns-1);
                 state.cursor.track = Math.floor(f/state.columns); state.cursor.col = f%state.columns; follow(); draw(); },
  left: () => { let f = Math.max(0, state.cursor.track*state.columns+state.cursor.col-1);
                state.cursor.track = Math.floor(f/state.columns); state.cursor.col = f%state.columns; follow(); draw(); },
  setZoom: (z) => { state.zoom = z; draw(); },
  step: () => { state.cursor.row++; state.playhead = (state.playhead + 1) % TOTAL_ROWS; follow(); draw(); },
  totalRows: TOTAL_ROWS,
};
</script>
