<script type="module">
import { Tracker } from './src/tracker.js';
import { buildViewModel, ZOOM_LEVELS, createBuffer } from './src/viewmodel.js';
import M from './design/out/tokens.js';
import { connectEngine, noEngine } from './src/engine.js';
import { Chain } from './src/chain.js';
import { Harmony } from './src/harmony.js';
import { Minimap } from './src/minimap.js';
import { buildMinimapModel, createMinimapBuffer } from './src/minimapmodel.js';
import { Pending } from './src/pending.js';
import { createPending, propose, applyPending, settlePending,
         discardPending } from './src/pendingmodel.js';
import { buildHarmonyModel, createHarmonyBuffer } from './src/harmonymodel.js';
import { Palette } from './src/palette.js';
import { buildChainModel, createChainBuffer, paramKey } from './src/chainmodel.js';
import { createChrome, VIEW_TABS } from './src/chrome.js';
import { Arrange, ARRANGE_CLIP_MARGIN_PX } from './src/arrange.js';
import { buildArrangeModel, createArrangeBuffer, ARRANGE_ZOOM, trackName,
         TICKS_PER_BAR, snapLoop, wheelPixels, clampZoom } from './src/arrangemodel.js';
import { Mixer } from './src/mixer.js';
import { Scope } from './src/scope.js';
import { buildMixerModel, createMixerBuffer, createMixerState, reconcileMixer,
         gainAtPosition, FLAG_MUTE, FLAG_SOLO } from './src/mixermodel.js';
import { Piano } from './src/piano.js';
import { buildPianoModel, createPianoBuffer, PIANO_ZOOM, fitLowPitch,
         notesInRect, noteKey, transposedKey } from './src/pianomodel.js';
import { Browser, KIND_PLUGIN } from './src/browser.js';
import { Dock } from './src/dock.js';
import { createPanes } from './src/panes.js';
import { createHelp, GLOBAL_KEYS, SURFACE_KEYS } from './src/help.js';
import { Patcher } from './src/patcher.js';
import { buildPatcherModel, createPatcherBuffer, configFields, nudgeConfig,
         describeConfig, NODE_TYPES } from './src/patchermodel.js';
import { createEntry, feed, cancel, begin, parseToken, parseChord, editing, NOTE_KEYS, NOTE_OFF_KEY,
         TOKEN_KEY, pitchOf, pitchToToken, hexValue, shiftDigit } from './src/entry.js';

const metrics = {
  rowHeight: M.metrics.rowHeight,
  gutterWidth: M.metrics.gutterWidth,
  laneWidth: M.metrics.laneWidth,
  cellWidth: M.metrics.cellWidth,
  laneBarWidth: M.metrics.laneBarWidth,
};

const host = document.getElementById('tracker');
const head = document.getElementById('head');
const chrome = createChrome(document.getElementById('chrome'), {
  onView: (v) => { state.view = v; if (v === 'piano') fitPiano(); state.focus = 'centre'; schedule(); },
  onPlay: () => cmd('play'),
  onStop: () => { cmd('stop'); state.reject = null; schedule(); },
  // Hoisted through, not inlined: the same two functions back the dock commands
  // and the __uni hooks, so the button cannot grow behaviour the scriptable path
  // does not have. That divergence is the bug this app keeps finding.
  onAddTrack: () => addTrack(),
  onRemoveTrack: () => removeTrack(),
});
// No write path yet — the command ring needs a channel the write-only socket
// does not have. The buttons exist and say so rather than pretending.
function cmd(what) {
  // Starting or stopping the transport re-arms following: it is the moment you
  // are asking to watch the music rather than to look around it.
  if (what === 'play' || what === 'stop') state.followPlayhead = true;
  if (!conn || !conn.send({ type: what })) { state.link = 'no engine'; schedule(); }
}
const hud = document.getElementById('hud');
const tracker = new Tracker(host, metrics);
const arrangeHost = document.getElementById('arrange');
// The stage owns the split between the arrangement and the roll.
const stageEl = document.getElementById('stage');
const arrange = new Arrange(arrangeHost, metrics, {
  onLoop: (a, b, done, opts) => setLoopFromDrag(a, b, done, opts),
  /**
   * Wheel navigation: zoom under the pointer, pan sideways, scroll lanes.
   *
   * arrange.js has had all three since it was written — anchored zoom that keeps
   * the tick under the cursor still, a pixel-for-pixel horizontal pan, a clamped
   * lane scroll — and `onNav` was never passed. `_wheel` returns on its first
   * line when it is missing, so the whole gesture set was inert: the wheel did
   * nothing at all over the arrangement, in any combination of modifiers.
   *
   * Third time in this shell: splitter.js unbuilt, delDevice unreachable, and
   * now this. The code is right, the surface is right, and nobody joined them.
   *
   * `why` says which gesture it was; the zoom index and start tick are already
   * clamped by the caller against the zoom table and zero.
   */
  /**
   * Clicking a clip selects it.
   *
   * Stored as the "track:tick" STRING the model already parses (arrangemodel
   * splits on the colon to decide which clip to outline). An object would have
   * been a second shape for one fact, and the outline simply would not have
   * drawn — the selection would exist and be invisible.
   */
  onClipSelect: ({ track, tick }) => {
    state.selectedPlacement = `${track}:${tick}`;
    // The rack, the roll and the breadcrumb all follow the cursor's track, so
    // selecting a clip moves the cursor onto its lane. Otherwise you select a
    // clip on track 4 and everything else keeps talking about track 0.
    if (Number.isFinite(track) && track >= 0) state.cursor.track = track;
    schedule();
  },
  /**
   * Double-clicking a clip opens it in the roll, BELOW the arrangement.
   *
   * Both stay on screen — that is the design, and it is the point: choosing
   * which clip to work on and working on it are the same activity, and a build
   * that swaps between two full-window surfaces turns the arrangement into a
   * menu you visit.
   */
  onClipOpen: ({ track, tick }) => {
    state.selectedPlacement = `${track}:${tick}`;
    if (Number.isFinite(track) && track >= 0) state.cursor.track = track;
    // Put the roll where the clip is, so opening one shows its notes rather
    // than wherever the roll happened to be left.
    if (Number.isFinite(tick)) state.pianoStart = Math.max(0, tick);
    state.rollOpen = true;
    state.pianoFitPending = true;      // pick a sensible pitch window for it
    schedule();
  },
  onNav: (zoomIndex, startTick, laneScroll, why) => {
    state.arrangeZoom = clampZoom(zoomIndex);
    state.arrangeStart = Math.max(0, startTick);
    state.arrangeLaneScroll = Math.max(0, laneScroll);
    // A wheel is a request to look somewhere, so it takes the view off the
    // playhead — the same bargain the tracker's wheel makes.
    if (why === 'pan' || why === 'lanes') state.followPlayhead = false;
    schedule();
  },
});
const ARRANGE_LANE_H = 44;

/**
 * The loop the UI is showing: a drag in progress, else a set we sent and the
 * engine has not published back, else nothing and the engine's own span wins.
 *
 * Two overrides rather than one because they end differently. A drag ends when
 * the pointer lifts; a pending set ends when the engine agrees, and if the
 * engine refuses it the bracket has to snap back rather than sit there lying.
 */
let loopDrag = null;
let loopPending = null;
function loopOverride() { return loopDrag || loopPending; }

/**
 * Snap a dragged loop to whole bars, or to beats with Shift held.
 *
 * A loop is a musical span, and a bar is what one is almost always wanted in;
 * the sub-bar case is real but rare enough to be the modifier. The span is at
 * least one unit wide because the engine refuses end <= start, and a click that
 * silently did nothing would look like a broken ruler.
 */
function setLoopFromDrag(a, b, done, opts = {}) {
  if (opts.cancelled) { loopDrag = null; schedule(); return; }
  const { start: lo, end: hi } = snapLoop(a, b, opts.fine, songMeter());
  loopDrag = { start: lo, end: hi };
  if (!done) { schedule(); return; }
  loopDrag = null;
  if (!conn || !conn.send({ type: 'loop', start: lo, end: hi })) {
    state.reject = 'no engine';
    schedule();
    return;
  }
  // Stamped, because a pending value with no deadline is a bracket that lies
  // forever if the engine never agrees. The notes have the same reaper.
  loopPending = { start: lo, end: hi, at: performance.now() };
  state.reject = null;
  schedule();
}

/** How long the bracket may show a value the engine has not confirmed. */
const LOOP_PENDING_MS = 2000;

/** Drop the pending loop once the engine publishes it, or gives up. */
function reconcileLoop() {
  if (!loopPending || !engine) return;
  if (engine.loopStart === loopPending.start && engine.loopEnd === loopPending.end) {
    loopPending = null;
    return;
  }
  if (performance.now() - loopPending.at > LOOP_PENDING_MS) {
    // The engine did not take it. Snap back to what it actually has and say so,
    // rather than leaving a bracket that describes a loop nothing will play.
    loopPending = null;
    state.reject = 'the engine did not take that loop';
    schedule();
  }
}
let arrangeBuf = null;

// What we last SENT to the mixer. Not the truth any more — the engine publishes
// gain, pan and mute/solo back (SHM v12), and reconcileMixer drops these entries
// as it confirms them. See mixermodel.js.
const mixerState = createMixerState(16);
let mixerBuf = null;
let mixRevision = 0;
const mixerHost = document.getElementById('mixer');

function sendMixer(track) {
  const s = mixerState.strips[track];
  // Composed against this mixer version; the engine's next one settles it.
  s.pendingUntil = engine ? engine.mixerVersion : -1;
  mixRevision++;
  if (!conn || !conn.send({ type: 'mixer', track, gain: s.gain, pan: s.pan, flags: s.flags })) {
    state.reject = 'no engine';
  }
  schedule();
}

const patcherHost = document.getElementById('patcher');
let patcherBuf = null;
const patcher = new Patcher(patcherHost, {
  onSelect: (id) => { state.selectedNode = id; state.selectedField = 0; schedule(); },
});

/**
 * The engine's graph error codes, from daw_engine_main.cpp.
 *
 * Numbers, because that is what crosses the wire; named here because "the
 * engine refused that: code 3" is not an answer to anything. If a code arrives
 * that is not in this table it is printed as a number rather than swallowed —
 * a new code the engine learned is still news.
 */
const GRAPH_ERRORS = ['', 'no such node type', 'no such node', 'that would make a cycle',
                      'the engine could not add it', 'that connection is not allowed',
                      'those ports do not fit'];

/** One engine event as a line a person can read. */
function describeEngineEvent(e) {
  if (e.kind === 'patcher-error') {
    const why = GRAPH_ERRORS[e.code] || ('graph error ' + e.code);
    // Name the nodes when it is about an edge, the node when it is about a node.
    if (e.src !== e.dst && (e.src || e.dst)) return `${why} (#${e.src} to #${e.dst})`;
    return e.node ? `${why} (#${e.node})` : why;
  }
  if (e.kind === 'resync') {
    return `track ${e.track} republished (clip version ${e.clipVersion})`;
  }
  return `${e.kind.replace('-', ' ')} on track ${e.track} (code ${e.code})`;
}

/** The engine's node the patcher has selected, or null. */
function selectedPatcherNode() {
  if (!engine || state.selectedNode < 0) return null;
  for (const n of engine.patcherNodes) if (n.id === state.selectedNode) return n;
  return null;
}

/**
 * The last config we SENT for a node, kept until the engine reports it back.
 *
 * Two things need it. A second nudge before the engine has answered must build
 * on the first, or `patch 0 steps 3` sends 17 three times instead of 17, 18, 19.
 * And the box must show the value you just typed rather than the one the engine
 * has not caught up to — the same optimism the faders have, for the same reason.
 *
 * Keyed on node id, which backend confirmed is stable (unlike placement_id,
 * which is an index). The entry is dropped once the engine agrees, so an edit
 * the engine refuses reverts on screen instead of lying forever.
 */
const patchPending = new Map();

/** A node's config as far as this UI is concerned: what we sent, else what is. */
function configOf(node) {
  const sent = patchPending.get(node.id);
  return sent || node.config;
}

/**
 * Add, remove or connect nodes. The graph is the engine's, so all three are a
 * send and a wait — there is nothing sensible to show optimistically, because a
 * node the engine has not created yet has no id to draw.
 */
function sendGraph(msg) {
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  return true;
}

/**
 * Remove a device from a track.
 *
 * A named function because three callers need it — the rack's delete button, the
 * Backspace binding, and the __uni hook — and the first two were written against
 * `dockApi.delDevice`, which does not exist. The confirm appeared, the user said
 * yes, and the call threw `dockApi.delDevice is not a function`: the most
 * expensive possible moment to fail, after consent and before the work.
 */
function delDevice(track, device) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'deldevice', track, device });
  /**
   * ...and then ask what the chain is now.
   *
   * The engine publishes a chain diff when a device is ADDED and does not when
   * one is REMOVED. So the removal really happened — a later `reqchain` proves
   * it, the version had moved 4 to 6 — while the rack went on drawing the card
   * that was gone. You deleted a plugin and it sat there, which reads as the
   * delete having failed, so you press it again.
   *
   * The request is queued behind the removal on the same ring, so it is answered
   * after it. Reported to backend as an asymmetry worth fixing at the source;
   * asking is correct regardless, and cheap.
   */
  conn.send({ type: 'reqchain', track });
  state.reject = null;
  schedule();
  return true;
}

/** Add a node of the armed type. */
function addPatcherNode() {
  return sendGraph({ type: 'patchadd', nodeType: state.patchAddType, track: 0 });
}

/**
 * The engine's ceiling on tracks — kUiMaxTracks. Not a style choice: it is how
 * many the shared-memory region can publish, so a 65th track would exist in the
 * document and be invisible to every reader.
 */
const MAX_TRACKS = 64;

/**
 * Append a track (kShmVersion 22, AddTrack=46). v1 appends at the extent — there
 * is no insert-after until the engine grows a display-order field — so the new
 * lane always arrives at the end, which is at least somewhere you can predict.
 *
 * The cap is checked HERE as well as in the engine. The engine refuses loudly and
 * publishes nothing, which is correct but arrives as silence: the button would
 * look broken. Saying why locally costs one comparison.
 */
function addTrack() {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; return false; }
  const live = engine ? engine.trackCount : 0;
  if (live >= MAX_TRACKS) {
    state.reject = `${MAX_TRACKS} tracks is the limit`;
    schedule();
    return false;
  }
  conn.send({ type: 'addtrack' });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Remove a track by its STABLE id (RemoveTrack=47).
 *
 * Confirmed, because v1 is not undoable: track structure is outside the
 * store-swap undo model, which swaps clips and placements. Backend has logged
 * making it undoable as follow-up work, and this confirm comes out when that
 * lands — a confirm is what you do when you cannot offer undo, not a substitute
 * for it.
 *
 * Refuses a child track locally as well as engine-side. An aux stem is a view
 * into its parent's bus rather than a track in its own right, so the honest
 * answer names the parent instead of failing silently on a rejected command.
 */
function removeTrack(track) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; return false; }
  const t = track === undefined ? state.cursor.track : track;
  if (!engine || t < 0 || t >= engine.trackCount) {
    state.reject = 'no such track'; schedule(); return false;
  }
  const flags = engine.trackFlags ? engine.trackFlags[t] : 0;
  if ((flags & 2) !== 0) {
    state.reject = 'that is an aux stem — remove its instrument instead';
    schedule();
    return false;
  }
  // The last track is not removable. An empty track list has no cursor to put
  // anywhere and nothing to draw, and "delete everything" is what New Song is.
  let live = 0;
  for (let i = 0; i < engine.trackCount; i++) if ((engine.trackFlags[i] & 4) === 0) live++;
  if (live <= 1) { state.reject = 'the last track cannot be removed'; schedule(); return false; }

  const name = trackName(engine, t) || `track ${t + 1}`;
  if (!confirm(`Remove ${name}? This cannot be undone.`)) return false;
  conn.send({ type: 'removetrack', track: t });
  // Step the cursor off the track that is about to become a tombstone. The slot
  // stays in the array by design, so nothing moves it for us, and a cursor left
  // sitting on a removed lane would take keystrokes into a track that is gone.
  if (state.cursor.track === t) {
    let n = -1;
    for (let i = 0; i < engine.trackCount; i++) {
      if (i !== t && (engine.trackFlags[i] & 4) === 0) { n = i; if (i > t) break; }
    }
    if (n >= 0) state.cursor.track = n;
  }
  state.reject = null;
  schedule();
  return true;
}

/** Remove the selected node. Its edges go with it, on the engine's side. */
function removePatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (!sendGraph({ type: 'patchdel', node: node.id, track: 0 })) return false;
  state.selectedNode = -1;
  state.patchLinkFrom = null;
  return true;
}

/**
 * Connect in two steps: arm on the source, fire on the destination. Ports are
 * resolved by the sidecar from the two node types, so nobody types a port id.
 */
function linkPatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (state.patchLinkFrom === null) {
    state.patchLinkFrom = { id: node.id, type: node.type };
    state.reject = null;
    return true;
  }
  const from = state.patchLinkFrom;
  state.patchLinkFrom = null;
  if (from.id === node.id) { state.reject = 'a node cannot connect to itself'; return false; }
  return sendGraph({ type: 'patchlink', src: from.id, srcType: from.type,
                     dst: node.id, dstType: node.type, track: 0 });
}

/** Drop the pending entries the engine has confirmed. Once per engine frame. */
function reconcilePatcher() {
  if (!patchPending.size || !engine) return;
  for (const id of patchPending.keys()) {
    const n = engine.patcherNodes.find((x) => x.id === id);
    // A node that left the graph takes its pending edit with it. Without this the
    // map is keyed on something the engine can stop publishing, which is a slow
    // leak and a stale value waiting for an id to be reused.
    if (!n) { patchPending.delete(id); continue; }
    const sent = patchPending.get(id);
    let same = true;
    for (let i = 0; i < 8; i++) if (n.config[i] !== sent[i]) { same = false; break; }
    if (same) patchPending.delete(id);
  }
}

/**
 * Nudge one field of the selected node. Returns the config sent, or null.
 *
 * All eight values go back, the edited one aside exactly as they were read; the
 * sidecar packs them into the type's byte layout. Packing here would put a
 * second copy of a layout that is not a struct next to the one that is — and the
 * engine rebuilds the whole config from what it receives, so a value this UI
 * dropped is a value the engine zeroes.
 */
function nudgePatcher(dir) {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return null; }
  const next = nudgeConfig(node.type, configOf(node), state.selectedField, dir);
  if (!next) { state.reject = 'that node has no editable configuration'; return null; }
  const msg = { type: 'patchcfg', node: node.id, nodeType: node.type, track: 0 };
  for (let i = 0; i < 8; i++) msg['c' + i] = next[i];
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return null; }
  patchPending.set(node.id, next);
  state.reject = null;
  return next;
}

// The two refusals a plugin row can produce, interned. The first is the state
// of the world and not the user's fault; the second is the scanner's own reason
// repeated back, because a row that says "failed" and will not say how is a row
// you have to go and investigate elsewhere.
// Declared ABOVE the handler that reads them: `const` does not hoist, and four
// temporal-dead-zone bugs in this file is four more than enough (GUIDELINES 2.2).
const PLUGIN_SCAN_REFUSAL = 'that plugin did not scan: ';
const PLUGIN_NO_SLOT = 'that plugin has no place in the engine\'s scan, so it cannot be named';

/**
 * The device kinds the engine counts as instruments — device_chain.h's
 * DeviceKind, mirrored because the rule below depends on it.
 *
 * A chain may hold exactly one (device_chain.cpp isInstrumentKind/hasInstrument),
 * which is a real musical rule and not a limitation: a track is one voice.
 */
const KIND_PATCHER_INSTRUMENT = 1;
const KIND_VST_INSTRUMENT = 3;
function chainHasInstrument(track) {
  const here = chains[track];
  const devices = here && here.devices;
  if (!devices) return false;
  for (let i = 0; i < devices.length; i++) {
    const k = devices[i].kind;
    if (k === KIND_PATCHER_INSTRUMENT || k === KIND_VST_INSTRUMENT) return true;
  }
  return false;
}

/**
 * The plugin an AddDevice was just sent for, so the answer can be checked.
 *
 * The insert selects a plugin by its INDEX in the engine's scan, and the
 * catalogue this side lists is a snapshot of the file the engine scanned. If
 * anything rescans in between, that index means a different plugin — the same
 * shape as the vstRef bug one level up, and it cannot be prevented from here
 * because the command carries no room for an identity.
 *
 * So it is detected instead. The rack republishes on change; when it does, the
 * device that arrived is compared against the plugin that was asked for, and a
 * mismatch is reported rather than drawn. A wrong plugin that announces itself is
 * recoverable; one that looks right is not.
 */
let pendingInsert = null;

const browserHost = document.getElementById('browser');
const browser = new Browser(browserHost, {
  onSave: (name) => {
    if (!conn || !conn.saveProject(name)) { state.reject = 'no engine'; schedule(); return; }
    state.currentProject = name;
    // The engine writes the file after it processes the command, and there is no
    // ack for "the file exists now" — an immediate re-list returns the old set and
    // the project you just saved is missing from its own browser. Re-list once the
    // write has plausibly landed; the rail also re-lists whenever it opens.
    setTimeout(() => { if (conn) { conn.send({ type: 'list' }); schedule(); } }, 700);
    state.reject = null;
    schedule();
  },
  /**

  // Wanted AND room for it. Two inputs, one visibility — and the focus model

  const showRail = state.browserOpen && state.roomForRail;
  const showChain = state.roomForChain;

  if (browserHost.hidden === showRail) browserHost.hidden = !showRail;

  // before they do anything — the project list by CONTENT (the host rebuilds it
  // in place, so a rename keeps the array) and the catalogue by IDENTITY (it
  // comes from a JSON.parse, so a new reply is always a new array). Neither
  // rebuilds a row unless something actually moved.

  // song's density and painting a canvas for a strip that `hidden` had already

  if (wantMinimap) {

    const zl = ZOOM_LEVELS[state.zoom];

    //

    // are editing: scroll down to the F major bar and the card still said A

    // your attention is, so that is the harmony worth naming; on the other

     * cursor has SETTLED on a track.

     * host. Firing one the instant the cursor touches a track meant walking
     * across six tracks fired six host queries, none of whose answers anybody
     * looked at, while the audio thread was running. Cheap on this side and not
     * on the other, which is the kind of cost that does not show up until it is
     * someone else's problem.

     * this track" and "I am passing through it".

    // per device per frame purely to probe a Set, and a for-of iterator on top —
    // and it did so on every frame forever, because once every device has been
    // asked the loop still walks the whole chain to discover there is nothing
    // left to ask. Device ids are engine-assigned and small, so packing the pair
    // into one number is exact and free.
    if (settled && here && here.devices && conn && conn.canSend()) {
      const devs = here.devices;
      for (let i = 0; i < devs.length; i++) {
        const key = state.cursor.track * 65536 + devs[i].id;
        if (paramsAsked.has(key)) continue;
        paramsAsked.add(key);

        break;                        // one per frame; the rest follow
      }
    }
    const o = _chainOpts;
    o.track = state.cursor.track;
    o.chains = chains;
    o.selected = state.chainSelected;
    o.trackName = trackName(engine, state.cursor.track);
    o.params = deviceParams;
    chain.render(buildChainModel(o, chainBuf));
    /**

     * it. Delete the selected device and the selection is gone, so the focus goes
     * home to the tracker on its own.
     *
     * An invariant checked here rather than a line in the delete handler, because
     * the selection can go away in more ways than one: the device is removed, the
     * cursor moves to a track with no devices, the engine republishes a shorter
     * chain, a project is loaded. Every one of those would otherwise leave the
     * keyboard parked in a pane with nothing in it — which is the original bug
     * (keys going somewhere the eye is not) wearing the opposite sign.
     */
    if (state.focus === 'chain') {

  const wantArrange = v === 'arrange', wantMixer = v === 'mixer', wantPiano = v === 'piano';

   * the split class is what tells #stage to give each an edge to stop at.
   */
  const splitRoll = wantArrange && state.rollOpen;

    stageEl.classList.toggle('stage-split', splitRoll);

  if (patcherHost.hidden === wantPatcher) patcherHost.hidden = !wantPatcher;
  if (arrangeHost.hidden === wantArrange) arrangeHost.hidden = !wantArrange;
  if (mixerHost.hidden === wantMixer) mixerHost.hidden = !wantMixer;
  if (pianoHost.hidden === showPiano) pianoHost.hidden = !showPiano;

     * `measure()` now refuses to record one — which means whatever it holds is
     * from before it was hidden. If a pane was dragged in the meantime, that
     * geometry is stale: lanes are where they used to be, and a click lands a
     * track or two off, or nowhere.

     * is set, so the boxes being read are the ones now on screen.

    if (trackerOn) tracker.measure();

  // arrangement left for it.

  if (wantMixer) return drawMixer();

  // build sees the same shape whether or not a cell is being typed into.

    _entryOverlay.col = entry.col; _entryOverlay.text = entry.text;

  o.nameHarmony = nameHarmony;
  // Bar NUMBERING in the time gutter, which counts the SONG's bars. A clip in a
  // different meter draws its own accents inside one of them; that grid comes off
  // the clip, not off this.
  o.meter = songMeter();
  // Only when something is actually collapsed. Passing the array unconditionally

  // fold them per display row. Without this "1 bar" and "4 bars" both requested
  // 1 line/beat, got identical data, and drew beat-resolution contours stretched
  // across bar rows — right-looking and wrong by 4x and 16x.
  const zl = ZOOM_LEVELS[state.zoom];

   * The header, AFTER the renderer has measured.
   *

   * applies the fold and the bar-column visibility and then re-measures. Built
   * before that — which is where this used to sit — it takes the PREVIOUS frame's
   * geometry, stamps the current signature on itself, and never rebuilds: the
   * headers of three folded children stayed 270px wide over lanes that were zero.
   * A derived value has to come after the thing it derives from, and stamping the
   * key of a state you have not read yet is how that goes wrong quietly.
   */
  const stride = tracker.trackStride
    || metrics.cellWidth * state.columns + metrics.laneBarWidth;   // cold start, before measure()
  // Keyed on the stride AND on both visibility signatures. Which lanes carry a bar
  // readout, and which are folded under a collapsed parent, both change individual
  // track widths while leaving the widest one alone — so a stride-only test misses
  // each of them and every header past the change sits over the wrong lane. That is
  // GUIDELINES 2.1 twice in one line: the key has to name everything the value is
  // computed from, and "the widths" has three inputs now.
  if (!headRow || headRow._tracks !== state.tracks || headRow._stride !== stride
      || headRow._laneSig !== tracker._laneSig
      || headRow._hiddenSig !== tracker._hiddenSig) buildHead();

    // this is a guarded write whose input is 0 for most of a session.
    headRow.style.transform = 'translateX(-' + state.scrollX + 'px)';

// Input is coalesced into one draw per animation frame. Without this, key
// repeat fires a synchronous draw per keydown — at ~30/s against an 8 ms draw
// that is a quarter of the main thread and several draws can queue inside one
// frame, which is what makes a held zoom or scroll key feel like it lags even
// though a single press is comfortably inside budget.
// Keep the cursor away from both edges of the VIEWPORT — not of the pool. The
// pool is larger than the viewport by the overscan, so thresholding against it
// put the trigger at row 89 of 92 visible: you could press down eighty-nine
// times and nothing would move, which reads as "scrolling is broken".
//
// The cursor centres and the timeline moves under it — the tracker convention
// (Renoise, OpenMPT). It also means scrolling starts on the very first keypress
// that crosses the middle, instead of after a long dead zone.
/**
 * Keep the playhead in view while the transport runs.
 *
 * Every DAW does this and this one did not: at 1/48 the tracker's 62 rows are
 * about five beats, so the playhead left the window within a second and stayed
 * gone. Following is on by default and switches OFF the moment you scroll or
 * move the cursor yourself — looking somewhere else during playback is a
 * deliberate act, and yanking the view back is the wrong answer to it. `F`
 * turns it back on, and starting the transport does too.
 */
function followPlayhead() {
  if (!state.followPlayhead || !engine || !engine.transport) return;
  const tick = engine.playheadTick;

  if (state.view === 'tracker') {
    const row = Math.floor(tick / ZOOM_LEVELS[state.zoom].rowNanoticks);
    const visible = Math.max(1, tracker.poolSize);
    // A margin, not an edge: pinning the playhead to the last row means you
    // never see what is coming.
    if (row < state.start + 2 || row >= state.start + visible - 4) {
      state.start = Math.max(0, row - Math.floor(visible / 3));
    }
    return;
  }
  if (state.view === 'arrange' && arrangeBuf) {
    const span = arrangeBuf.view.ticksPerPixel * arrangeBuf.view.width;
    if (tick < arrangeBuf.view.startTick || tick > arrangeBuf.view.startTick + span * 0.85) {
      state.arrangeStart = Math.max(0, tick - span / 4);
    }
    return;
  }
  if (state.view === 'piano' && pianoBuf) {
    const span = pianoBuf.view.ticksPerPixel * pianoBuf.view.width;
    if (tick < pianoBuf.view.startTick || tick > pianoBuf.view.startTick + span * 0.85) {
      state.pianoStart = Math.max(0, tick - span / 4);
    }
