const host = document.getElementById('tracker');
const head = document.getElementById('head');
const paneTop = document.getElementById('paneTop');
const paneBot = document.getElementById('paneBot');
const paneEdge = document.getElementById('paneEdge');
const trackerPane = document.getElementById('trackerPane');
const chrome = createChrome(document.getElementById('chrome'), {
  // The entry cluster mounts in the breadcrumb row. See createChrome: the top bar is out of
  // horizontal room once the design's readouts are in it, and the design has no entry state

  secondaryHost: document.getElementById('crumb'),
  onView: (v) => { state.view = v; if (v === 'piano') fitPiano(); state.focus = 'centre'; schedule(); },
  onPlay: () => cmd('play'),
  onStop: () => stopOrPanic(),
  // Hoisted through, not inlined: the same two functions back the dock commands
  // and the __uni hooks, so the button cannot grow behaviour the scriptable path
  // does not have. That divergence is the bug this app keeps finding.
  onAddTrack: () => addTrack(),
  onRemoveTrack: () => removeTrack(),
  /*
   * THE SCALE BUTTON, WIRED TO SOMETHING.
   *
   * `createChrome` has taken an `onScales` click handler since it was written and nothing ever
   * passed one, so the button drew the current key, said "Scale browser" in its tooltip, and did

   * It opens the palette seeded with `harmony `, which is the scale browser this app actually
   * has: the command's `scale` argument is a `oneOf` over the engine's own registry, so the
   * palette lists every scale the engine knows and completes it. Nothing new is invented, the
   * pointer path and the console path are one function, and the button now does what it says.
   */
  onScales: () => { palette.open('harmony '); schedule(); },
  // The pointer's way into the automation mode. Same function the `draw` command calls, so the
  // button and the console cannot come to mean different things by "draw".
  onDraw: () => setAutomationEdit(),
});
// No write path yet — the command ring needs a channel the write-only socket
// does not have. The buttons exist and say so rather than pretending.
/**
 * Stop, and PANIC on a second press.
 *
 * Stop halts and rewinds and flushes held keyjazz notes. It does not silence a
 * plugin's own ringing voices, a sustained sequencer note whose note-off has not
 * been reached, or a generator mid-phrase — so after Stop the room can still be
 * full of sound, which is exactly when a person reaches for panic.
 *
 * The SECOND press, not a key of its own, because that is what hardware does and
 * because a panic key you have to look up is a panic key you do not have. The
 * transport's published state is what tells the two apart: already stopped means
 * this press is the second one.
 *
 * Panic (UiCommandType 52) sends CC123 then CC120 on all sixteen channels to
 * every hosted plugin — 120 last, because 123 releases a note and lets it ring
 * where 120 cuts it, and politely releasing a four-second pad is not a panic. It
 * also drops each track's pending strikes, without which a scheduled retrigger
 * fires after the panic and the sound comes back on its own.
 */
let lastWasStop = false;
function stopOrPanic() {
  /*
   * TWICE means two stops in a row, not "the transport is stopped".
   *
   * Reading the transport alone was wrong and the suite caught it: PAUSE also
   * leaves the transport at 0, so play-pause-stop panicked instead of stopping,
   * and the playhead never rewound. Pause is not stop.
   *
   * The flag is cleared by anything else that moves the transport, so "stop,
   * play a bit, stop" is two first-presses and not a panic.
   */
  const panic = lastWasStop;
  lastWasStop = true;
  cmd(panic ? 'panic' : 'stop');
  state.reject = null;
  // Said out loud, in the app's one transient-message slot. A panic that
  // silences everything and shows nothing is indistinguishable from a key that
  // did not register, and the moment you most need to know it worked is the
  // moment you pressed it. The slot is named `reject` because refusals were the
  // first thing to use it; the wording carries what this one is.
  if (panic) state.reject = 'panic — all notes off';
  schedule();
}

function cmd(what) {
  // Anything that is not a stop ends a stop run, so the next stop is a first
  // press again.
  if (what !== 'stop' && what !== 'panic') lastWasStop = false;
  // Starting or stopping the transport re-arms following: it is the moment you
  // are asking to watch the music rather than to look around it.
  if (what === 'play' || what === 'stop') state.followPlayhead = true;
  if (!conn || !conn.send({ type: what })) { state.link = 'no engine'; schedule(); }
}
const hud = document.getElementById('hud');
const tracker = new Tracker(host, metrics);
const arrangeHost = document.getElementById('arrange');
// The stage owns the split between the arrangement and the roll.
const stageEl = document.getElementById('stage');

/**
 * How many cells one note column costs: the note, its velocity, its effect.
 *
 * A TRACK now shows `noteColumns * FIELDS_PER_NOTE` of them, so two notes on one
 * row live in two columns instead of collapsing into "2 evts". The engine has
 * carried a per-note `column` since before the web UI existed, and the page
 * never sent one — so every note it wrote went to column 0 and simultaneous
 * notes collided BY CONSTRUCTION. That is the whole of the "there's no way for
 * me to edit or even view the data" complaint.
 *
 * Global rather than per-track for now: `track * columns + col` is the field
 * index the cursor, the selection and the renderer all share, and making the
 * stride vary per track changes every one of those. A track that needs one
 * column shows empty cells where a busier track has notes, which is what a
 * tracker looks like anyway.
 */
/**
 * How many note columns a track shows.
 *
 * Not derived alone: a track needs an EMPTY column before a second note can be
 * typed into it, and a count derived purely from the notes present can never
 * offer one. Asking for more is how a chord gets written; the count still rises
 * by itself for a project that already uses more than you asked for.
 */
/**
 * Set the key at a point on the harmony timeline.
 *
 * Harmony could be READ from every surface — the right-hand pane names the key
 * and its degrees, the tracker has a harmony column, the chrome shows it — and
 * WRITTEN from nowhere. There was no command, no key and no control: the engine
 * has taken WriteHarmony since long before this UI and daw-cli builds it, while
 * the app that shows you the key could not change it.
 *
 * `root` is a pitch class, 0..11 from C. `scale` is a scale id as the engine
 * publishes them — see `__uni.scales()`, which is where the names come from, so
 * a caller can say "Minor" without this file owning a second table.
 */
/**
 * Remove a key change from the harmony timeline, by TICK.
 *
 * The other half of setHarmony, and missing for the same reason it was: harmony could be
 * read from every surface in the app and written from none, and once writing landed a key
 * change could be added and never taken off. A timeline you can only add to is one you
 * stop using.
 *
 * The HARMONY version, not the clip's — same guard, same trap: sending nothing means base
 * 0, which matches only an engine whose harmony has never changed, so it would work once
 * and be silently refused after any project load.
 */
function deleteHarmony(tick) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'delharmony', tick: Math.max(0, Math.round(tick || 0)),
              base: engine ? engine.harmonyVersion : 0 });
  state.reject = null;
  schedule();
  return true;
}

function setHarmony(root, scale, tick) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const r = ((Math.round(root) % 12) + 12) % 12;
  const sc = Math.max(0, Math.round(scale) || 0);
  conn.send({ type: 'harmony', root: r, scale: sc,
              tick: Math.max(0, Math.round(tick || 0)),
              /**
               * The HARMONY version, not the clip's.
               *
               * `requireMatchingHarmonyVersion(payload.baseVersion, ...)` guards
               * this command, and sending nothing means base 0 — which matches
               * only on an engine whose harmony has never changed. So it worked
               * on a fresh start and was SILENTLY REFUSED after any project load,
               * while the console still answered "key set". A command that
               * reports success and does nothing is the worst of the three
               * possible outcomes.
               */
              base: engine ? engine.harmonyVersion : 0 });
  state.reject = null;
  schedule();
  return true;
}

/** A scale id from a name, case-insensitively, or NaN. */
function scaleIdNamed(name) {
  const want = String(name).trim().toLowerCase();
  for (const s of (scales || [])) {
    if (String(s.name).toLowerCase() === want) return s.id;
  }
  const n = Number(name);
  return Number.isFinite(n) ? n : NaN;
}

function uniNoteColumns(n) {
  if (n !== undefined) {
    state.noteColumnsWanted = Math.max(1, Math.min(MAX_NOTE_COLUMNS, Math.floor(n) || 1));
    _noteColsRev = -1;                   // force the derivation to run again
    schedule();
  }
  return state.noteColumns;
}

const FIELDS_PER_NOTE = 3;
/** Most note columns a track may show. Renoise stops at 12; this is a screen. */
const MAX_NOTE_COLUMNS = 8;
/** Which field of a note column this cell is: 0 note, 1 velocity, 2 effect. */
const fieldOfCol = (col) => col % FIELDS_PER_NOTE;
/** Which note column this cell belongs to. */
const noteColOf = (col) => Math.floor(col / FIELDS_PER_NOTE);
const arrange = new Arrange(arrangeHost, metrics, {
  onLoop: (a, b, done, opts) => setLoopFromDrag(a, b, done, opts),
  /**
   * Wheel navigation: zoom under the pointer, pan sideways, scroll lanes.
   *
   * arrange.js has had all three since it was written — anchored zoom that keeps
   * the tick under the cursor still, a pixel-for-pixel horizontal pan, a clamped
   * lane scroll — and `onNav` was never passed. `_wheel` returns on its first
   * line when it is missing, so the whole gesture set was inert: the wheel did
   * nothing at all over the arrangement, in any combination of modifiers.
   *
   * Third time in this shell: splitter.js unbuilt, delDevice unreachable, and
   * now this. The code is right, the surface is right, and nobody joined them.
   *
   * `why` says which gesture it was; the zoom index and start tick are already
   * clamped by the caller against the zoom table and zero.
   */
  /**
   * Clicking a clip selects it.
   *
   * Stored as the "track:tick" STRING the model already parses (arrangemodel
   * splits on the colon to decide which clip to outline). An object would have
   * been a second shape for one fact, and the outline simply would not have
   * drawn — the selection would exist and be invisible.
   */
  onClipSelect: ({ track, tick }) => {
    state.selectedPlacement = `${track}:${tick}`;
    // The rack, the roll and the breadcrumb all follow the cursor's track, so
    // selecting a clip moves the cursor onto its lane. Otherwise you select a
    // clip on track 4 and everything else keeps talking about track 0.
    if (Number.isFinite(track) && track >= 0) state.cursor.track = track;
    schedule();
  },
  /**
   * Double-clicking a clip opens it in the roll, BELOW the arrangement.
   *
   * Both stay on screen — that is the design, and it is the point: choosing
   * which clip to work on and working on it are the same activity, and a build
   * that swaps between two full-window surfaces turns the arrangement into a
   * menu you visit.
   */
  onClipOpen: ({ track, tick }) => {
    state.selectedPlacement = `${track}:${tick}`;
    if (Number.isFinite(track) && track >= 0) state.cursor.track = track;
    // Put the roll where the clip is, so opening one shows its notes rather
    // than wherever the roll happened to be left.
    if (Number.isFinite(tick)) state.pianoStart = Math.max(0, tick);
    // The roll, in the second pane. Was `rollOpen`; it is a view name now, so
    // the same machinery serves arrange-over-patcher.
    state.view2 = 'piano';
    state.pianoFitPending = true;      // pick a sensible pitch window for it
    schedule();
  },
  /**
   * A finished drag: move, trim, or drag to another lane.
   *
   * Sent as ONE command, which is the whole reason the engine's ResizePlacement
   * carries a start and a length together. A left-edge trim is both edges
   * moving; expressing it as a move followed by a resize would make the clip
   * travel through a position nobody asked for, visible for a frame and audible
   * if it happens during playback.
   *
   * Nothing is applied locally. The block does not move until the engine
   * publishes it moved — see `_clipGhost`. That is slower by a frame and it is
   * the honest version: the engine CLAMPS a move that would cross a neighbour,
   * so a clip drawn where the pointer left it would be showing a position the
   * song does not have.
   */
  onClipEdit: ({ op, id, track, at, len, toTrack, startUnchanged, laneRefused }) => {
    if (!Number.isFinite(id) || id < 0) {
      // A drag that crossed lanes when the engine cannot. Said out loud rather
      // than swallowed: a gesture whose vertical half silently did nothing reads
      // as the app being broken. Dead while cross-track is on, kept because the
      // flag can go back.
      if (laneRefused) { state.reject = 'moving a clip between tracks is not supported yet';
                         schedule(); }
      return;
    }
    const msg = { type: 'placement', op, track, id };
    if (op === 'move') {
      msg.at = Math.round(at);
      if (toTrack !== undefined) msg.toTrack = toTrack;
    } else {
      // A right-edge drag omits `at` entirely, which the sidecar turns into the
      // "leave it" sentinel. Sending the unchanged start instead would work
      // today and break the moment the engine starts treating a start it was
      // given as a deliberate reposition.
      if (!startUnchanged) msg.at = Math.round(at);
      msg.len = Math.round(len);
    }
    sendPlacement(msg);
    if (laneRefused) state.reject = 'moving a clip between tracks is not supported yet';
  },
  /**
   * THE SPINE's gestures, each landing on the SAME function the console calls.
   *
   * Select is local — which marker you are looking at is nobody else's business — but the id it
   * stores is the id the console names, so `delmarker` with no argument and a click on the strip
   * are talking about one thing.
   *
   * THE BOUNDARY DRAG IS NOT A MARKER OP. It sends `insertTime`, which moves music: everything
   * at or after the next marker's tick, in one transaction the engine refuses whole and undoes
   * whole. The four marker ops move nothing at all. Keeping those two apart is the whole point
   * of the v29 contract — editing a label used to ripple the song as a side effect.
   */
  onMarkerSelect: (id) => {
    // Clicking the selected one again clears it. A selection you cannot drop is a mode.
    state.selectedMarker = state.selectedMarker === id ? 0 : id;
    schedule();
  },
  onTimeEdit: ({ tick, bars }) => insertTime(tick, bars),
  onMarkerAdd: () => addMarker(engine ? engine.playheadTick : 0, 'Marker'),
  onMarkerDelete: (id) => {
    // With nothing selected this says which action is missing rather than guessing at a marker.
    if (!id) { state.reject = 'select a marker first'; schedule(); return false; }
    return delMarker(id);
  },
  onMarkerRename: (id, was) => {
    // `prompt` rather than an inline editor, deliberately and for now: the strip is 17px tall
    // and an in-place field there would be a second text-entry implementation to keep in step
    // with the mixer's rename for the sake of one row.
    const next = window.prompt('Marker name', was || '');
    if (next === null) return;                       // cancelled is not a rename
    nameMarker(id, next);
  },
  /**
   * PRESSING THE SHARED BADGE.
   *
   * On a shared placement it FORKS — that is the act the badge is warning you might want. On a
   * forked one it SWAPS, because the badge has become the A/B and that is the only thing anyone
   * does with a fork afterwards.
   *
   * Both land on the same functions `fork` and `swapclip` call, so the pointer and the console
   * cannot drift into meaning different things by "fork this".
   */
  onClipFork: ({ track, placement, forked }) => (forked
    ? swapClipAt(track, placement)
    : forkAt(track, placement)),
  /*
   * DRAGGING A POINT ON THE CURVE.
   *
   * Lands on `writeAutomation` — the same function `autopoint` calls — so the pointer and the
   * console cannot come to mean different things by "set this point". The surface owns the
   * gesture and this owns what a point IS, which is the same split every other control here
   * makes.
   *
   * The lane's discreteness is NOT passed: it is fixed when the clip is created and the engine
   * ignores the flag afterwards, so sending a guess would be this side asserting something it
   * does not decide.
   */
  onAutomationWrite: ({ track, param, tick, value }) =>
    writeAutomation(track, param, tick, value),
  onNav: (zoomIndex, startTick, laneScroll, why) => {
    state.arrangeZoom = clampZoom(zoomIndex);
    state.arrangeStart = Math.max(0, startTick);
    state.arrangeLaneScroll = Math.max(0, laneScroll);
    // A wheel is a request to look somewhere, so it takes the view off the
    // playhead — the same bargain the tracker's wheel makes.
    if (why === 'pan' || why === 'lanes') state.followPlayhead = false;
    schedule();
  },
});
const ARRANGE_LANE_H = 44;

/**
 * Published track flags. bit0 collapsed, bit1 aux child, bit2 absent (a
 * tombstone left by RemoveTrack so later ids do not renumber), bit3 master.
 *
 * The master rides the same array as the ordinary tracks so its chain and fader
 * are addressable by id, and it must be kept out of anything that draws LANES:
 * it has no clips, no placements and no notes.
 */
const TRACK_FLAG_MASTER = 8;

/**
 * The master's stable track id (daw-bridge MASTER_TRACK_ID, 0xFFFF0000).
 *
 * A sentinel far outside the ordinary id space on purpose: the master rides the
 * same track array and the same chain commands as everything else, so its id has
 * to be one no real track can ever take.
 */
const MASTER_TRACK_ID = 0xFFFF0000;

/**
 * The loop the UI is showing: a drag in progress, else a set we sent and the
 * engine has not published back, else nothing and the engine's own span wins.
 *
 * Two overrides rather than one because they end differently. A drag ends when
 * the pointer lifts; a pending set ends when the engine agrees, and if the
 * engine refuses it the bracket has to snap back rather than sit there lying.
 */
let loopDrag = null;
let loopPending = null;
function loopOverride() { return loopDrag || loopPending; }

/**
 * The placement the selection points at, as the engine describes it.
 *
 * The SELECTION is (track, startTick) — content-derived, because that is what
 * survives the extents reordering under it. A COMMAND needs the placement id,
 * which only the engine's own record has. So this is the one place the two
 * identities meet, and it is a lookup rather than a stored id on purpose: an id
 * captured at selection time is stale the moment anything else edits the song,
 * and "stale id that still resolves to a different clip" is the failure this
 * codebase has now hit three times.
 *
 * Returns null when the selection names nothing — a clip deleted from another
 * pane, or a project loaded since. Every caller treats that as "do nothing",
 * which is right: acting on a guess here moves the wrong clip.
 */
function selectedPlacement() {
  const key = state.selectedPlacement;
  if (!key || !engine) return null;
  const colon = String(key).indexOf(':');
  if (colon <= 0) return null;
  const track = +String(key).slice(0, colon);
  const tick = +String(key).slice(colon + 1);
  for (let i = 0; i < engine.extentCount; i++) {
    const e = engine.extents[i];
    if (e.track === track && e.startTick === tick) {
      return { id: e.placementId, track: e.track, clipId: e.clipId,
               startTick: e.startTick, endTick: e.endTick };
    }
  }
  return null;
}

/**
 * Snap a dragged loop to whole bars, or to beats with Shift held.
 *
 * A loop is a musical span, and a bar is what one is almost always wanted in;
 * the sub-bar case is real but rare enough to be the modifier. The span is at
 * least one unit wide because the engine refuses end <= start, and a click that
 * silently did nothing would look like a broken ruler.
 */
function setLoopFromDrag(a, b, done, opts = {}) {
  if (opts.cancelled) { loopDrag = null; schedule(); return; }
  const { start: lo, end: hi } = snapLoop(a, b, opts.fine, songMeter());
  loopDrag = { start: lo, end: hi };
  if (!done) { schedule(); return; }
  loopDrag = null;
  if (!conn || !conn.send({ type: 'loop', start: lo, end: hi })) {
    state.reject = 'no engine';
    schedule();
    return;
  }
  // Stamped, because a pending value with no deadline is a bracket that lies
  // forever if the engine never agrees. The notes have the same reaper.
  loopPending = { start: lo, end: hi, at: performance.now() };
  state.reject = null;
  schedule();
}

/** How long the bracket may show a value the engine has not confirmed. */
const LOOP_PENDING_MS = 2000;

/** Drop the pending loop once the engine publishes it, or gives up. */
function reconcileLoop() {
  if (!loopPending || !engine) return;
  if (engine.loopStart === loopPending.start && engine.loopEnd === loopPending.end) {
    loopPending = null;
    return;
  }
  if (performance.now() - loopPending.at > LOOP_PENDING_MS) {
    // The engine did not take it. Snap back to what it actually has and say so,
    // rather than leaving a bracket that describes a loop nothing will play.
    loopPending = null;
    state.reject = 'the engine did not take that loop';
    schedule();
  }
}
let arrangeBuf = null;

// What we last SENT to the mixer. Not the truth any more — the engine publishes
// gain, pan and mute/solo back (SHM v12), and reconcileMixer drops these entries
// as it confirms them. See mixermodel.js.
const mixerState = createMixerState(64);
let mixerBuf = null;
let mixRevision = 0;
const mixerHost = document.getElementById('mixer');

/**
 * @param {number} track a lane index, or -1 for the MASTER.
 *
 * -1 is the app's existing spelling for the master — it is what every routing dropdown
 * stores for "Main" — so the mixer's pointer handlers need no separate case. It becomes
 * `MASTER_TRACK_ID` on the wire, which is 0xFFFF0000 and deliberately outside the track
 * range so every per-track handler's `trackId >= kUiMaxTracks` guard rejects it; the
 * engine's SetTrackMixer handler is one of the few that names the master explicitly and
 * routes it to the master runtime, whose gain and mute the audio callback reads each
 * block to attenuate the summed output.
 */
function mixerLocal(track) {
  return track < 0 ? mixerState.master : mixerState.strips[track];
}

function sendMixer(track) {
  const s = mixerLocal(track);
  // Composed against this mixer version; the engine's next one settles it.
  s.pendingUntil = engine ? engine.mixerVersion : -1;
  mixRevision++;
  const id = track < 0 ? MASTER_TRACK_ID : track;
  if (!conn || !conn.send({ type: 'mixer', track: id, gain: s.gain, pan: s.pan, flags: s.flags })) {
    state.reject = 'no engine';
  }
  schedule();
}

const patcherHost = document.getElementById('patcher');
let patcherBuf = null;
const patcher = new Patcher(patcherHost, {
  onSelect: (id) => { state.selectedNode = id; state.selectedField = 0; schedule(); },
  /** Clicking a row picks that field, so the keyboard carries on from there. */
  onFieldPick: (id, at) => { state.selectedNode = id; state.selectedField = at; schedule(); },
  /**
   * Dragging a row changes it.
   *
   * Through `nudgePatcher`, which is the same function the arrow keys call — one
   * clamp, one pending-edit record, one refusal message. A second path that
   * built its own config would drift from the keyboard's the first time either
   * changed, and this file has that scar already.
   */
  onFieldDrag: (id, at, steps) => {
    state.selectedNode = id; state.selectedField = at;
    const dir = steps < 0 ? -1 : 1;
    for (let i = 0; i < Math.abs(steps); i++) { if (!nudgePatcher(dir)) break; }
    schedule();
  },
});

/**
 * The engine's graph error codes, from daw_engine_main.cpp.
 *
 * Numbers, because that is what crosses the wire; named here because "the
 * engine refused that: code 3" is not an answer to anything. If a code arrives
 * that is not in this table it is printed as a number rather than swallowed —
 * a new code the engine learned is still news.
 */
const GRAPH_ERRORS = ['', 'no such node type', 'no such node', 'that would make a cycle',
                      'the engine could not add it', 'that connection is not allowed',
                      'those ports do not fit'];

/** One engine event as a line a person can read. */
function describeEngineEvent(e) {
  if (e.kind === 'patcher-error') {
    const why = GRAPH_ERRORS[e.code] || ('graph error ' + e.code);
    // Name the nodes when it is about an edge, the node when it is about a node.
    if (e.src !== e.dst && (e.src || e.dst)) return `${why} (#${e.src} to #${e.dst})`;
    return e.node ? `${why} (#${e.node})` : why;
  }
  if (e.kind === 'resync') {
    return `track ${e.track} republished (clip version ${e.clipVersion})`;
  }
  /*
   * A REFUSED EDIT, WHICH USED TO BE SILENCE.
   *
   * The engine drops a clip edit whose base version is stale, and until backend
   * added this it dropped it with no event at all: the whole symptom was "the app
   * does nothing". That is how M2.17's move to per-track versioning broke note
   * entry on every track but the last one edited, and why four checks failed
   * saying only "clipVersion 20 -> 20".
   *
   * It names the version to RETRY with, because that is the difference between a
   * report and a fix, and it distinguishes the two reasons because what to do
   * about them differs — a stale base is worth retrying and a missing track never
   * will be.
   */
  /*
   * FIVE REASONS, AND THIS WORDED TWO OF THEM.
   *
   * `UiClipRejectReason` has StaleBase 1, UnknownTrack 2, UnknownNote 3 and ValueOutOfRange 4,
   * and everything that was not 2 came out as "refused an edit composed against version N" —
   * so a value the engine considered out of range was reported as a concurrency problem, with
   * two version numbers that were EQUAL sitting in the message to prove it was not one. I spent
   * a while reading those numbers before looking at the value.
   *
   * The recovery differs per reason, which is the whole point of the codes being distinct: a
   * stale base is worth retrying, an unknown note means the client is holding an id from before
   * a reload, and an out-of-range value will never work however many times it is sent.
   */
  if (e.kind === 'clip-rejected') {
    const where = e.track === MASTER_TRACK_ID ? 'the master' : `track ${e.track}`;
    if (e.reason === 2) return `${where} does not exist — that edit went nowhere`;
    if (e.reason === 3) {
      return `${where} has no note with that id — the edit was composed against a note that is `
           + 'gone, usually an id held across a reload';
    }
    if (e.reason === 4) {
      return `${where} refused a value as out of range — retrying will not help, the number is `
           + 'wrong for the field';
    }
    return `${where} refused an edit composed against version ${e.sentBase}` +
           ` (it is at ${e.currentBase} now)`;
  }
  /*
   * A REFUSED SAMPLER COMMAND, WHICH WAS ALSO SILENCE — twenty sites of it.
   *
   * Every sampler verb refused into the engine's log and nowhere else, so from a browser they
   * were commands that reported success and did nothing. I found one of the twenty by accident,
   * because the sound kept playing: `slot 0` is not a wildcard for SamplerSetSlot, the engine
   * answered `no_such_slot`, and a half-second note ran the sample's full eight seconds while
   * the console said the command had worked.
   *
   * The reason is worded rather than numbered because WHAT TO DO differs, and that is the whole
   * reason the codes are distinct: "no such slot" means the caller's idea of the kit is stale
   * and it should re-read it; "bad value" means retrying the same command will never work. A
   * single "rejected" would have told you only that you were wrong.
   */
  /*
   * A PATCHER PRESET WAS WRITTEN, OR WAS NOT (UiDiffType::PresetSaved).
   *
   * The whole reason this command is reachable at all: without a result there is no honest
   * button, only one that reports the message left. It echoes the NAME the caller sent, so a
   * reply can be matched to the request rather than assumed to be the latest one.
   */
  if (e.kind === 'preset-saved') {
    return e.ok ? `patcher preset "${e.name}" written`
                : `patcher preset "${e.name}" was NOT written — the engine refused it`;
  }
  if (e.kind === 'sampler-rejected') {
    const at = `t${e.track} dev${e.device}`;
    switch (e.reason) {
      case 1: return `${at}: no such track — that sampler command went nowhere`;
      case 2: return `${at}: no such device`;
      case 3: return `${at}: no slot ${e.target} — re-read the kit, it has moved`;
      case 4: return `${at}: no mod set ${e.target}`;
      case 5: return `${at}: no modulator ${e.target} — name a target instead of an id`;
      case 6: return `${at}: no source ${e.target} — load a sample first`;
      case 7: return `${at}: no slice set ${e.target} — chop it first`;
      case 8: return `${at}: that value is out of range — the same command will not work again`;
      case 9: return `${at}: that device is not a sampler`;
      case 10: return `${at}: the sample would not load`;
      default: return `${at}: the sampler refused that (reason ${e.reason}, target ${e.target})`;
    }
  }
  return `${e.kind.replace('-', ' ')} on track ${e.track} (code ${e.code})`;
}

/** The engine's node the patcher has selected, or null. */
function selectedPatcherNode() {
  if (!engine || state.selectedNode < 0) return null;
  for (const n of engine.patcherNodes) if (n.id === state.selectedNode) return n;
  return null;
}

/**
 * The last config we SENT for a node, kept until the engine reports it back.
 *
 * Two things need it. A second nudge before the engine has answered must build
 * on the first, or `patch 0 steps 3` sends 17 three times instead of 17, 18, 19.
 * And the box must show the value you just typed rather than the one the engine
 * has not caught up to — the same optimism the faders have, for the same reason.
 *
 * Keyed on node id, which backend confirmed is stable (unlike placement_id,
 * which is an index). The entry is dropped once the engine agrees, so an edit
 * the engine refuses reverts on screen instead of lying forever.
 */
const patchPending = new Map();

/** A node's config as far as this UI is concerned: what we sent, else what is. */
function configOf(node) {
  const sent = patchPending.get(node.id);
  return sent || node.config;
}

/**
 * Add, remove or connect nodes. The graph is the engine's, so all three are a
 * send and a wait — there is nothing sensible to show optimistically, because a
 * node the engine has not created yet has no id to draw.
 */
/**
 * A placement edit, to the engine.
 *
 * Same shape as `sendGraph` below and for the same reason: nothing is applied
 * optimistically. The engine clamps a move that would cross a neighbour, so a
 * block drawn where the pointer left it would be showing a position the song
 * does not have — and the arrangement's whole job is to say where things are.
 */
function sendPlacement(msg) {
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  return true;
}

function sendGraph(msg) {
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  return true;
}

/**
 * A SPINE edit — a marker op, or a time edit — to the engine.
 *
 * Nothing optimistic here either, and this one has the strongest reason of the three:
 * a section length change RIPPLES — every later section, every placement at or after
 * the boundary on every track, the tempo points and the harmony events — and the
 * engine plans it across the whole song and refuses it WHOLE if it would shrink into
 * occupied bars. A picture drawn ahead of that answer is either right by luck or shows
 * an arrangement that does not exist, and the arrangement's whole job is to say where
 * things are.
 *
 * The refusal reaches the reject line through the ack channel, like every other
 * sidecar refusal — see `onAck`. The engine's own refusals (no such marker, a removal
 * whose bars hold material) reach only its log, which is a reporting gap on that side and is
 * recorded as one.
 */
function sendMarker(msg) {
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  schedule();
  return true;
}


/**
 * Requests waiting for the engine to name their modulation link.
 *
 * Small and short-lived: one entry per MAP click, drained on the next chain snapshot for that
 * track. Not persisted and not drawn — the badge follows the published links, and a request in
 * here has not happened yet.
 */
const pendingMaps = [];

/**
 * Name the parameter for any link the engine has just published that we asked for.
 *
 * Called from `onChains`, which is where the engine's answer arrives. `SetModLinkUid16` matches
 * a link id EXACTLY and the engine assigns the id, so the uid cannot ride along with the add —
 * naming it needs the id back first. Matches on (track, targetDevice, targetId) and only takes a
 * link that has NO uid16 yet, so a re-published set cannot make this fire twice.
 */
function namePendingMaps() {
  for (let i = pendingMaps.length - 1; i >= 0; i--) {
    const want = pendingMaps[i];
    const c = chains[want.track];
    const links = (c && c.modLinks) || [];
    const hit = links.find((l) => l.targetDevice === want.device
                                  && l.targetId === want.param && !l.uid16);
    if (!hit) continue;
    conn.send({ type: 'moduid', track: want.track, link: hit.id, uid16: want.uid });
    pendingMaps.splice(i, 1);
  }
}

/** Fork one named placement. The rail's badge and the console's `fork` both come here. */
function forkAt(track, placement) { return scratch('fork', track, placement); }
/** ...and swap one, which is what the badge does once a placement has been forked. */
function swapClipAt(track, placement) { return scratch('swap', track, placement); }

/**
 * A scratch op on a NAMED placement, or on the one under the cursor.
 *
 * Defaulting to the cursor is what makes `fork` a single word at the console and a single click
 * in the rail — and it refuses by name rather than acting on a guess when the cursor is over
 * nothing, because forking the wrong appearance is a silent divergence.
 */
function scratchHere(op, track, placement) {
  if (placement !== undefined && placement !== null && placement !== '') {
    return scratch(op, track === undefined ? state.cursor.track : track, placement);
  }
  const at = placementAtCursor();
  if (!at) { state.reject = 'no placement under the cursor'; schedule(); return false; }
  return scratch(op, at.track, at.placement);
}

/**
 * FORK a placement: give it its own copy of what it plays.
 *
 * The answer to "an edit here changes four regions". Forking is ONE VISIBLE ACT with a name and
 * an undo entry, which is why it is better than the per-placement override MODE I nearly built:
 * a mode you forgot to set fails quietly, a week later, as a fix that did not propagate.
 *
 * The original is kept as the placement's ALTERNATE — nothing is lost and nothing destructive
 * enters the undo stack — so `swap` is a comparison rather than a decision, and `keep` is the
 * decision when you are ready to make it.
 */
function scratch(op, track, placement) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const p = Number(placement);
  if (!Number.isFinite(p) || p < 0) {
    // The PLACEMENT, not the clip. Forking is about one appearance; naming the clip would name
    // the thing every appearance shares, which is the opposite of what fork means.
    state.reject = 'which placement?'; schedule(); return false;
  }
  conn.send({ type: 'scratch', op, track: Number(track) || 0, placement: p });
  state.reject = null;
  schedule();
  return true;
}

/**
 * The placement under the cursor, as the engine published it, or null.
 *
 * By TICK RANGE rather than by the selection: the selection is an arrangement idea and the
 * cursor is the tracker's, and `fork` with no argument should mean "the one I am editing" on
 * either surface.
 */
function placementAtCursor() {
  if (!engine || !engine.extentCount) return null;
  const track = state.cursor.track;
  const tick = tickOfCursorRow();
  for (let i = 0; i < engine.extentCount; i++) {
    const e = engine.extents[i];
    // Same rule as `sharedAtCursor`: an unpublished length extends forward rather than being
    // an empty range that nothing can be inside.
    if (e.track === track && tick >= e.startTick
        && (tick < e.endTick || e.endTick <= e.startTick)) {
      return { placement: e.placementId, clip: e.clipId, name: e.name, track,
               forked: !!(e.flags & (1 << 24)) };
    }
  }
  return null;
}

/**
 * IS THE CURSOR INSIDE A PLACEMENT WHOSE CLIP IS PLAYED ELSEWHERE?
 *
 * Returns `{appearances, forked, name}` or null. This is the fact the arrangement and the tracker
 * could never state: two placements of one clip are two rails with the same name, so an edit
 * inside one silently changes the others and nothing says it will.
 *
 * BEFORE the edit, not after. A message that says "that changed 4 placements" is honest and a
 * beat too late; a readout that says so while the cursor sits there is the difference between
 * knowing and being told. It costs a scan of the extents per frame, bounded by the engine's cap
 * and guarded on the extents' revision by `clipUses` upstream.
 */
function sharedAtCursor() {
  if (!engine || !engine.extentCount) return null;
  const track = state.cursor.track;
  const tick = tickOfCursorRow();
  for (let i = 0; i < engine.extentCount; i++) {
    const e = engine.extents[i];
    if (e.track !== track) continue;
    /*
     * `endTick <= startTick` MEANS "LENGTH NOT PUBLISHED", NOT "no length".
     *
     * The engine's own convention: a placement with length 0 plays its CLIP's length, which the
     * extent does not carry — so a fresh placement publishes start == end and a strict range
     * test finds it contains no tick at all. The warning then stayed silent on exactly the
     * placement somebody had just made, which is when they are most likely to be about to type
     * into it.
     *
     * Biased toward WARNING: an unpublished length is treated as extending forward. For a
     * readout whose whole job is "you might not want to do this", a false warning costs a glance
     * and a missed one costs the edit.
     */
    const unknownLength = e.endTick <= e.startTick;
    if (tick < e.startTick) continue;
    if (!unknownLength && tick >= e.endTick) continue;
    let uses = 0;
    for (let k = 0; k < engine.extentCount; k++) if (engine.extents[k].clipId === e.clipId) uses++;
    const forked = !!(e.flags & (1 << 24));
    // Only worth saying when there IS something to say: one appearance and no alternate is the
    // ordinary case and a chip for it would be noise on every row of every song.
    if (uses <= 1 && !forked) return null;
    /*
     * WHETHER IT IS AUDIO CHANGES WHAT THE WARNING MEANS.
     *
     * "an edit here changes all of them" is about NOTE edits into a shared symbolic clip. An
     * audio region holds no notes, so the same sentence over one would be claiming a consequence
     * that cannot happen — and a warning that is wrong once is a warning that gets ignored
     * afterwards. The COUNT is a true and useful fact either way; only the claim about editing
     * is dropped.
     */
    return { appearances: uses, forked, name: e.name, audio: !!e.audio };
  }
  return null;
}

/**
 * Is there a marker with this id RIGHT NOW?
 *
 * Every op but `add` addresses an existing marker, and the engine refuses an unknown id on its
 * own log where the browser cannot read it. Checked HERE because the published list is the same
 * one the user is looking at: the common case answers itself, by name, before anything is sent.
 */
function markerExists(id) {
  const m = markersOf();
  if (!m) return false;
  for (const x of m.list) if (x.id === id) return true;
  return false;
}

/**
 * THE SONG'S MARKERS, as the engine published them, with the span each one begins.
 *
 * `bars` and `endTick` were DERIVED by the decoder from the next marker — a marker stores no
 * length. `bar` and `beat` were resolved by the ENGINE through the meter map and are not
 * recomputed here: bar numbering across a meter change is a prefix sum, not a division, and a
 * second implementation would be right until the first 7/8 passage.
 */
function markersOf() {
  if (!engine || !Array.isArray(engine.markers)) return null;
  const list = [];
  // `slice(0, count)` — the pool grows and is never shrunk, so its tail after a removal is the
  // marker that was just deleted.
  const n = Math.min(engine.markerCount || 0, engine.markers.length);
  for (let i = 0; i < n; i++) {
    const m = engine.markers[i];
    list.push({ id: m.id, name: m.name, bar: m.bar, beat: m.beat, tick: m.tick,
                endTick: m.endTick, bars: m.bars, color: m.color });
  }
  return { version: engine.arrangeVersion, count: n,
           truncated: engine.markersTruncated | 0, songEnd: engine.songEnd, list };
}

/** A marker at a tick. No length to choose — that is the whole simplification. */
function addMarker(tick, name) {
  const t = Math.max(0, Math.round(Number(tick) || 0));
  return sendMarker({ type: 'marker', op: 'add', tick: t, name: name || 'Marker' });
}

/**
 * Remove a marker. NOT destructive: the music stays exactly where it is and simply stops being
 * named. Said here as well as in the help, because "remove" reads as destructive and a confirm
 * on this would be asking about the wrong thing.
 */
function delMarker(id) {
  const n = Number(id) || 0;
  if (n <= 0) { state.reject = 'which marker?'; schedule(); return false; }
  if (!markerExists(n)) { state.reject = `no marker ${n}`; schedule(); return false; }
  if (state.selectedMarker === n) state.selectedMarker = 0;
  return sendMarker({ type: 'marker', op: 'remove', id: n });
}

function nameMarker(id, name) {
  const n = Number(id) || 0;
  const t = String(name === undefined ? '' : name).trim();
  if (n <= 0) { state.reject = 'which marker?'; schedule(); return false; }
  if (!markerExists(n)) { state.reject = `no marker ${n}`; schedule(); return false; }
  // Refused HERE, with a reason, rather than sent as an empty name for the engine to drop in
  // silence — the same rule the sidecar applies.
  if (!t) { state.reject = 'a marker needs a name'; schedule(); return false; }
  return sendMarker({ type: 'marker', op: 'rename', id: n, name: t });
}

/** Move a marker to a tick. It moves ALONE — no music follows it. */
function moveMarker(id, tick) {
  const n = Number(id) || 0;
  if (n <= 0) { state.reject = 'which marker?'; schedule(); return false; }
  if (!markerExists(n)) { state.reject = `no marker ${n}`; schedule(); return false; }
  const t = Number(tick);
  if (!Number.isFinite(t) || t < 0) { state.reject = 'move it to which tick?'; schedule(); return false; }
  return sendMarker({ type: 'marker', op: 'move', id: n, tick: Math.round(t) });
}

/**
 * INSERT OR REMOVE ARRANGEMENT TIME. The one command that moves music.
 *
 * Everything at or after `tick` moves: every placement on every track, the tempo points, the key
 * changes, the automation points, the meter points and the later markers — in ONE transaction
 * the engine refuses whole and undoes whole. This is what the spine strip's boundary drag sends,
 * and it is what `SetSectionLength` used to do as a side effect of editing a label, without an
 * undo entry that could hold it.
 *
 * BARS, NOT TICKS. A bar's length depends on the meter in force at that point, and the engine
 * holds the authoritative map — converting here would re-implement the prefix sum and be wrong
 * on the first mid-song meter change.
 */
function insertTime(tick, bars) {
  const b = Math.round(Number(bars) || 0);
  if (!b) { state.reject = 'how many bars?'; schedule(); return false; }
  const t = Math.max(0, Math.round(Number(tick) || 0));
  return sendMarker({ type: 'time', op: b > 0 ? 'insert' : 'remove', tick: t, bars: Math.abs(b) });
}

/** A meter point. Mid-song signatures are authorable from v29. */
function setTimeSig(sig, tick, flatten) {
  const t = String(sig || '').trim();
  const m = /^(\d+)\/(\d+)$/.exec(t);
  /*
   * REFUSED HERE, not just in the sidecar.
   *
   * The sidecar refuses a bad signature too, but its error arrives on the ack channel — after
   * `run` has returned and the console has already printed its optimistic reply. A refusal the
   * user reads a beat later, under a line that said it worked, is worse than none.
   *
   * A zero denominator divides by zero in every bar computation downstream, and one that is not
   * a power of two is not a signature music uses.
   */
  const den = m ? Number(m[2]) : 0;
  if (!m || Number(m[1]) < 1 || den < 1 || (den & (den - 1)) !== 0) {
    state.reject = 'a time signature is beats/note-value, like 4/4 or 7/8';
    schedule(); return false;
  }
  return sendMarker({ type: 'timesig', sig: t,
                      tick: Math.max(0, Math.round(Number(tick) || 0)),
                      flatten: flatten ? 1 : 0 });
}

/**
 * THE MODULATION LINKS on a track, as the engine published them, or null.
 *
 * From the chain store rather than a second one: the sidecar puts them in the chain
 * message because a modulation link is a fact about a track's RACK, and the page gets
 * what the chain is, where it goes and what moves what in one breath.
 */
function modsOf(track) {
  const c = chains[track];
  if (!c) return null;
  return { track, version: c.modVersion || 0, links: (c.modLinks || []).map((l) => ({ ...l })) };
}

/**
 * MODULATE a parameter from the track's macro. THREE commands, and all three are needed.
 *
 * This looks like it should be one message and it is not, because a modulation link the
 * engine ACCEPTS can still move nothing at all — three separate ways, each of them silent:
 *
 *  1. AddModLink makes the link. On its own it is inert.
 *  2. SetModLinkUid16 names the PARAMETER. The block-rate applier builds its ParamPayload
 *     from `link.target.uid16` and never reads `targetId`, so a link without a uid16
 *     modulates nothing while being accepted, published and perfectly drawable.
 *  3. SetModSourceValue turns the KNOB. The applier resolves a source by looking it up in
 *     the track's source states, and a macro nobody has turned is not in that table — so
 *     the link is skipped. "Nobody has turned it yet" and "this does not work" are
 *     indistinguishable from outside, so the macro starts at half.
 *
 * The uid16 goes out AFTER the engine has told us the link's id: `AddModLink` with
 * MOD_LINK_ID_AUTO lets the engine assign, and SetModLinkUid16 matches an id exactly —
 * there is no "the one you just made" sentinel, which I assumed there was and checked. So
 * the request is remembered in `pendingMaps` and named when the snapshot arrives. That is a
 * two-step protocol, not optimism: nothing is drawn until the engine says so.
 *
 * MODULATION FLOWS FORWARD, and STRICTLY. The command validator refuses a source LATER
 * than its target (`sourcePos > targetPos`), but the block-rate applier skips a link whose
 * source is not strictly EARLIER (`srcPos >= dstPos`) — so a same-device link is accepted
 * and then ignored. That gap is the engine's and is reported; here it means the source must
 * come from a device genuinely before the target, and if the target is the FIRST device
 * there is no legal source and this refuses with that reason rather than making a link
 * that cannot work.
 */
function mapParam(track, device, param, uid) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  /*
   * THE SOURCE FIRST, then the parameter — the order decides which reason gets reported,
   * and for a device at position 0 "nothing can come before this" is the truer statement.
   * Checking the uid first told a first-position device it had no stable parameter ids,
   * which was accurate about the parameter and misleading about the problem.
   */
  const src = sourceDeviceBefore(track, device);
  if (src < 0) {
    state.reject = 'nothing before this device to modulate from — modulation flows forward';
    schedule(); return false;
  }
  /*
   * A parameter with no stable id CANNOT be modulated, and saying so is the whole point.
   * The engine addresses the target by uid16; a row whose plugin publishes none would get
   * a link that is accepted and inert, which is the failure this function exists to avoid.
   */
  if (!uid) {
    state.reject = 'this parameter has no stable id — the engine addresses modulation by it';
    schedule(); return false;
  }
  /*
   * AND THE PLUGIN HAS TO ACCEPT IT. An `automatable: false` parameter ignores values from a
   * host, so the link would be accepted, published, drawn — and inert. Refused here as well as
   * hidden in the rack, because the console can reach a row the rack is not showing.
   */
  if (!paramAutomatable(track, device, param)) {
    state.reject = 'this plugin ignores host automation for that parameter';
    schedule(); return false;
  }
  conn.send({ type: 'mod', op: 'add', track, srcDevice: src, srcId: 0,
              dstDevice: device, dstParam: param, depth: 1, bias: 0,
              source: 'macro', target: 'param', rate: 'block' });
  // The knob, at half. See (3) above — a macro nobody has turned is not in the source
  // table and the link is skipped, so this is what makes the mapping audible at all.
  conn.send({ type: 'modsource', track, device: src, source: 0, value: 0.5 });
  // Remembered, so the uid16 can be sent once the engine has named the link. Keyed on what
  // was asked for, not on a guess at the id.
  pendingMaps.push({ track, device, param, uid });
  state.reject = null;
  schedule();
  return true;
}

/**
 * The uid16 of one parameter, from the published mirror, or ''.
 *
 * The mirror is the only thing that knows both the plugin's index and its stable id, and
 * the engine needs the id — see `mapParam`. Returning '' rather than throwing when the
 * parameter is unknown, because `mapParam` refuses on an empty uid with a sentence that
 * says why, and that is a better answer than a stack trace.
 */
function paramUidOf(track, device, index) {
  /*
   * KEYED ON (TRACK, DEVICE), not on the device alone.
   *
   * Device ids are PER TRACK, so `deviceParams[3]` is not "device 3" — it is whichever
   * track's device 3 answered last. The mirror is keyed with `paramKey` for exactly that
   * reason and there is a comment on the intake saying so, which I did not read before
   * writing this: the first version indexed by the device id and by an ARRAY, and the
   * value is `{track, device, name, params}`. So it found nothing, every time, and `map`
   * would have refused every parameter in the app with "no stable id" — a confident,
   * plausible refusal from a lookup that was never going to succeed.
   */
  const dp = deviceParams[paramKey(track, device)];
  const list = dp && dp.params;
  if (!Array.isArray(list)) return '';
  for (const p of list) if (p.index === index) return p.uid || '';
  return '';
}

/**
 * Does the device publish a parameter with this uid? Returns the row's index, or 0/false.
 *
 * Used to tell a link that targets a real parameter from one that targets a uid this
 * plugin has no row for — the second is indistinguishable from the first on the wire, and
 * is what a project authored against another version of the same plugin leaves behind.
 */
/** Does the plugin accept a host value for this parameter? Absent means yes — see mapParam. */
function paramAutomatable(track, device, index) {
  const dp = deviceParams[paramKey(track, device)];
  const list = dp && dp.params;
  if (!Array.isArray(list)) return true;
  for (const p of list) if (p.index === index) return p.automatable !== false;
  return true;
}

function paramIndexOfUid(track, device, uid) {
  const dp = deviceParams[paramKey(track, device)];
  const list = dp && dp.params;
  if (!Array.isArray(list) || !uid) return 0;
  for (const p of list) if (p.uid === uid) return (p.index || 0) + 1;
  return 0;
}

/**
 * Is `src` strictly earlier in `track`'s chain than `dst`?
 *
 * STRICTLY, because that is the block-rate applier's own test (`srcPos >= dstPos` skips).
 * The command validator is looser — it only refuses a source LATER than its target — so
 * the engine accepts same-device links and then never applies them. Both devices must be
 * present: an unknown one is not "before".
 */
function isStrictlyBefore(track, src, dst) {
  const c = chains[track];
  const devs = (c && c.devices) || [];
  let sp = -1, dp = -1;
  for (const d of devs) { if (d.id === src) sp = d.pos; if (d.id === dst) dp = d.pos; }
  return sp >= 0 && dp >= 0 && sp < dp;
}

/** Turn a macro knob. The ordinary action: mapping happens once, turning happens all day. */
function setMacro(track, device, value) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const v = Number(value);
  if (!Number.isFinite(v)) { state.reject = 'a macro value is a number from 0 to 1'; schedule(); return false; }
  conn.send({ type: 'modsource', track, device, source: 0,
              value: Math.max(0, Math.min(1, v)), kind: 'macro' });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Stop modulating: remove one link by id.
 *
 * A REMOVE HAS TO CARRY THE LINK'S DEVICES, which is not obvious and is not the engine's
 * documented shape. `RemoveModLink` is handled AFTER the same validation as an add — the
 * source and target device ids are resolved to chain positions and the forward-order rule is
 * applied — so a message naming only the link is refused as `invalid_device`, on the engine's
 * own log, where a browser cannot read it.
 *
 * It looked like it worked for a while because the default of 0 happened to be a real device
 * id in the fixture I was using. On a project whose ids start higher, every removal was
 * silently refused: the badge stayed lit, `unmap` reported success, and three links piled up
 * where there should have been one. Reported to backend — a removal should need an id and
 * nothing else.
 */
function unmapParam(track, link) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const n = Number(link) || 0;
  if (n <= 0) { state.reject = 'which link?'; schedule(); return false; }
  const found = (modsOf(track) || { links: [] }).links.find((l) => l.id === n);
  if (!found) { state.reject = `no link ${n} on track ${track}`; schedule(); return false; }
  conn.send({ type: 'mod', op: 'remove', track, link: n,
              srcDevice: found.sourceDevice, srcId: found.sourceId,
              dstDevice: found.targetDevice, dstParam: found.targetId });
  /*
   * NOTHING IS DROPPED LOCALLY ANY MORE, and that is the point.
   *
   * This used to edit published state: an emptied registry published nothing at all, so
   * removing a track’s LAST link was invisible, and the badge stayed lit for a link that no
   * longer existed. Backend now emits a one-entry sentinel for an empty registry — the same
   * thing an empty CHAIN has always done — so a removal arrives like every other change and
   * the one place in this file that guessed at engine state is gone.
   */
  state.reject = null;
  schedule();
  return true;
}

/**
 * A device on `track` that sits STRICTLY BEFORE `device` in the chain, or -1.
 *
 * The nearest one, not the first: an LFO or a macro on the device immediately before the
 * target is the shortest legal hop, and picking the very first would put a source behind
 * every plugin in a long rack whether that made sense or not.
 *
 * Strictly before, because the applier's own test is `srcPos >= dstPos -> skip`. The
 * command validator is looser (it only refuses LATER), so choosing the target's own device
 * would produce a link the engine accepts and then ignores.
 */
function sourceDeviceBefore(track, device) {
  const c = chains[track];
  const devs = (c && c.devices) || [];
  let targetPos = -1;
  for (const d of devs) if (d.id === device) targetPos = d.pos;
  if (targetPos <= 0) return -1;         // nothing can precede position 0
  let best = -1, bestPos = -1;
  for (const d of devs) if (d.pos < targetPos && d.pos > bestPos) { bestPos = d.pos; best = d.id; }
  return best;
}

/**
 * Change how far a source sweeps its target. ONE COMMAND, in place.
 *
 * It used to be a remove and an add, because `AddModLink` with an existing id is refused and
 * there was no update opcode — so the link got a new id, came back UNNAMED (and an unnamed link
 * moves nothing, so the depth change silently disabled the modulation until a second command
 * named it again), and the pair was not atomic. Backend added `SetModLinkDepth` on the strength
 * of that report; this is what it looks like with the opcode it needed.
 *
 * WHICH MAKES A SLIDER POSSIBLE. The old shape could not be dragged — a continuous gesture
 * would have destroyed and rebuilt the link on every frame — and that was a UI limitation
 * caused entirely by the opcode set rather than by anything about the interface.
 */
function modDepth(track, link, depth) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const n = Number(link) || 0;
  if (n <= 0) { state.reject = 'which link?'; schedule(); return false; }
  const d = Number(depth);
  if (!Number.isFinite(d)) { state.reject = 'a depth is a number from 0 to 1'; schedule(); return false; }
  const found = (modsOf(track) || { links: [] }).links.find((l) => l.id === n);
  if (!found) { state.reject = `no link ${n} on track ${track}`; schedule(); return false; }
  /*
   * The devices and kinds go out even though `SetModLinkDepth` ignores them. A payload with
   * holes in it is a payload somebody fills in wrongly later, and the builder packs the flags
   * from these fields regardless.
   */
  conn.send({ type: 'mod', op: 'depth', track, link: n,
              srcDevice: found.sourceDevice, srcId: found.sourceId,
              dstDevice: found.targetDevice, dstParam: found.targetId,
              depth: Math.max(0, Math.min(1, d)), bias: found.bias,
              source: MOD_SOURCE_NAMES[found.sourceKind] || 'macro',
              target: MOD_TARGET_NAMES[found.targetKind] || 'param',
              rate: found.rate === 1 ? 'sample' : 'block',
              enabled: found.enabled ? 1 : 0 });
  state.reject = null;
  schedule();
  return true;
}


/**
 * The engine's source and target kinds, by name.
 *
 * Here rather than as numbers at the call site because a `2` that means "envelope" today
 * and something else after the next enum change is exactly the literal that outlives its
 * meaning — and because `modDepth` has to send the kind BACK, so a wrong name silently
 * re-sources a link it was only meant to re-scale.
 */
const MOD_SOURCE_NAMES = ['macro', 'lfo', 'env', 'node'];
const MOD_TARGET_NAMES = ['param', 'patcher', 'macro'];

/**
 * WHAT THE ARRANGEMENT DRAWS AUTOMATION FROM.
 *
 * `forTrack(track)` answers with the curve for the lane that track has open, or null. It also
 * ASKS for a curve it does not hold yet — which is why this is a reader with behaviour rather
 * than a plain map: the arrangement draws what has arrived and the request happens as a side
 * effect of it being wanted, so a lane appears the moment the engine answers rather than
 * needing a second gesture.
 *
 * `revision` is what the paint guards on. It moves when a curve arrives or the engine's lane
 * version changes, and NOT when a note is typed — so the canvas repaints when a curve changes
 * and at no other time.
 */
let automationRevision = 0;
const automationReader = {
  get revision() {
    // The engine's lane version is part of it: a lane appearing or disappearing changes the
    // picture even when no curve has arrived.
    return automationRevision + (engine ? engine.automationVersion * 1000000 : 0);
  },
  forTrack(track) {
    /*
     * `engine.automation` MAY NOT EXIST. The fixtures build partial stores by hand — a shape
     * with the fields a scene needs and nothing else — so a reader that assumes a field the
     * decoder always writes still throws under `?engine=off`. This one did:
     * "Cannot read properties of undefined (reading 'length')", from a canvas paint, which
     * took the whole arrange golden down.
     *
     * Guarding the ARRAY rather than adding the field to every fixture: a fixture exists to be
     * a minimum, and making all of them carry every field to satisfy one reader is the
     * arrangement that goes stale on the next field.
     */
    if (!engine || !Array.isArray(engine.automation)) return null;
    // The FIRST lane on this track. One curve per lane at a time: two in a 44px lane are two
    // lines nobody can attribute, and which one is shown is a choice worth making explicitly
    // when there is somewhere to make it.
    const n = Math.min(engine.automationCount, engine.automation.length);
    for (let i = 0; i < n; i++) {
      const l = engine.automation[i];
      if (l.track !== track) continue;
      const key = `${track}:${l.param}`;
      const hit = automationCurves.get(key);
      if (hit && hit.version === engine.automationVersion) return hit.found ? hit : null;
      // Not held, or held at an older version. Ask — and `requestAutomation` will not ask twice
      // for the same thing, so calling this per frame costs one Map lookup.
      requestAutomation(track, l.param);
      return null;
    }
    return null;
  },
};

/**
 * Turn pointer editing of the automation curve on or off.
 *
 * Refused when nothing on this track is automated, and that refusal is the useful part: the
 * mode with no lane under it is a crosshair over an empty strip that writes points into a
 * parameter nobody chose. Automation has to EXIST before it can be drawn on, and the way to
 * make it exist is `autopoint` — which is a real ordering, not an arbitrary one.
 *
 * @param {boolean} [on] what to set it to; omitted flips it.
 */
function setAutomationEdit(on) {
  const want = on === undefined ? !state.automationEdit : !!on;
  if (want && !automationOf(state.cursor.track)?.list.length) {
    state.reject = `nothing automates track ${state.cursor.track} yet — write a point first`;
    schedule();
    return false;
  }
  state.automationEdit = want;
  state.reject = null;
  schedule();
  return true;
}

/**
 * WRITE one automation point.
 *
 * Addressed by (track, param, tick): writing the same tick again REPLACES that point rather
 * than stacking a second one on it, which is what makes drawing a curve with a pointer possible
 * rather than a way to accumulate duplicates.
 *
 * The value is CLAMPED and not refused. A gesture that runs past the end of a fader is an
 * ordinary thing for a pointer to do, and refusing the last pixel of a drag would make the
 * control feel broken at exactly the extremes people reach for.
 */
function writeAutomation(track, param, tick, value, discrete) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const p = String(param || '').trim();
  if (!p) { state.reject = 'which parameter?'; schedule(); return false; }
  const v = Number(value);
  if (!Number.isFinite(v)) { state.reject = 'a value is a number from 0 to 1'; schedule(); return false; }
  conn.send({ type: 'autopoint', track: Number(track) || 0, param: p,
              tick: Math.max(0, Math.round(Number(tick) || 0)),
              value: Math.max(0, Math.min(1, v)), discrete: discrete ? 1 : 0 });
  /*
   * The cached curve for this lane is dropped, not patched.
   *
   * Patching it would be this side inventing what the engine holds — the engine may merge, clamp
   * or replace, and a curve drawn from a guess is the exact failure the read-back exists to
   * prevent. Dropped, so the next read asks again.
   */
  automationCurves.delete(`${track}:${p}`);
  state.reject = null;
  schedule();
  return true;
}

/**
 * WHICH PARAMETERS ARE AUTOMATED, from the standing lane list.
 *
 * `slice(0, count)` for the reason every reader on this wire has: the pool grows and is never
 * shrunk, so its tail after a removal is a lane that no longer exists.
 */
function automationOf(track) {
  // Same guard as `automationReader.forTrack`, and for the same reason: a fixture store has
  // only the fields its scene needs.
  if (!engine || !Array.isArray(engine.automation)) return null;
  const list = [];
  const n = Math.min(engine.automationCount || 0, engine.automation.length);
  for (let i = 0; i < n; i++) {
    const l = engine.automation[i];
    if (track !== undefined && l.track !== Number(track)) continue;
    list.push({ track: l.track, param: l.param, points: l.points,
                discrete: l.discrete, target: l.target });
  }
  return { version: engine.automationVersion, truncated: engine.automationTruncated | 0, list };
}

/**
 * Ask for one lane's curve. Answered on the ack channel; see `onAck`.
 *
 * The answer is CACHED on the lane version, so opening a lane twice costs one round trip. A
 * request that is already in flight is not sent twice — the engine answers into a slot the
 * sidecar picked, and asking again would spend a slot on a question already asked.
 */
/*
 * WHAT IS IN A SAMPLER, cached per (track, device).
 *
 * Same shape as the automation cache below it and for the same reasons: the answer arrives on
 * the ack channel, a question already in flight is not asked twice, and `found: false` is an
 * ANSWER — "there is no sampler on that device" — rather than silence to spin on.
 *
 * CACHED AGAINST THE KIT VERSION, which the engine bumps when a kit CHANGES rather than when
 * one is requested. That distinction is what makes the cache safe: a counter that ticked on
 * request would make this re-fetch for ever and look correct while doing it.
 *
 * So a drawn kit is a SUBSCRIPTION now, not a snapshot — drag a marker and the card follows,
 * because `sampler_engine.h` derives a slice's extent at note-on and the version moves through
 * the one funnel every sampler edit passes through.
 *
 * The version is GLOBAL, not per track: it says something changed, not which device. With one
 * sampler that is exact; with several it costs re-fetching kits that did not move, which is a
 * trade worth measuring before asking for finer granularity.
 *
 * Version 0 means the engine does not publish one — an older engine — and is treated as "never
 * stale", because refusing to cache against a counter that does not exist would ask on every
 * frame for ever.
 */
const samplerKits = new Map();
/*
 * The kits the RACK is drawing, keyed like `deviceParams` so the chain model can look one up the
 * same way it looks up a parameter list. A plain object rather than a second Map because that is
 * what `params` is and the model indexes both identically.
 */
const samplerKitsForChain = {};
let samplerKitAsked = null;

/**
 * CHOP a source into slices, and by default a playable slot per slice.
 *
 * `slots` is what turns a chop into something you can play in one gesture rather than N: the
 * slices land on consecutive keys from `base`, so the break is under the fingers in order and a
 * pattern addresses a hit by pitch alone. Without it the slice set exists and nothing plays it —
 * which is a real thing to want (re-cutting an existing chop) and a surprising default.
 *
 * `snap` is the row grid in nanoticks. Snapping makes the chop tempo-adaptive from the moment it
 * is made rather than tied to the rate the file was recorded at, which is the difference between
 * a break that follows the song and a song that has to follow the break.
 */
function sliceSample(track, device, opts) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const o = opts || {};
  const mode = String(o.mode || 'equal');
  if (mode !== 'equal' && mode !== 'transient' && mode !== 'clear') {
    state.reject = 'slice mode is equal, transient or clear';
    schedule();
    return false;
  }
  conn.send({ type: 'samplerslice', track: Number(track) || 0, device: Number(device) || 0,
              source: o.source === undefined ? 1 : Number(o.source), mode,
              count: o.count === undefined ? 16 : Number(o.count),
              sensitivity: o.sensitivity === undefined ? 500 : Number(o.sensitivity),
              snap: o.snap === undefined ? 0 : Number(o.snap),
              base: o.base === undefined ? 36 : Number(o.base),
              slots: o.slots === false ? 0 : 1 });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Load a sample into a sampler, minting a source and a slot.
 *
 * The name is a project-relative FILE NAME, not a path: the whole command is 40 bytes and the
 * name gets 24 of them, so the engine resolves it against its own audio directory. That is also
 * what keeps a client from handing the engine a path of its choosing.
 *
 * `fixedPitch` — keyLow == keyHigh == rootKey — is how a drum stays a drum across the keyboard,
 * and is the default because loading a one-shot is what anyone does first. Clear it for a
 * playable zone.
 */
function loadSample(track, device, name, rootKey, fixedPitch) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  const n = String(name || '').trim();
  if (!n) { state.reject = 'which sample?'; schedule(); return false; }
  if (n.length > 24) {
    // Refused here as well as in the sidecar, so the reason arrives before the round trip: a
    // truncated name resolves to nothing or, worse, to a DIFFERENT file, and "loaded fine, wrong
    // sample" is not a failure anyone would think to look for.
    state.reject = `"${n}" is longer than the 24 characters the load command carries`;
    schedule();
    return false;
  }
  conn.send({ type: 'samplerload', track: Number(track) || 0, device: Number(device) || 0,
              name: n, root: rootKey === undefined ? 36 : Number(rootKey),
              fixed: fixedPitch === false ? 0 : 1 });
  // The kit is answered from the engine's own snapshot, so nothing is assumed here — the card
  // redraws when the version moves, which is what the version is for.
  state.reject = null;
  schedule();
  return true;
}

/**
 * WRITE the ops on one note, from a canonical op string.
 *
 * THE MASK IS ALWAYS FULL. Every op family is named on every commit, so a family the string
 * omits is sent with its bit SET and a value of ZERO — which is how SetRowOps spells "clear
 * this". Sending a partial mask would make deleting an op impossible to express: the command
 * cannot tell "leave the retrigger alone" from "remove it" except by that bit.
 *
 * It also makes the cell's contract the obvious one — what you see in it is what the note has,
 * so emptying it empties the note — rather than an accumulate-only field you can add to and
 * never subtract from.
 */
function writeRowOps(track, clipId, noteId, text, only) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  /*
   * THE FULL 64-BIT ID GOES OUT.
   *
   * This used to refuse anything over 2^32, because the payload's noteId was u32 while an
   * authored EventId is u64 with the AUTHOR in bits 48+ — truncating dropped the author and
   * landed the edit on whichever human note shared the counter, which is a silent edit of the
   * WRONG note and far worse than a refusal. Backend split the field lo/hi after that was
   * reported, so the refusal is gone and agent-authored notes are editable.
   *
   * Still guarded on being a safe integer: JSON carries it as a double, and past 2^53 an id
   * would arrive already wrong, which no amount of splitting downstream can fix.
   */
  if (!Number.isSafeInteger(noteId) || noteId <= 0) {
    state.reject = 'that note has no id this command can address';
    schedule();
    return false;
  }
  const r = parseOps(text);
  if (r.error) { state.reject = r.error; schedule(); return false; }
  const o = r.ops;
  /*
   * THE MASK IS THE EDIT'S SCOPE, and a full one is a replacement of the whole row.
   *
   * `only` restricts it to named fields, which is what makes changing one op possible without
   * resending the other four. It matters beyond convenience: a full-mask write carries this
   * client's idea of every op, so two edits to different ops on one row overwrite each other
   * with stale copies — the second one wins on all five fields, not on the one it changed.
   *
   * An unknown name THROWS rather than contributing nothing. A zero bit is not a refusal on this
   * wire, it is "leave that field alone", so a typo in a field name would send a well-formed
   * command that quietly does nothing and reads as the engine ignoring the edit.
   */
  let mask = 0;
  if (only && only.length) {
    for (const k of only) mask |= opMaskOf(k);
  } else {
    for (const k of Object.keys(OP_MASK)) mask |= OP_MASK[k];
  }
  conn.send({
    type: 'setrowops', track: Number(track) || 0, clip: Number(clipId) || 0, note: noteId,
    mask,
    ret: o.retrigger, prob: o.probability, sound: o.sound, offset: o.soundOffset,
    // v33. The MASK is what says whether this command speaks about them at all, so a caller who
    // never mentions a ramp leaves the note's alone rather than flattening it to zero.
    ramp: o.retrigRamp, cond: o.trigCondition,
    // The engine stores the delay in NANOTICKS; the notation is a fraction of a beat, so it is
    // resolved here against the song's beat rather than sent as a fraction the payload has no
    // room for. `d1/6` at a 960000 beat is 160000.
    delay: o.delayDen ? Math.round((ticksPerBeat(songMeter()) * o.delayNum) / o.delayDen) : 0,
  });
  state.reject = null;
  schedule();
  return true;
}

/**
 * The ops on the note under the cursor, written from a canonical string.
 *
 * CLIP 0, which is the engine's own sentinel: `applySetRowOps` skips the clip filter when the id
 * is zero and searches every owned clip for the note. That is the right call here because a
 * note on the wire carries its PLACEMENT, not its clip, and resolving one to the other means
 * finding the placement's extent — which is only published for the part of the arrangement
 * being drawn. Addressing by note id alone has no such window, and the id is unique by
 * construction.
 */
function writeOpsAtCursor(text) {
  const n = noteAtCursor();
  if (!n) { state.reject = 'no note at the cursor to put ops on'; schedule(); return false; }
  return writeRowOps(state.cursor.track, 0, n.id, text);
}

/**
 * Set or clear ONE op on the note under the cursor, leaving the rest of the row alone.
 *
 * `p60` sets it, a bare `p` clears it. This is the collapsed cell's promise kept: 43 ops in one
 * cell are only editable one at a time if one at a time is a thing the wire can say, and it is —
 * a mask bit set with a zero value is a clear, a bit left clear is "do not touch".
 */
function writeOneOpAtCursor(token) {
  const edit = oneOpEdit(token);
  if (!edit) {
    state.reject = `${String(token || '').trim() || 'that'} is not an op — ${opsHint()}`;
    schedule();
    return false;
  }
  const n = noteAtCursor();
  if (!n) { state.reject = 'no note at the cursor to put ops on'; schedule(); return false; }
  return writeRowOps(state.cursor.track, 0, n.id, edit.text, [edit.field]);
}

/**
 * Ask what is in the sampler on (track, device). Answered on the ack channel; see `onAck`.
 *
 * Returns the last answer if there is one, or null while the question is out. Null means "not
 * yet" and is different from an answer with no slots — the first draws nothing, the second draws
 * an empty kit, and conflating them is how a UI shows "no samples" for a sampler it has simply
 * not heard back from.
 */
function requestSamplerKit(track, device) {
  const key = `${track}:${device}`;
  const now = engine ? (engine.samplerKitVersion | 0) : 0;
  const hit = samplerKits.get(key);
  // A held answer is good until the kit version moves past the one it was answered at. Version 0
  // is an engine that publishes none, and a cache that refused to trust it would ask every frame.
  if (hit && (now === 0 || hit.atVersion === now)) return hit;
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return hit || null; }
  if (samplerKitAsked !== key) {
    samplerKitAsked = key;
    conn.send({ type: 'samplerkit', track: Number(track) || 0, device: Number(device) || 0 });
  }
  // The STALE answer while the fresh one is in flight, not null: a card that blanked on every
  // marker drag would flicker, and what it holds is still what the engine said a moment ago.
  return hit || null;
}

/** The last answer about (track, device), without asking again. */
function samplerKitOf(track, device) {
  return samplerKits.get(`${track}:${device}`) || null;
}

const automationCurves = new Map();
let automationAsked = null;
function requestAutomation(track, param) {
  const key = `${track}:${param}`;
  const hit = automationCurves.get(key);
  if (hit && hit.version === (engine ? engine.automationVersion : 0)) return hit;
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return null; }
  if (automationAsked !== key) {
    automationAsked = key;
    conn.send({ type: 'automation', track: Number(track) || 0, param: String(param) });
  }
  // Null means "not yet", which is different from a lane with no points — the caller draws
  // nothing rather than an empty curve, and the answer arrives on the ack channel.
  return hit || null;
}


/**
 * Remove a device from a track.
 *
 * A named function because three callers need it — the rack's delete button, the
 * Backspace binding, and the __uni hook — and the first two were written against
 * `dockApi.delDevice`, which does not exist. The confirm appeared, the user said
 * yes, and the call threw `dockApi.delDevice is not a function`: the most
 * expensive possible moment to fail, after consent and before the work.
 */
function delDevice(track, device) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'deldevice', track, device });
  /**
   * ...and then ask what the chain is now.
   *
   * The engine publishes a chain diff when a device is ADDED and does not when
   * one is REMOVED. So the removal really happened — a later `reqchain` proves
   * it, the version had moved 4 to 6 — while the rack went on drawing the card
   * that was gone. You deleted a plugin and it sat there, which reads as the
   * delete having failed, so you press it again.
   *
   * The request is queued behind the removal on the same ring, so it is answered
   * after it. Reported to backend as an asymmetry worth fixing at the source;
   * asking is correct regardless, and cheap.
   */
