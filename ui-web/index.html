  },
  /**
   * The rail with a plugin catalogue behind it.
   *
   * `?engine=off` answers no `{"type":"plugins"}`, so without this the rail's
   * newest and largest feed is the one no test can measure — which is exactly
   * the mistake GUIDELINES 3.0.2 names: for the whole life of alloc.mjs every
   * scenario ran on a branch that spelled nothing. It feeds the SAME text the
   * socket delivers, through the same JSON.parse and the same setter, so what
   * gets measured is the path the program is actually on.
   *
   * 52 entries because that is what this machine's scanner produced, and one of
   * them failed on purpose: a catalogue in which everything worked cannot tell
   * a greyed row from a missing one.
   */
  usePluginFixture: (n = 52) => {
    state.useEngine = false; state.hudFrozen = true; conn.close();
    hudText.nodeValue = 'plugin-fixture';
    const vendors = ['u-he', 'Kilohearts', 'Sugar Bytes', 'VCV', 'XLN Audio',
                     'Elektron Music Machines'];
    const plugins = [];
    for (let i = 0; i < n; i++) {
      const broken = i === 7;
      plugins.push({
        path: '/Library/Audio/Plug-Ins/VST3/Vendor/Plug ' + i + '.vst3',
        identifier: '/Library/Audio/Plug-Ins/VST3/Vendor/Plug ' + i + '.vst3',
        uid: 'VST3-Plug ' + i + '-c84a7500-f7f0b6e7',
        name: 'Plug ' + i, vendor: vendors[i % vendors.length], version: '1.0.0',
        format: 'VST3', is_instrument: i % 4 === 0, has_editor: true,
        num_inputs: 2, num_outputs: 2, ok: !broken,
        error: broken ? 'the plugin crashed while being scanned' : '',
        scan_time_ms: 0,
      });
    }
    applyPluginReply(JSON.stringify(
      { ok: true, pluginCache: { schema_version: 1, generated_at_ms: 0, plugins } }));
    state.projects = ['webtest', 'maximal', 'sketch-01', 'live-set', 'drums-only'];
    state.currentProject = 'maximal';
    state.browserOpen = true;
    browser.selected = 0;
    draw();
  },
  /** Dock fixture: a scripted session showing all three line kinds. */
  useDockFixture: () => {
    state.useEngine = false; state.hudFrozen = true; conn.close();
    hudText.nodeValue = 'dock-fixture';
    state.dockOpen = true;
    dock.clear();
    dock.log('in', '> help');
    // The two help lines are the REAL ones, filtered out of the real help output,
    // rather than a copy of what help said the day this fixture was written. The
    // copy had already drifted twice: it showed the pre-schema line format, and a
    // `view` whose list predated the patcher. A fixture that displays text the
    // product would never emit teaches the reader a UI that does not exist
    // (GUIDELINES 2.1.1) — and it does it in a screenshot, which is the one place
    // a reader has no way to check it against anything.
    for (const line of dock.commands.help.run([], dock).split('\n')) {
      if (line.startsWith('note ') || line.startsWith('view ')) dock.log('out', line);
    }
    dock.log('in', '> goto 8 1');
    dock.log('out', 'cursor 8 t1');
    dock.log('in', '> note 64');
    dock.log('out', 'note 64');
    dock.log('out', '{"ok":true,"type":2}');
    // Both refusals go through the real submit path, which echoes the input and
    // logs whatever the product actually says. Neither reaches `api`: an unknown
    // name never resolves to a command, and `note 999` is refused by the argument
    // schema before `run` is called — so the fixture stays side-effect free while
    // being genuinely produced rather than transcribed. The transcribed version
    // said "pitch out of range: 999", which the schema stopped emitting when it
    // took over the refusals and started naming the argument it means.
    dock.submit('note 999');
    dock.submit('nope');
    draw();
  },
  /**
   * Patcher fixture: a branching graph with all three edge kinds and a node type
   * that has no config table, so the "show nothing rather than eight anonymous
   * numbers" path is exercised too.
   */
  /**
   * A device chain with something in it.
   *
   * The bundled projects all have empty chains, so the live stack proves the
   * PIPELINE (engine emits, sidecar accumulates, client stores) and cannot
   * prove the cards. Same reason every other surface here has a fixture: the
   * rendering and the plumbing fail differently and want testing separately.
   * The values are the engine's own vocabulary — DeviceKind, the capability
   * bits, and the two sentinels from device_chain.h.
   */
  useChainFixture: () => {
    state.hudFrozen = true;
    state.cursor.track = 0;
    state.chainSelected = 1;
    chains = Object.create(null);
    chains[0] = { track: 0, version: 87, devices: [
      { id: 4, kind: 0, pos: 0, node: 11, slot: 0xfffffffe, caps: 2, bypass: 0 },
      { id: 7, kind: 3, pos: 1, node: 0xffffffff, slot: 1, caps: 5, bypass: 0 },
      { id: 9, kind: 2, pos: 2, node: 14, slot: 0xfffffffe, caps: 4, bypass: 0 },
      { id: 12, kind: 4, pos: 3, node: 0xffffffff, slot: 2, caps: 4, bypass: 1 },
    ] };
    chainRev = 1;
    // Two of the four have answered, so the fixture covers the state the rack is
    // actually in most of the time: a rack part-way through being told what it
    // holds. A fixture where everything has answered would not exercise the
    // "asking the hosts" line at all.
    deviceParams[paramKey(0, 7)] = { track: 0, device: 7, name: 'Identity', params: [
      { index: 0, value: 620, name: 'cutoff', display: '620 Hz' },
      { index: 1, value: 310, name: 'reso', display: '0.31' },
      { index: 2, value: 880, name: 'drive', display: '+8.8 dB' },
    ] };
    deviceParams[paramKey(0, 12)] = { track: 0, device: 12, name: 'Valhalla Delay', params: [
      { index: 0, value: 187, name: 'time', display: '3/16' },
      { index: 1, value: 540, name: 'feedback', display: '0.54' },
    ] };
    draw();
  },
  usePatcherFixture: () => {
    state.useEngine = true; state.hudFrozen = true; conn.close();
    hudText.nodeValue = 'patcher-fixture';
    state.view = 'patcher'; state.selectedNode = 1;
    const nodes = [
      { id: 0, type: 1, hasConfig: true, config: Int32Array.from([16, 5, 0, 1, 0, 100, 4, 0]) },
      { id: 1, type: 5, hasConfig: true, config: Int32Array.from([8, 100, 0, 0, 0, 0, 0, 0]) },
      { id: 2, type: 4, hasConfig: true, config: Int32Array.from([2500, 750, 0, 0, 0, 0, 0, 0]) },
      { id: 3, type: 0, hasConfig: false, config: new Int32Array(8) },
      { id: 4, type: 6, hasConfig: false, config: new Int32Array(8) },
    ];
    const edges = [
      { src: 0, srcPort: 1, dst: 1, dstPort: 0, kind: 0 },
      { src: 1, srcPort: 1, dst: 4, dstPort: 0, kind: 0 },
      { src: 2, srcPort: 0, dst: 3, dstPort: 0, kind: 2 },
      { src: 3, srcPort: 0, dst: 4, dstPort: 1, kind: 1 },
    ];
    engine = { ok: true, seq: 1, playheadTick: 0, visualSample: 0, clipVersion: 1,
               harmonyVersion: 0, transport: 0, trackCount: 6, stale: false,
               peaks: new Float32Array(6), peakCount: 0, notes: [], noteCount: 0,
               aggCount: new Uint32Array(0), aggRep: new Uint8Array(0),
               aggLo: new Uint8Array(0), aggHi: new Uint8Array(0), aggRows: 0, aggTracks: 0,
               extents: [], extentCount: 0, extentsRevision: 1, names: [],
               lpb: Uint8Array.from([4, 4, 4, 3, 4, 6, 0, 0]),
               patcherVersion: 3, patcherDevice: 0, patcherNodes: nodes, patcherEdges: edges,
               mixGain: new Int32Array(16), mixPan: new Int32Array(16),
               mixFlags: new Uint8Array(16), mixCount: 0, mixerVersion: 1,
               rowGrid: 1, notesRevision: 1, aggRevision: 1 };
    draw();
  },
  /** Which rows a lane actually has, for assertions that don't read pixels. */
  laneRows: (track) => {
    const out = [];
    for (let r = 0; r < 12; r++) if (onLaneGrid(r, track)) out.push(r);
    return out;
  },
  scrollX: (x) => { state.scrollX = Math.max(0, x); draw(); },
  right: () => { let f = Math.min(state.cursor.track*state.columns+state.cursor.col+1, state.tracks*state.columns-1);
                 state.cursor.track = Math.floor(f/state.columns); state.cursor.col = f%state.columns; follow(); draw(); },
  left: () => { let f = Math.max(0, state.cursor.track*state.columns+state.cursor.col-1);
                state.cursor.track = Math.floor(f/state.columns); state.cursor.col = f%state.columns; follow(); draw(); },
  setZoom: (z) => { state.zoom = z; draw(); },
  step: () => { state.cursor.row++; state.playhead = (state.playhead + 1) % TOTAL_ROWS; follow(); draw(); },
  /** Synchronous draw. Tests must not route through schedule(), which coalesces
   *  to one draw per animation frame — a 3000-iteration loop through it measures
   *  a handful of draws and reports a reassuring number that means nothing. */
  redraw: () => draw(),
  totalRows: TOTAL_ROWS,
};

// Restoring runs LAST, after every declaration it touches.
//
// It first ran up beside the resize listener, where SESSION_KEY is still in its
// temporal dead zone — and the try/catch around the parse swallowed the
// ReferenceError and returned null, so it silently restored nothing. Fourth TDZ
// bug in this file; the header comment warns about exactly this.
{
  // Restore before the first draw, so the app opens where it was rather than
  // flashing the default and jumping.
  const wanted = restoreSession();
  if (wanted) {
    // The label is ours either way: the engine may already have this project
    // open, in which case we do not reload it but we do still know its name.
    state.currentProject = wanted;
    // The engine has its own idea of what is loaded; ask for ours once the
    // command socket is up, and only if the engine has nothing yet.
    const t = setInterval(() => {
      if (!conn || !conn.canSend()) return;
      clearInterval(t);
      if (!engine || engine.noteCount === 0) conn.loadProject(wanted);
    }, 200);
    setTimeout(() => clearInterval(t), 10000);
  }
}
</script>
