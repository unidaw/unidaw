    // this is a guarded write whose input is 0 for most of a session.
    headRow.style.transform = 'translateX(-' + state.scrollX + 'px)';
  }
  // The node count is an O(tree) walk. Sampling it every frame cost ~7 ms —
  // more than the render it was reporting on. Diagnostics must not be in the
  // hot path; refresh it on a timer instead.
}

// Input is coalesced into one draw per animation frame. Without this, key
// repeat fires a synchronous draw per keydown — at ~30/s against an 8 ms draw
// that is a quarter of the main thread and several draws can queue inside one
// frame, which is what makes a held zoom or scroll key feel like it lags even
// though a single press is comfortably inside budget.
// Keep the cursor away from both edges of the VIEWPORT — not of the pool. The
// pool is larger than the viewport by the overscan, so thresholding against it
// put the trigger at row 89 of 92 visible: you could press down eighty-nine
// times and nothing would move, which reads as "scrolling is broken".
//
// The cursor centres and the timeline moves under it — the tracker convention
// (Renoise, OpenMPT). It also means scrolling starts on the very first keypress
// that crosses the middle, instead of after a long dead zone.
/**
 * Keep the playhead in view while the transport runs.
 *
 * Every DAW does this and this one did not: at 1/48 the tracker's 62 rows are
 * about five beats, so the playhead left the window within a second and stayed
 * gone. Following is on by default and switches OFF the moment you scroll or
 * move the cursor yourself — looking somewhere else during playback is a
 * deliberate act, and yanking the view back is the wrong answer to it. `F`
 * turns it back on, and starting the transport does too.
 */
function followPlayhead() {
  if (!state.followPlayhead || !engine || !engine.transport) return;
  const tick = engine.playheadTick;

  if (state.view === 'tracker') {
    const row = Math.floor(tick / ZOOM_LEVELS[state.zoom].rowNanoticks);
    const visible = Math.max(1, tracker.poolSize);
    // A margin, not an edge: pinning the playhead to the last row means you
    // never see what is coming.
    if (row < state.start + 2 || row >= state.start + visible - 4) {
      state.start = Math.max(0, row - Math.floor(visible / 3));
    }
    return;
  }
  if (state.view === 'arrange' && arrangeBuf) {
    const span = arrangeBuf.view.ticksPerPixel * arrangeBuf.view.width;
    if (tick < arrangeBuf.view.startTick || tick > arrangeBuf.view.startTick + span * 0.85) {
      state.arrangeStart = Math.max(0, tick - span / 4);
    }
    return;
  }
  if (state.view === 'piano' && pianoBuf) {
    const span = pianoBuf.view.ticksPerPixel * pianoBuf.view.width;
    if (tick < pianoBuf.view.startTick || tick > pianoBuf.view.startTick + span * 0.85) {
      state.pianoStart = Math.max(0, tick - span / 4);
    }
  }
}

/**
 * Sound a pitch without writing it — the other half of keyjazz.
 *
 * A placeholder with a real shape. The engine has no note-preview command:
 * WriteNote is the only note command and it edits the document, so there is
 * nothing to send yet. Requested from backend as PreviewNote(45), held rather
 * than fire-and-forget so a sustained key sustains and chords work.
 *
 * Written now, and called from the key handler now, so that when the command
 * lands this is a one-line change at a site that is already exercised — rather
 * than a feature that has to be threaded through the keyboard afterwards. It
 * reports through the same reject line every other refusal uses, once, so the
 * silence is explained rather than merely quiet.
 */
/**
 * Which pitches are sounding, so every note-on gets exactly one note-off.
 *
 * A Set keyed on `track * 128 + pitch`, because the same pitch held on two tracks
 * is two voices and releasing one must not silence the other. Bounded by
 * construction — 128 pitches times the track cap — and cleared on blur, because a
 * key released while the window is not focused never delivers its keyup and would
 * otherwise leave a voice sounding with nothing on screen able to stop it.
 */
/** The last openEditor request, for the reason its comment gives. */
let lastEditor = null;
const sounding = new Set();
const voiceKey = (track, pitch) => track * 128 + pitch;

function auditionOn(pitch) {
  const k = voiceKey(state.cursor.track, pitch);
  // The OS repeats a held key. Retriggering on every repeat turns a held note into
  // a machine-gun; backend de-dupes a second on for a held pitch to a no-op, and
  // not sending it at all is cheaper than having the engine ignore it.
  if (sounding.has(k)) return;
  sounding.add(k);
  conn && conn.send({ type: 'preview', track: state.cursor.track,
                      pitch, vel: state.velocity, on: 1 });
}

function auditionOff(pitch, track) {
  const t = track === undefined ? state.cursor.track : track;
  const k = voiceKey(t, pitch);
  if (!sounding.delete(k)) return;
  conn && conn.send({ type: 'preview', track: t, pitch, vel: 0, on: 0 });
}

/**
 * Release everything. Called on keyup for one pitch and on blur for all of them.
 *
 * The engine also flushes held previews on Stop, which is the backstop for a
 * dropped keyup — but a note left sounding because the window lost focus is a
 * note the user cannot stop without finding the transport, so this is the half
 * that has to be here.
 */
function auditionAllOff() {
  for (const k of sounding) {
    conn && conn.send({ type: 'preview', track: (k / 128) | 0, pitch: k % 128, vel: 0, on: 0 });
  }
  sounding.clear();
}
addEventListener('blur', auditionAllOff);

function follow() {
  const visible = Math.max(1, Math.floor(boxOf(host, true) / metrics.rowHeight));
  const centre = Math.floor(visible / 2);
  state.start = Math.max(0, Math.min(state.cursor.row - centre, Math.max(0, TOTAL_ROWS - visible)));

  // Horizontal: keep the cursor's cell inside the viewport, scrolling the track
  // strip under the sticky gutter. Same principle as vertical — a margin, not an
  // edge, or the cursor pins to the right-hand side and you cannot see ahead.
  // Geometry comes from the renderer's measurement, not from re-deriving the
  // box model here. The cell's left edge and the scroll extent both include the
  // per-track borders, which arithmetic kept forgetting.
  const viewW = boxOf(host, false);
  const cellL = tracker.cellLeft(state.cursor.track, state.cursor.col);
  const cellR = cellL + metrics.cellWidth;
  const gutter = metrics.gutterWidth;                 // sticky: always covers the left edge
  const margin = Math.min(tracker.trackStride || 0, Math.floor((viewW - gutter) / 6));
  if (cellL - state.scrollX < gutter + margin) state.scrollX = cellL - gutter - margin;
  else if (cellR - state.scrollX > viewW - margin) state.scrollX = cellR - viewW + margin;
  state.scrollX = Math.max(0, Math.min(state.scrollX, tracker.maxScrollX(viewW)));
}

let dirty = false;
// Hoisted: this is handed to requestAnimationFrame once per frame, and an arrow
// written inline is a fresh closure each time. It captures nothing.
function onFrame() { dirty = false; draw(); }
function schedule() {
  if (dirty) return;
  dirty = true;
  requestAnimationFrame(onFrame);
}

function scrollTo(row) {
  state.start = Math.max(0, Math.min(TOTAL_ROWS - tracker.poolSize, row));
  draw();
}

/**
 * Every engine note inside the current selection (or just the cursor's note when
 * there is no selection), as {note, row}. Rows are viewport rows, scaled the same
 * way the renderer scales them.
 *
 * Selection is a rectangle over (row, field), where a field is track*columns+col.
 * Notes live in column 0, so a selection that covers no column-0 field selects no
 * notes — which is correct, and is why this filters on the field rather than on
 * the track.
 */
function notesInSelection() {
  const out = [];
  if (!engine) return out;
  const sel = state.selection;
  const scale = engine.rowGrid > 0 ? ZOOM_LEVELS[state.zoom].linesPerBeat / engine.rowGrid : 1;
  for (let i = 0; i < engine.noteCount; i++) {
    const n = engine.notes[i];
    const row = scale === 1 ? n.row : Math.round(n.row * scale);
    if (sel) {
      if (row < sel.r0 || row > sel.r1) continue;
      const field = n.track * state.columns;          // notes are column 0
      if (field < sel.f0 || field > sel.f1) continue;
    } else {
      if (row !== state.cursor.row || n.track !== state.cursor.track) continue;
    }
    out.push({ n, row });
  }
  return out;
}

/** The rows and tracks the selection spans, for pasting relative to the cursor. */
function selectionOrigin() {
  const sel = state.selection;
  return sel ? { row: sel.r0, track: Math.floor(sel.f0 / state.columns) }
             : { row: state.cursor.row, track: state.cursor.track };
}

/**
 * The clipboard. Notes are stored RELATIVE to the selection's origin, in ticks
 * and track offsets, so a paste lands correctly at a different row, a different
 * track, and a different zoom. Storing absolute rows would bake the zoom the copy
 * was made at into the paste — the same mistake as storing a row anywhere else.
 */
let clipboard = { notes: [], span: 0 };

function copySelection() {
  const picked = notesInSelection();
  if (!picked.length) { state.reject = 'nothing to copy'; return false; }
  const org = selectionOrigin();
  const orgTick = org.row * ZOOM_LEVELS[state.zoom].rowNanoticks;
  clipboard.notes = picked.map(({ n }) => ({
    dt: n.tOn - orgTick, dur: Math.max(1, n.tOff - n.tOn),
    dTrack: n.track - org.track, pitch: n.pitch, velocity: n.velocity,
  }));
  clipboard.span = clipboard.notes.reduce((a, c) => Math.max(a, c.dt + c.dur), 0);
  state.reject = null;
  return true;
}

function deleteSelection() {
  const picked = notesInSelection();
  if (!picked.length) { state.reject = 'nothing to delete'; return false; }
  if (!conn) { state.reject = 'no engine'; return false; }
  const base = engine ? engine.clipVersion : 0;
  const ops = picked.map(({ n }) => ({ type: 'delete', track: n.track, tick: n.tOn }));
  if (!conn.sendBatch(ops)) { state.reject = 'no engine'; return false; }
  for (const { n, row } of picked) addPending(row, n.track, 0, '', base);
  state.reject = null;
  return true;
}

function pasteClipboard() {
  if (!clipboard.notes.length) { state.reject = 'clipboard is empty'; return false; }
  if (!conn) { state.reject = 'no engine'; return false; }
  const atTick = tickOfCursorRow();
  const ops = [];
  for (const c of clipboard.notes) {
    const track = state.cursor.track + c.dTrack;
    if (track < 0 || track >= state.tracks) continue;   // pasted off the edge
    ops.push({ type: 'note', track, pitch: c.pitch, tick: atTick + c.dt,
               dur: c.dur, vel: c.velocity });
  }
  if (!ops.length) { state.reject = 'paste would land off the edge'; return false; }
  if (!conn.sendBatch(ops)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  return true;
}

/**
 * Transpose the selection. Sends a write at the SAME tick with a new pitch, which
 * the engine treats as a replace — no delete/rewrite pair, so there is no window
 * in which the note does not exist.
 */
function transposeSelection(semitones) {
  const picked = notesInSelection();
  if (!picked.length) { state.reject = 'nothing to transpose'; return false; }
  if (!conn) { state.reject = 'no engine'; return false; }
  const base = engine ? engine.clipVersion : 0;
  const ops = [], marks = [];
  for (const { n, row } of picked) {
    const p = n.pitch + semitones;
    if (p < 0 || p > 127) continue;                     // silently clamping would lose the note
    ops.push({ type: 'note', track: n.track, pitch: p, tick: n.tOn,
               dur: Math.max(1, n.tOff - n.tOn), vel: n.velocity });
    marks.push({ row, track: n.track, p });
  }
  const moved = ops.length;
  if (!moved) { state.reject = 'transpose would push notes out of MIDI range'; return false; }
  if (!conn.sendBatch(ops)) { state.reject = 'no engine'; return false; }
  for (const m of marks) addPending(m.row, m.track, 0, pitchToToken(m.p), base);
  if (moved < picked.length) state.reject = (picked.length - moved) + ' note(s) out of range';
  else state.reject = null;
  return true;
}

/** The engine note the cursor is sitting on, or null. */
/**
 * The chord under the cursor, or null.
 *
 * Mirrors noteAtCursor, including the row SCALING — a chord's published row is in the
 * grid the sidecar last projected, and the cursor is in the current zoom's, so a
 * comparison without the scale matches on the wrong row at every zoom but one.
 *
 * A chord occupies the track's FIRST note column, which is where the view model draws
 * it: a chord is a property of the track at that moment rather than of one of its note
 * columns, so it does not take the cursor's column into account.
 */
function chordAtCursor() {
  if (!engine) return null;
  const scale = engine.rowGrid > 0 ? ZOOM_LEVELS[state.zoom].linesPerBeat / engine.rowGrid : 1;
  for (let i = 0; i < engine.chordCount; i++) {
    const c = engine.chords[i];
    if (c.track !== state.cursor.track) continue;
    const r = scale === 1 ? c.row : Math.round(c.row * scale);
    if (r === state.cursor.row) return c;
  }
  return null;
}

/**
 * The canonical op string for the note under the cursor, or '' when there is none.
 *
 * Built per frame ONLY while the cursor sits on the ops field, which is a gesture rather than a
 * loop — everywhere else this returns before it allocates anything. The draw path's no-allocate
 * rule is about what runs on every cell of every frame; a single string for the one cell a
 * person is standing on is not that.
 */
function opsAtCursorText() {
  if (fieldOfCol(state.cursor.col) !== 2) return '';
  const n = noteAtCursor();
  if (!n) return '';
  return opsText(n, ticksPerBeat(songMeter()));
}

function noteAtCursor() {
  if (!engine) return null;
  const scale = engine.rowGrid > 0 ? ZOOM_LEVELS[state.zoom].linesPerBeat / engine.rowGrid : 1;
  for (let i = 0; i < engine.noteCount; i++) {
    const n = engine.notes[i];
    if (n.track !== state.cursor.track) continue;
    // The cursor's own note column. A track showing three of them has three
    // different notes on one row, and "the note at the cursor" is one of them —
    // returning the first match made Delete and the entry guard both act on
    // whichever note happened to come first in the array.
    if ((n.column | 0) !== noteColOf(state.cursor.col)) continue;
    const r = scale === 1 ? n.row : Math.round(n.row * scale);
    if (r === state.cursor.row) return n;
  }
  return null;
}

/** The engine note SOUNDING at the cursor's tick — it may have started earlier. */
function noteCoveringCursor() {
  if (!engine) return null;
  const tick = tickOfCursorRow();
  for (let i = 0; i < engine.noteCount; i++) {
    const n = engine.notes[i];
    if (n.track === state.cursor.track && n.tOn <= tick && tick < n.tOff) return n;
  }
  return null;
}

/** Rewrite a note in place with a new velocity or duration. */
function rewriteNote(n, { vel = n.velocity, dur = n.tOff - n.tOn } = {}) {
  if (!conn) return false;
  const base = engine ? engine.clipVersion : 0;
  const ok = conn.send({ type: 'note', track: n.track, pitch: n.pitch,
                         tick: n.tOn, dur: Math.max(1, dur), vel });
  return ok ? base : false;
}

/**
 * Note off. A tracker OFF at row R means "whatever is sounding here stops here",
 * which in a model of (t_on, t_off) pairs is a truncation of the covering note —
 * not a new event, and not a deletion unless the note starts on this very row.
 */
function noteOffAtCursor() {
  const n = noteCoveringCursor();
  if (!n) return false;
  const tick = tickOfCursorRow();
  if (n.tOn >= tick) return deleteAtCursor();
  const base = rewriteNote(n, { dur: tick - n.tOn });
  if (base !== false) addPending(state.cursor.row, state.cursor.track, 0, 'OFF', base);
  return base !== false;
}

function deleteAtCursor() {
  if (!conn) { state.reject = 'no engine'; return false; }
  /**
   * At an aggregate zoom a row is a SUMMARY, not a position.
   *
   * "1 bar" and "4 bars" per row mean the cursor names sixteen bars of music at
   * once, so `tickOfCursorRow()` is the start of that span and not the tick of
   * any particular note. The delete went out addressed to a tick nothing was on,
   * the engine matched nothing, and the UI said nothing — the note stayed and
   * the command reported success. Refusing by name is the whole difference
   * between "that did not work" and "I wonder what happened".
   */
  if (ZOOM_LEVELS[state.zoom].aggregate) {
    state.reject = `zoom in to edit — a row here is ${ZOOM_LEVELS[state.zoom].label}`;
    return false;
  }
  /*
   * A CHORD IS DELETABLE TOO, and it was not.
   *
   * This checked for a NOTE and refused with "no note here" when the cursor was on a
   * chord — so a chord could be written and never removed. Creating something you
   * cannot delete is worse than not being able to create it, and the refusal read as
   * "there is nothing here" while a chord name sat in the cell.
   *
   * Notes first, because a note and a chord can share a row: the cell says so (it
   * draws `collide`), and deleting the note you can see the pitch of is the less
   * surprising of the two. A second press then takes the chord.
   */
  if (engine && !noteAtCursor()) {
    const chord = chordAtCursor();
    if (chord) return deleteChord(chord);
    state.reject = 'nothing here to delete';
    return false;
  }
  const base = engine ? engine.clipVersion : 0;
  if (!conn.send({ type: 'delete', track: state.cursor.track, tick: tickOfCursorRow(),
                   // WHICH column's note. Without it, deleting in the second
                   // column removes the first column's note instead.
                   column: noteColOf(state.cursor.col) })) return false;
  addPending(state.cursor.row, state.cursor.track, 0, '', base);
  return true;
}

/**
 * Remove a chord, BY ID.
 *
 * The engine accepts either an id or a (track, tick, column) position, and the id is
 * the one to use when there is one: two chords in a row's span are distinguishable by
 * id and not by the tick a row rounds to. Position is what the console falls back to
 * when a person is naming a place rather than a thing.
 */
function deleteChord(chord) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; return false; }
  if (!conn.send({ type: 'delchord', track: chord.track, tick: chord.tick,
                   id: chord.id })) return false;
  state.reject = null;
  schedule();
  return true;
}

/**
 * Write a chord at the cursor. Its own command and its own payload — the engine
 * dispatches on entry size, so a chord sent as an ordinary note command is
 * silently ignored rather than rejected.
 */
function writeChord(c) {
  if (!onLaneGrid(state.cursor.row, state.cursor.track)) {
    state.reject = 'lane has no row here'; return false;
  }
  const base = engine ? engine.clipVersion : 0;
  const ok = conn && conn.send({
    type: 'chord', track: state.cursor.track, tick: tickOfCursorRow(),
    column: state.cursor.col, degree: c.degree, quality: c.quality,
    inv: c.inv, oct: c.oct, spread: c.spread, ht: c.ht, hv: c.hv, dur: c.dur,
  });
  if (!ok) { state.reject = 'no engine'; return false; }
  const NAMES = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  const label = (NAMES[c.degree % 7] || String(c.degree + 1))
    + (c.quality === 2 ? '7' : c.quality === 0 ? '' : '');
  addPending(state.cursor.row, state.cursor.track, state.cursor.col, label, base);
  return true;
}

/** Write a pitch at the cursor, optimistically. */
function writePitch(pitch) {
  if (!onLaneGrid(state.cursor.row, state.cursor.track)) {
    state.reject = 'lane has no row here'; return false;
  }
  const base = engine ? engine.clipVersion : 0;
  const dur = laneRowTicks(state.cursor.track);
  if (!conn || !conn.send({ type: 'note', track: state.cursor.track, pitch,
                            tick: tickOfCursorRow(), dur, vel: state.velocity })) return false;
  addPending(state.cursor.row, state.cursor.track, 0, pitchToToken(pitch), base);
  return true;
}

/**
 * A digit typed into a value column. Commits on the keystroke — there is nothing
 * to confirm, because the field is a fixed width and is always complete.
 * Velocity is carried on the note itself, so this is a rewrite of that note.
 */
function typeValue(digit) {
  // Checked before the note lookup: on this column the missing piece is the
  // command, not the note, and reporting "no note here" would send you looking
  // for the wrong thing.
  if (fieldOfCol(state.cursor.col) !== 1) {
    state.reject = 'effect column needs an engine param path';
    return false;
  }
  const n = noteAtCursor();
  if (!n) { state.reject = 'no note here to carry a value'; return false; }
  {
    // Continue the field if we are still on the same cell, else start fresh.
    const same = state.digitCell === state.cursor.row * 1000 + state.cursor.track;
    state.digitCell = state.cursor.row * 1000 + state.cursor.track;
    const cur = same ? state.digitAcc : 0;
    const v = Math.min(127, shiftDigit(cur, digit));
    state.digitAcc = v;
    const base = rewriteNote(n, { vel: v });
    if (base === false) return false;
    /*
     * HEX, through the SAME function the settled cell uses.
     *
     * This was `('0' + v).slice(-2)` — the last two DECIMAL digits — which is verbatim the
     * formula viewmodel.js's own comment records as the bug it fixed: 127 reads as "27" and 100
     * as "00", both plausible velocities, neither the one you typed. The optimistic overlay
     * kept it, so a typed velocity flashed a wrong number for one round trip and then settled
     * to the right one, which is the hardest kind of wrong to notice.
     *
     * Calling `velocityText` rather than repeating its logic is the point: a second formatter is
     * how the first one's fix failed to reach here.
     */
    addPending(state.cursor.row, state.cursor.track, 1, velocityText(v), base);
    return true;
  }
}

/**
 * Write a scale degree at the cursor from a bare digit.
 *
 * Degrees are 1-based everywhere a musician writes them (I, II, III...), so `1`
 * is the root. That makes `0` not a degree at all rather than a synonym for the
 * root, and saying so is better than quietly writing the tonic when someone
 * meant something else.
 *
 * The octave is the entry octave, the same one a letter key uses, so a digit and
 * a letter put a note in the same register.
 */
function typeDegree(digit) {
  if (digit < 1) {
    state.reject = 'degrees are 1-based — 1 is the root, so 0 is not a degree';
    return false;
  }
  // quality 0 is "single note": a degree, not a chord built on it.
  return writeChord({ degree: digit - 1, quality: 0, inv: 0, oct: state.octave,
                      spread: 0, ht: 0, hv: 0, dur: 0 });
}

/** Grow the selection to include `row`, anchoring on where it started. */
function extendSelection(row) {
  const field = state.cursor.track * state.columns + state.cursor.col;
  if (!state.selection) {
    state.selection = { r0: state.cursor.row, r1: state.cursor.row, f0: field, f1: field };
    state.selection._anchor = state.cursor.row;
  }
  const a = state.selection._anchor;
  state.selection.r0 = Math.min(a, row);
  state.selection.r1 = Math.max(a, row);
}

/** Any cursor move abandons a half-typed token. */
function moveCursor(fn) {
  if (entry.active) cancel(entry);
  // Looking somewhere else during playback is deliberate; do not yank the view
  // back. `F` re-enables, and so does starting the transport.
  state.followPlayhead = false;
  state.digitCell = -1;
  // An unshifted move drops the selection. Keeping it would leave a range
  // highlighted that the next operation silently acts on.
  state.selection = null;
  /*
   * ...and drops the OP selection with it, for the same reason one step up.
   *
   * An op is selected by index within one note's ops, so the same index on the next row is a
   * different op — or none. Carried across a move it would leave a caret pointing at something
   * that is not there, and `@` would edit whatever now occupies that position.
   *
   * Cleared here rather than in each caller so a move added later cannot forget: the within-cell
   * step is the one path that deliberately does NOT go through this function.
   */
  state.cursor.op = -1;
  fn();
}

/**
 * Note-off. The page has never had a keyup handler because nothing it did was
 * held — a note was written and that was the end of it.
 *
 * Unconditional on edit mode: if the mode is toggled while a key is down, the
 * keyup still has to release the voice that the keydown started, or the toggle
 * strands it. Same reason it does not check the view.
 */
addEventListener('keyup', (e) => {
  if (!sounding.size) return;
  const pitch = pitchOf(e.key.toLowerCase(), state.octave);
  if (pitch >= 0) auditionOff(pitch);
});

addEventListener('keydown', (e) => {
  const k = e.key;
  /**
   * Which physical key is held with Alt, or '' when Alt is not held.
   *
   * Alt combos CANNOT match on e.key. On macOS, Option is a compose modifier:
   * Option+Q delivers key 'œ', Option+C delivers 'ç', Option+S delivers 'ß'.
   * Every alt shortcut in this handler matched on e.key and was therefore dead
   * on the primary platform, while passing every test — Playwright synthesises
   * key 'q' for Alt+Q, which is what Windows sends and macOS does not.
   *
   * e.code is the physical key and is unaffected. The cost is that on a
   * non-US physical layout these follow the key's position rather than its
   * printed letter, which is the usual trade for shortcuts and much better than
   * not firing at all.
   */
  const alt = e.altKey ? e.code : '';
  const done = () => { e.preventDefault(); schedule(); };

  // 0. The mode keys, ahead of everything — including any open text field. A
  //    surface switch is never what you meant to type, and a user who cannot
  //    leave a surface is stuck in it. Tab still cycles; these name the surfaces.
  for (const t of VIEW_TABS) {
    if (k !== t.key) continue;
    /*
     * SHIFT OPENS IT BELOW, and the same chord closes it again.
     *
     * One key per view, one modifier for "the other pane", and the modifier is a
     * TOGGLE on the view already down there — so the way out is the way in,
     * which is how every other toggle in this app works. Without that, closing
     * the second pane would need a key of its own that nothing suggests.
     *
     * The same view in both panes is refused rather than allowed: two copies of
     * one surface cannot both hold the element, and "the tracker above the
     * tracker" answers no question anyone has.
     */
    if (e.shiftKey) {
      if (state.view2 === t.view) { state.view2 = null; state.pane = 0; }
      else if (state.view === t.view) { state.reject = 'that view is already open above'; }
      else { state.view2 = t.view; state.pane = 1; if (t.view === 'piano') fitPiano(); }
      state.focus = 'centre';
      return done();
    }
    // Plain: the FOCUSED pane's view changes. The muscle memory of a single
    // pane is untouched, because with no split the focused pane is the only one.
    if (state.pane === 1 && state.view2 !== null) {
      if (state.view === t.view) { state.reject = 'that view is already open above'; return done(); }
      state.view2 = t.view;
    } else {
      if (state.view2 === t.view) { state.reject = 'that view is already open below'; return done(); }
      state.view = t.view;
    }
    if (t.view === 'piano') fitPiano();
    state.focus = 'centre';
    return done();
  }

  /**
   * 0.1 A TEXT FIELD OWNS ITS OWN KEYS.
   *
   * This listener is registered `{ capture: true }`, so it runs BEFORE any
   * element's own handler — and `done()` calls preventDefault(), which is
   * precisely what stops an <input> from inserting the character. So every text
   * field in the application was unusable: you could focus the console with `/`,
   * watch `document.activeElement` become `.dk-input`, type, and get nothing.
   * Same for the browser rail's search, which listens for `input` events that
   * could never fire.
   *
   * The dock tried to defend itself with `e.stopPropagation()` in its own
   * handler, and that is powerless here: by the time the target sees the event,
   * the capturing listener has already run and already prevented it.
   *
   * Nothing in any suite caught this, because every one of them types by calling
   * `__uni.run(line)` — which hands the console a string directly and never
   * presses a key. The only way to see it is to press keys.
   *
   * The surface switches above still win, deliberately: leaving a surface is
   * never what you meant to type, and being stuck inside a text box with no way
   * out is worse than losing an F-key. Everything else — including ⌘Z, which
   * inside a field means "undo my typing", not "undo the song" — belongs to the
   * field.
   */
  const el = e.target;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) {
    return;                    // NOT done(): no preventDefault, let it type
  }

  // 1. Modifier combos first, so nothing below can swallow them. Cmd on macOS,
  //    Ctrl elsewhere — both, because the same build runs on both.
  if (e.metaKey || e.ctrlKey) {
    const c = k.toLowerCase();
    if (c === 'z') {
      conn && conn.send({ type: e.shiftKey ? 'redo' : 'undo' });
      return done();
    }
    // The design's grammar: ⌘B browser, ⌘J agent. They move FOCUS to a panel
    // that is already on screen; a second press puts it away entirely, because
    // a rail you never use should not cost 266px for ever.
    if (c === 'b') {
      if (state.focus === 'browser') state.browserOpen = false;
      else { state.browserOpen = true; conn && conn.send({ type: 'list' }); }
      state.focus = state.browserOpen ? 'browser' : 'centre';
      return done();
    }
    if (c === 'k') { palette.toggle(); return done(); }
    /**
     * ⌘S SAVES.
     *
     * Saving existed in three places and none of them was this one: `S` in the
     * browser rail, `save <name>` in the console, and `__uni.save`. All three are
     * SAVE AS — they take a name — so keeping a song you already named meant
     * opening a rail, pressing a second key and typing the name back. The single
     * most expected shortcut in any application, and it did nothing.
     *
     * ⌘⇧S is save-as, matching the rail. It is NOT the scale browser: the chrome
     * shows "⌘⇧S" beside the key readout, which is a label for a shortcut that
     * was never bound to anything.
     *
     * An unnamed song has nothing to save TO, so it falls through to save-as
     * rather than inventing a filename.
     */
    if (c === 's') {
      const named = state.currentProject;
      if (e.shiftKey || !named) {
        state.browserOpen = true;
        state.focus = 'browser';
        browser.beginSave(named || '');
        conn && conn.send({ type: 'list' });
        return done();
      }
      if (!conn || !conn.saveProject(named)) state.reject = 'no engine';
      else state.reject = null;
      return done();
    }
    /**
     * Copy, cut and paste on the keys everybody already knows.
     *
     * These have only ever been Alt+C / Alt+V / Alt+X — the tracker convention,
     * kept because Alt combos are free in a browser tab. But ⌘C and ⌘V are what a
     * hand reaches for without deciding to, and a range you selected and cannot
     * copy is worse than one you can copy two ways. Both work now.
     *
     * Above the text-field guard's sibling cases and inside the modifier block,
     * so a field still gets its own ⌘C: the guard at 0.1 returns before this
     * whenever the event came from an <input>.
     */
    if (c === 'c') { copySelection(); return done(); }
    if (c === 'x') { if (copySelection()) deleteSelection(); return done(); }
    if (c === 'v') { pasteClipboard(); return done(); }
    /**
     * A new song.
     *
     * CHROME RESERVES Cmd+N for a new window and a page cannot intercept it, so
     * this only reaches us in a packaged shell (Electron/Tauri) where the menu is
     * ours. Bound anyway, because it is the binding everyone will try and it will
     * work the day the shell exists — and Shift+Cmd+N is bound beside it as the
     * one that works in a browser tab today.
     */
    if (c === 'n') { dockApi.newSong(); return done(); }
    /**
     * Edit mode. Cmd/Ctrl+E, because Escape is not available.
     *
     * Escape was the first choice — it is Renoise's key and the right muscle
     * memory — and it does not work here: this app has a focus model Renoise does
     * not, so Escape is already "leave the browser rail", then "cancel the token
     * buffer", then "dismiss the rejection". Pressing it did one of those three
     * before it ever reached the mode, so the toggle needed one press or three
     * and you could not tell which without looking at what was on screen.
     *
     * A mode key that is sometimes a dismiss key is worse than either. Escape
     * keeps its dismissals; this gets its own binding, and `edit` in the palette
     * for anyone who does not know it.
     */
    if (c === 'e') { state.editMode = !state.editMode; return done(); }
    if (c === 'j') {
      if (state.focus === 'dock') state.dockOpen = false;
      else { state.dockOpen = true; dock.focus(); }
      state.focus = state.dockOpen ? 'dock' : 'centre';
      return done();
    }
    /*
     * EXCEPT TAB, which has a Ctrl binding of its own further down.
     *
     * This was a bare `return`, so Ctrl+Tab — the documented way to cycle surfaces —
     * never reached its handler and, because the return did not preventDefault,
     * went to the BROWSER instead. The feature had a comment, a help entry and a
     * cycler, and could not be pressed.
     *
     * Everything else with a modifier still stops here: an unrecognised Cmd/Ctrl
     * combo belongs to the browser, and swallowing them all would break Cmd+R,
     * Cmd+L and every other shortcut a person expects to keep working.
     */
    if (k !== 'Tab') return;                  // leave browser shortcuts alone
  }

  // 2. An open token buffer owns the keyboard, except for navigation.
  if (entry.active && k !== 'Tab') {
    const act = feed(entry, k);
    if (act === 'commit') { commitToken(entry.text); cancel(entry); return done(); }
    if (act === 'consumed' || act === 'cancel') return done();
  }

  // 2.02 The palette is modal: while it is up it owns everything except the
  //      modifier combos above, which is what "palette" means.
  if (palette.opened) {
    const act = palette.feed(k);
    // stopPropagation, not just preventDefault, and this is the whole fix for a
    // real bug: ArrowDown moved the selection TWO rows, Enter ran the command and
    // then ran whatever had just become selected.
    //
    // The palette's input has its own keydown handler for exactly these keys —
    // deliberately, so that a focused field behaves when the app is not listening.
    // But THIS listener is registered in the CAPTURE phase (see the bottom of this
    // handler), so it runs on the way DOWN to the input, and the stopPropagation()
    // the input's handler calls is far too late to prevent it. Both handlers ran,
    // both called feed(), and feed() is not idempotent.
    //
    // Stopping here is what makes "one implementation of each key, called once"
    // true. Only when the palette actually consumed the key: a printable falls
    // through as 'ignore' and must reach the input, which is what types the filter.
    if (act !== 'ignore') { e.stopPropagation(); return done(); }
  }

  // 2.05 ANY open text field owns the keyboard, before the global shortcuts.
  //
  //      This is not a nicety. The browser rail opens on `b`, so renaming a
  //      track "Big Bass" opened the rail on the B, fed `i`, `g` and the space
  //      into it, closed it again on the second B, and left "ass" in the rename
  //      field. Every text field has to be checked before the keys that are
  //      "global" only when nothing is being typed into.
  if (mixer.renaming >= 0) {
    if (mixer.feedRename(k) !== 'ignore') return done();
  }

  // 2.1 The dock owns its own input entirely; it stops propagation there. This
  //     only handles opening it and closing it from outside.
  if (state.helpOpen) { state.helpOpen = false; return done(); }
  if (k === '?') { state.helpOpen = true; return done(); }
  if (k === '/' && state.focus !== 'dock') {
    state.dockOpen = true; state.focus = 'dock'; dock.focus(); return done();
  }

  // 2.2 The rail owns the keyboard only while it is FOCUSED. It is on screen
  //     the rest of the time, and a panel you can see is not a panel you are
  //     typing into.
  if (state.browserOpen && state.focus === 'browser') {
    // The save field owns the keyboard while it is up, or typing a project name
    // containing 'b' would close the rail out from under it.
    const act = browser.feedSave(k);
    if (act !== 'ignore') return done();
    // Escape hands the keyboard back rather than putting the rail away: it is a
    // permanent panel now, and dismissing it on Escape would make it flicker
    // out of the layout every time somebody cancelled something.
    if (k === 'Escape') { state.focus = 'centre'; return done(); }
    if (k === 'ArrowDown') { browser.move(1); return done(); }
    if (k === 'ArrowUp') { browser.move(-1); return done(); }
    if (k === 'Enter') { browser.openSelected(); return done(); }
    if (k === 's' || k === 'S') { browser.beginSave(state.currentProject); return done(); }
    return done();                              // swallow the rest, do not edit behind it
  }


  /**
   * 2.4 The rack owns the keyboard while a device is selected.
   *
   * Same rule as the rail above, and it was missing: selecting a device set
   * `chainSelected` and nothing else, so every key still went to the tracker.
   * Backspace on a selected device deleted a note. The selection was real and the
   * focus was a fiction.
   *
   * Escape hands the keyboard back, exactly as it does for the rail, rather than
   * clearing the selection — you can be looking at a device and typing in the
   * tracker, you just have to say so.
   */
  if (state.focus === 'chain') {
    if (k === 'Escape') { state.focus = 'centre'; state.chainSelected = -1; return done(); }
    if (k === 'Backspace' || k === 'Delete') {
      const here = chains[rackTrack()];
      const devs = (here && here.devices) || [];
      const dev = devs[state.chainSelected];
      if (dev) {
        // Same title the card shows and the mouse path asks about, so the two
        // routes to the same destructive action cannot describe it differently.
        const card = chain.vm && chain.vm.cards && chain.vm.cards[state.chainSelected];
        const what = (card && card.title) || 'this device';
        if (confirm(`Remove ${what}? This cannot be undone.`)) {
          delDevice(rackTrack(), dev.id);
          // Step the selection back so it lands on a card that still exists.
          state.chainSelected = Math.max(0, state.chainSelected - 1);
        }
      }
      return done();
    }
    /*
     * SHIFT+ARROW MOVES THE DEVICE; plain arrow moves the SELECTION.
     *
     * The distinction every reorderable list uses, and it needs no new key: shift is
     * already "extend/act on the thing" everywhere else in this app. The selection
     * follows the device, because otherwise a second press moves whatever slid into
     * the old slot — which is how a reorder becomes a shuffle.
     */
    if ((k === 'ArrowRight' || k === 'ArrowLeft') && e.shiftKey) {
      const here = chains[rackTrack()];
      const devs = (here && here.devices) || [];
      const dev = devs[state.chainSelected];
      const to = state.chainSelected + (k === 'ArrowRight' ? 1 : -1);
      if (!dev || to < 0 || to >= devs.length) {
        // Naming the edge rather than silently doing nothing: a key that works four
        // times and then stops is a key you assume is broken.
        state.reject = dev ? 'that device is already at the end' : 'select a device first';
        return done();
      }
      moveDevice(rackTrack(), dev.id, to);
      state.chainSelected = to;
      return done();
    }
    if (k === 'ArrowRight') {
      // Clamped, not incremented freely: the invariant below drops focus back to
      // the tracker when the selection points past the end, so an unclamped
      // ArrowRight would silently throw you out of the pane you are navigating.
      const here = chains[rackTrack()];
      const last = (((here && here.devices) || []).length) - 1;
      state.chainSelected = Math.min(last, state.chainSelected + 1);
      return done();
    }
    if (k === 'ArrowLeft') { state.chainSelected = Math.max(0, state.chainSelected - 1); return done(); }
    /**
     * B BYPASSES THE SELECTED DEVICE.
     *
     * Plain `b`, because ⌘B is the browser rail and this branch only runs while
     * the rack holds the keyboard. A/B-ing an insert is a per-second gesture when
     * you are deciding whether it earns its place, and reaching for the mouse
     * every time is what makes people stop doing it.
     *
     * From the card the rack is DRAWING, not from `chains` — the card is what you
     * are looking at, and the two differ for a frame after every edit.
     */
    if (k === 'b' || k === 'B') {
      const card = chain.vm && chain.vm.cards && chain.vm.cards[state.chainSelected];
      if (card) bypassDevice(rackTrack(), card.id, !card.bypass);
      return done();
    }
    if (k === 'Enter') {
      const here = chains[rackTrack()];
      const dev = (here && here.devices || [])[state.chainSelected];
      if (dev) dockApi.openEditor(rackTrack(), dev.id);
      return done();
    }
    // Everything else falls THROUGH deliberately: transport, view switching and
    // the chords below are global, and swallowing them here would make the rack
    // a place where the space bar stops working.
  }

  // 2.5 View switch, and arrange's own navigation. Arrange has no rows and no
  //     cell editing, so it must not fall through into the tracker's keys.
  /**
   * CTRL+Tab cycles the surfaces; plain Tab belongs to the surface you are in.
   *
   * Tab used to switch views, which spent the most reachable key on the rarest
   * action. In a tracker Tab means "next track" — it is what every tracker since
   * the eighties has meant by it, and it is a per-keystroke move you make
   * constantly, where changing surface is a per-minute one. Ctrl is the modifier
   * because Cmd+Tab is the OS application switcher on macOS and will never reach
   * a page.
   */
  /*
   * ESCAPE CLOSES THE SECOND PANE, from whatever view is in it.
   *
   * This lived inside the arrange branch, back when the only thing that could be
   * down there was the piano roll. With any view able to sit in either pane, an
   * Escape that works in the arrangement and nowhere else is a key that does
   * different things depending on where you happen to be looking — and the pane
   * it will not close is the one you opened by double-clicking a device.
   *
   * Before the per-view branches so it is reachable, after the rail, dock and
   * rack dismissals so those still come first: Escape is several dismissals deep
   * everywhere in this handler and the one people mean is the nearest.
   */
  if (k === 'Escape' && state.view2 !== null && state.focus === 'centre') {
    state.view2 = null;
    state.pane = 0;
    return done();
  }

  if (k === 'Tab' && (e.ctrlKey || e.metaKey)) {
    const order = ['tracker', 'arrange', 'piano', 'mixer', 'patcher'];
    const i = order.indexOf(state.view);
    state.view = order[(i + (e.shiftKey ? order.length - 1 : 1)) % order.length];
    // Opening the piano roll on whatever pitch window was last used shows empty
    // sky more often than not; fit it to the material on entry.
    if (state.view === 'piano') fitPiano();
    return done();
  }
  // Plain Tab in the tracker: the next track, wrapping. Column-preserving, so
  // tabbing across a row keeps you in the note column rather than dropping you
  // into whichever column the previous track left the cursor in.
  /**
   * Enter plays the row the cursor is on, then steps to the next.
   *
   * One row, not the transport — see playRow. Pressing it twice plays two
   * consecutive rows, which is how you audition a phrase a line at a time.
   *
   * Not while a token buffer is open: there Enter commits, which the branch above
   * has already handled and returned from.
   */
  if (k === 'Enter' && state.view === 'tracker') {
    dockApi.playRow(state.cursor.row);
    // Advance like a write does, so pressing Enter twice steps down and plays two
    // rows rather than the same one twice.
    state.cursor.row += Math.max(1, state.editStep); follow();
    return done();
  }
  if (k === 'Tab' && state.view === 'tracker') {
    const n = Math.max(1, state.tracks);
    state.cursor.track = (state.cursor.track + (e.shiftKey ? n - 1 : 1)) % n;
    return done();
  }
  if (state.view === 'piano') {
    if (k.startsWith('Arrow') || k === 'PageUp' || k === 'PageDown' || k === 'Home') {
      state.followPlayhead = false;
    }
    const page = pianoBuf ? pianoBuf.view.ticksPerPixel * pianoBuf.view.width : 3840000;
    if (k === 'ArrowRight') { state.pianoStart += page / 8; return done(); }
    if (k === 'ArrowLeft') { state.pianoStart = Math.max(0, state.pianoStart - page / 8); return done(); }
    if (k === 'PageDown') { state.pianoStart += page; return done(); }
    if (k === 'PageUp') { state.pianoStart = Math.max(0, state.pianoStart - page); return done(); }
    if (k === 'Home') { state.pianoStart = 0; return done(); }
    if (k === 'ArrowUp') { state.pianoLow = Math.min(115, state.pianoLow + 12); return done(); }
    if (k === 'ArrowDown') { state.pianoLow = Math.max(0, state.pianoLow - 12); return done(); }
    if (k === '-' || k === '_') { state.pianoZoom = Math.min(PIANO_ZOOM.length - 1, state.pianoZoom + 1); return done(); }
    if (k === '+' || k === '=') { state.pianoZoom = Math.max(0, state.pianoZoom - 1); return done(); }
    if (k === 'a') { state.pianoAll = !state.pianoAll; fitPiano(); return done(); }
    if (k === 'f') { fitPiano(); return done(); }
    if (k === '[') { state.cursor.track = Math.max(0, state.cursor.track - 1); return done(); }
    if (k === ']') { state.cursor.track = Math.min(state.tracks - 1, state.cursor.track + 1); return done(); }
    if (k === ' ') { cmd('play'); return done(); }
    if (k === 'Escape') { state.selectedNote = -1; state.pianoSelection = null;
                          state.reject = null; return done(); }
    if (alt === 'KeyQ' || alt === 'KeyA') { pianoEdit('transpose', alt === 'KeyQ' ? 1 : -1); return done(); }
    if (alt === 'KeyW' || alt === 'KeyS') { pianoEdit('transpose', alt === 'KeyW' ? 12 : -12); return done(); }
    if (k === 's' && !e.altKey) {
      conn && conn.send({ type: 'seek', track: state.cursor.track,
                          tick: Math.max(0, Math.round(state.pianoStart)) });
      return done();
    }
    if ((k === 'Backspace' || k === 'Delete') && state.pianoSelection && state.pianoSelection.size) {
      pianoEdit('delete');
      return done();
    }
    if (k === 'Backspace' || k === 'Delete') {
      if (state.selectedNote < 0) { state.reject = 'select a note first'; return done(); }
      // Delete is by tick on a track, so find the selected note's tick.
      let tick = -1;
      if (engine) for (let i = 0; i < engine.noteCount; i++) {
        if (engine.notes[i].id === state.selectedNote) { tick = engine.notes[i].tOn; break; }
      }
      if (tick < 0) { state.reject = 'note is gone'; return done(); }
      conn && conn.send({ type: 'delete', track: state.cursor.track, tick });
      state.selectedNote = -1;
      return done();
    }
    return;
  }
  if (state.view === 'patcher') {
    if (k === ' ') { cmd('play'); return done(); }
    if (k === 'Escape') { state.selectedNode = -1; state.patchLinkFrom = null;
                          state.reject = null; return done(); }
    // a adds a node of the armed type, t cycles which type that is, c connects
    // (arm on the source, fire on the destination), Backspace removes.
    if (k === 'a') { addPatcherNode(); return done(); }
    if (k === 't') {
      state.patchAddType = (state.patchAddType + 1) % NODE_TYPES.length;
      return done();
    }
    if (k === 'c') { linkPatcherNode(); return done(); }
    // Left/right pick a config field on the selected node, up/down change it.
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const node = selectedPatcherNode();
      const n = node ? configFields(node.type).length : 0;
      if (n) state.selectedField = (state.selectedField + (k === 'ArrowRight' ? 1 : n - 1)) % n;
      return done();
    }
    if (k === 'ArrowUp') { nudgePatcher(1); return done(); }
    if (k === 'ArrowDown') { nudgePatcher(-1); return done(); }
    if (k === 'Backspace' || k === 'Delete') { removePatcherNode(); return done(); }
    return;
  }
  if (state.view === 'mixer') {
    if (k === ' ') { cmd('play'); return done(); }
    if (k === 'Escape') {
      state.reject = null;
      return done();
    }
    if (k === 'r') { mixer.beginRename(state.cursor.track); return done(); }
    return;
  }
  if (state.view === 'arrange') {
    /**
     * Escape closes the roll, and only then clears the selection.
     *
     * Ordered, because Escape is already several dismissals deep everywhere else
     * in this handler and the one people mean first is "put that panel away". A
     * single Escape that did both would leave nothing to press to keep a clip
     * selected while closing the editor.
     */
    if (k === 'Escape') {
      // The second pane is closed by the general rule above, which fires before
      // this branch is reached — so by here Escape means the selection.
      if (state.selectedPlacement) { state.selectedPlacement = null; return done(); }
      state.reject = null;
      return done();
    }
    // Enter opens the selected clip in the roll — the keyboard's version of the
    // double-click, so the gesture is not mouse-only.
    if (k === 'Enter' && state.selectedPlacement) {
      state.view2 = 'piano';
      // "track:tick" — the same encoding the model reads.
      const colon = String(state.selectedPlacement).indexOf(':');
      const tick = colon > 0 ? +String(state.selectedPlacement).slice(colon + 1) : 0;
      state.pianoStart = Math.max(0, Number.isFinite(tick) ? tick : 0);
      state.pianoFitPending = true;
      return done();
    }
    /**
     * Backspace removes the selected clip.
     *
     * Only WITH a selection, which is the rule the rack learned the hard way:
     * a pane that answers to a destructive key whether or not anything is
     * selected there is a pane that eats keystrokes meant for the tracker.
     *
     * No confirm, unlike a device. This one is undoable — placement ops go
     * through the store, which the undo swap already covers — and a confirm on
     * an undoable action trains people to dismiss confirms.
     */
    if ((k === 'Backspace' || k === 'Delete') && state.selectedPlacement) {
      const p = selectedPlacement();
      if (p) { sendPlacement({ type: 'placement', op: 'remove', track: p.track, id: p.id });
               state.selectedPlacement = null; }
      return done();
    }
    if (k.startsWith('Arrow') || k === 'PageUp' || k === 'PageDown' || k === 'Home') {
      state.followPlayhead = false;
    }
    const page = arrangeBuf ? arrangeBuf.view.ticksPerPixel * arrangeBuf.view.width : 3840000;
    if (k === 'ArrowRight') { state.arrangeStart += page / 8; return done(); }
    if (k === 'ArrowLeft') { state.arrangeStart = Math.max(0, state.arrangeStart - page / 8); return done(); }
    if (k === 'PageDown') { state.arrangeStart += page; return done(); }
    if (k === 'PageUp') { state.arrangeStart = Math.max(0, state.arrangeStart - page); return done(); }
    if (k === 'Home') { state.arrangeStart = 0; return done(); }
    if (k === 'ArrowDown') { state.cursor.track = Math.min(state.tracks - 1, state.cursor.track + 1); return done(); }
    if (k === 'ArrowUp') { state.cursor.track = Math.max(0, state.cursor.track - 1); return done(); }
    if (k === '-' || k === '_') { state.arrangeZoom = Math.min(ARRANGE_ZOOM.length - 1, state.arrangeZoom + 1); return done(); }
    if (k === '+' || k === '=') { state.arrangeZoom = Math.max(0, state.arrangeZoom - 1); return done(); }
    if (k === ' ') { cmd('play'); return done(); }
    if (k === 'Escape') { state.selectedPlacement = null; state.reject = null; return done(); }
    /*
     * Backspace WITH a selection is handled above and deletes the clip. This is the
     * other half: nothing selected, so say what is missing.
     *
     * It used to say "clip edits need engine commands (asked backend)" — true when it
     * was written and false for months after the placement opcodes landed, so the one
     * message a user got for pressing delete named a limitation that no longer existed
     * and told them to wait for something already built.
     */
    if (k === 'Backspace' || k === 'Delete') {
      state.reject = 'select a clip first — click one in the arrangement';
      return done();
    }
    return;
  }

  /**
   * 2.9 Shift+arrows extend the selection.
   *
   * ABOVE plain navigation, which is the entire fix: this test used to sit two
   * hundred lines further down, and `if (k === 'ArrowDown')` below matched
   * Shift+ArrowDown just as happily as ArrowDown, moved the cursor and returned.
   * The selection branch was unreachable — dead code that read as a feature.
   * Selecting a range with the keyboard, and therefore copy, cut and transpose
   * over a range, has never worked.
   */
  if (e.shiftKey && (k === 'ArrowDown' || k === 'ArrowUp')) {
    const to = state.cursor.row + (k === 'ArrowDown' ? 1 : -1);
    extendSelection(Math.max(0, to));
    state.cursor.row = Math.max(0, to);
    follow(); return done();
  }

  // 3. Navigation.
  if (k === 'ArrowDown') { moveCursor(() => state.cursor.row++); follow(); return done(); }
  if (k === 'ArrowUp') { moveCursor(() => { state.cursor.row = Math.max(0, state.cursor.row - 1); }); follow(); return done(); }
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    const d = k === 'ArrowRight' ? 1 : -1;
    /*
     * INSIDE THE OPS CELL FIRST. A cell drawing one glyph per op is a row of things to point at,
     * and Left/Right walks them before leaving — the same shape Renoise's effect columns have,
     * and the reason the collapsed cell is editable at all when it holds more ops than the edit
     * buffer can spell.
     *
     * Costs one keypress per op when crossing a track that has them, which is the price of the
     * ops being addressable; a cell with no ops steps straight through as before.
     */
    const ops = fieldOfCol(state.cursor.col) === 2 ? opsPresent(noteAtCursor()).length : 0;
    if (ops) {
      const next = state.cursor.op + d;
      if (next >= 0 && next < ops) { state.cursor.op = next; draw(); return done(); }
      // Entering from the side the arrow came from lands on the near end, not past it.
      if (state.cursor.op < 0 && d > 0) { state.cursor.op = 0; draw(); return done(); }
      if (state.cursor.op < 0 && d < 0) { state.cursor.op = ops - 1; draw(); return done(); }
    }
    moveCursor(() => {
      let f = state.cursor.track * state.columns + state.cursor.col + d;
      f = Math.max(0, Math.min(f, state.tracks * state.columns - 1));
      /*
       * STEP OVER AN OPS COLUMN THAT IS NOT DRAWN.
       *
       * A track no note of which carries an op does not draw the column, and a cursor parked in
       * a `display: none` cell is the exact defect the fold logic already names: the cell is
       * still addressable, every edit still lands correctly, and none of it is visible.
       *
       * A while loop, not an if: the columns are hidden per TRACK, so stepping right off the
       * end of one track can land on the ops column of the next, and the skip has to keep
       * going. Bounded by the field count, so no arrangement of hidden columns can spin.
       */
      const shown = dockApi.opsShown();
      for (let guard = 0; guard < state.columns * 2; guard++) {
        const tr = Math.floor(f / state.columns), c = f % state.columns;
        if (fieldOfCol(c) !== 2 || shown[tr]) break;
        const next = f + d;
        if (next < 0 || next > state.tracks * state.columns - 1) break;
        f = next;
      }
      state.cursor.track = Math.floor(f / state.columns); state.cursor.col = f % state.columns;
      // A selection belongs to the cell it was made in. Carrying it to the next one would put
      // the caret on an op of a different note, and `@` would edit that.
      state.cursor.op = -1;
    });
    follow(); return done();
  }
  if (k === 'PageDown') { moveCursor(() => { state.start = Math.min(TOTAL_ROWS - tracker.poolSize, state.start + 32); }); return done(); }
  if (k === 'PageUp') { moveCursor(() => { state.start = Math.max(0, state.start - 32); }); return done(); }

  // 4. Global controls. These used to sit AFTER a catch-all typing branch that
  //    consumed every printable key, so none of them were reachable: `-` typed a
  //    dash into a cell instead of zooming, and Backspace edited the buffer
  //    instead of deleting a note.
  // The note column's digit meaning. Grouped with octave and step because it is
  // the same kind of thing: a standing choice about what typing does next.
  if (k === '`') {
    state.entryMode = state.entryMode === 'pitch' ? 'degree' : 'pitch';
    return done();
  }
  if (k === '[') { state.octave = Math.max(0, state.octave - 1); return done(); }
  if (k === ']') { state.octave = Math.min(9, state.octave + 1); return done(); }
  // Edit step: how far the cursor advances after writing a note. 0 stays put,
  // which is how you stack a chord by hand. Essential for entering a rhythm and
  // previously visible in the chrome with no way to change it.
  if (k === ',') { state.editStep = Math.max(0, state.editStep - 1); return done(); }
  if (k === '.') { state.editStep = Math.min(16, state.editStep + 1); return done(); }
  // Default velocity for new notes, in steps of 8 so it is reachable quickly.
  if (k === ';') { state.velocity = Math.max(1, state.velocity - 8); return done(); }
  if (k === "'") { state.velocity = Math.min(127, state.velocity + 8); return done(); }
  if (k === '-' || k === '_') { moveCursor(() => { state.zoom = Math.max(0, state.zoom - 1); }); return done(); }
  if (k === '+' || k === '=') { moveCursor(() => { state.zoom = Math.min(ZOOM_LEVELS.length - 1, state.zoom + 1); }); return done(); }
  if (k === ' ') { cmd('play'); return done(); }
  /**
   * Follow the playhead. Either case.
   *
   * Only capital F was bound, so lowercase `f` fell through to note entry and was
   * refused with "f is not a piano key" — which is true, and useless: `f` is not
   * a piano key in ANY octave (the map is 23567qwertyuizsxdcvgbhnjm), so nothing
   * was ever going to want it there. A key that is bound in one case only reads
   * as a key that does not work, because nobody reaches for Shift to toggle
   * something.
   */
  if (k === 'f' || k === 'F') { state.followPlayhead = !state.followPlayhead; return done(); }
  if (k === 'Escape') { state.reject = null; return done(); }

  // 5. Editing at the cursor.
  if (k === 'Backspace' || k === 'Delete') {
    deleteAtCursor();
    state.cursor.row += state.editStep; follow();
    return done();
  }
  /*
   * `@` OPENS THE CELL'S TEXT BUFFER, in whichever grammar the field speaks.
   *
   * On a note field that is a chord or a degree, seeded with the `@` itself. On the OPS field it
   * is the row-op string, seeded WITH WHAT THE NOTE HAS — `ret3 p60 d1/6` — so editing one op
   * means changing one word rather than retyping the set. That is the gesture Jaakko described:
   * "I can edit the cell to edit an individual op."
   *
   * One key rather than two, because it already means exactly this: open the text buffer for
   * this cell. Specialising it by field costs nothing and adds no keymap to learn.
   *
   * NOT Enter, which auditions the row here and is worth more than the two characters it would
   * save. A gesture that takes an existing binding away has to be worth more than the binding.
   *
   * The string it commits is the canonical one — the same text `parse_row_ops` takes and an
   * agent writes — so what you read in the cell teaches what you can type into it.
   */
  if (k === TOKEN_KEY) {
    if (fieldOfCol(state.cursor.col) === 2) {
      /*
       * THE SELECTED OP, IF ONE IS. Stepping onto a glyph with Left/Right is what makes `@` mean
       * that op instead of the row — and it is the only way to edit a dense row, because the
       * buffer holds 48 characters and forty ops spell to several hundred.
       */
      const present = opsPresent(noteAtCursor());
      const one = state.cursor.op >= 0 ? present[state.cursor.op] : null;
      if (one) {
        beginEntry('ops', state.cursor, opTokenAt(noteAtCursor(), state.cursor.op,
                                                  ticksPerBeat(songMeter())));
        entry.opField = one.prefix;
      } else {
        beginEntry('ops', state.cursor, opsAtCursorText());
        entry.opField = '';
      }
    } else {
      beginEntry('token', state.cursor, '@');
    }
    return done();
  }

  // Open the piano roll at the cursor. A tracker cell can hold one note per
  // column, so simultaneous notes on a track render as `**` — visible, which is
  // the point, but not resolvable HERE. This is the way out of that: same
  // position, a projection that can show them apart.
  if (k === 'p') {
    state.view = 'piano';
    state.pianoStart = Math.max(0, tickOfCursorRow() - ZOOM_LEVELS[state.zoom].rowNanoticks * 8);
    state.pianoAll = false;
    fitPiano();
    return done();
  }

  // Selection operations act on the range that Shift+arrows built — see section
  // 2.9 above, which has to run BEFORE plain navigation or it never runs at all.
  if (alt === 'KeyC') { copySelection(); return done(); }
  if (alt === 'KeyV') { pasteClipboard(); return done(); }
  if (alt === 'KeyX') { if (copySelection()) deleteSelection(); return done(); }
  if (alt === 'KeyQ') { transposeSelection(1); return done(); }
  if (alt === 'KeyA') { transposeSelection(-1); return done(); }
  if (alt === 'KeyW') { transposeSelection(12); return done(); }
  if (alt === 'KeyS') { transposeSelection(-12); return done(); }
  // Any other Alt combo is the browser's or the OS's, not ours.
  if (alt) return;

  if (k.length !== 1) return;
  state.reject = null;

  if (fieldOfCol(state.cursor.col) === 0) {
    if (k.toLowerCase() === NOTE_OFF_KEY) {
      noteOffAtCursor();
      state.cursor.row += state.editStep; follow();
      return done();
    }
    const deg = hexValue(k);
    // Degree mode takes the digits BEFORE the piano lookup, or 2/3/5/6/7 would
    // still write pitches and the mode would silently apply to half the keys.
    if (state.entryMode === 'degree' && deg >= 0) { typeDegree(deg); return done(); }
    const pitch = pitchOf(k.toLowerCase(), state.octave);
    if (pitch >= 0) {
      // Out of edit mode the key is an instrument, not a typewriter: no write, no
      // cursor advance. Auditioning the pitch needs an engine command that does
      // not exist yet (WriteNote is the only note command and it edits), so for
      // now this is silent — which is still the difference between a keyboard
      // that destroys your pattern and one that does not.
      if (!state.editMode) { auditionOn(pitch); return done(); }
      writePitch(pitch);
      state.cursor.row += state.editStep; follow();
      return done();
    }
    // A digit that is not one of the five piano digits used to reach no handler
    // at all — this branch ended in a bare `return`, so 0, 1, 4, 8 and 9 did
    // NOTHING on the note column: no write, no refusal, no message. That is the
    // silent no-op ARCHITECTURE_REVIEW Movement 1 item 12 names. Now it says what
    // the key could have meant and where the other meaning lives.
    if (deg >= 0) {
      state.reject = k + ' is not a piano key — ` switches to degree mode';
      return done();
    }
    return;
  }

  const d = hexValue(k);
  if (d >= 0) { typeValue(d); return done(); }
}, { capture: true });

// Mouse: click moves the cursor, drag selects. Field = track*columns+col, so a
// drag across a track boundary selects the fields between it — what a tracker
// user means by a range.
let dragAnchor = null;
function fieldOf(hit) { return hit.track * state.columns + hit.col; }

arrangeHost.addEventListener('pointerdown', (e) => {
  if (!arrangeBuf) return;
  const hit = arrange.hitTest(e.clientX, e.clientY, arrangeBuf);
  if (!hit) return;
  state.cursor.track = hit.track;
  state.selectedPlacement = hit.placement;
  // Click on empty lane seeks. On a placement it selects, because dragging
  // clips is the more common intent there and a stray seek would be surprising.
  if (hit.placement === null) {
    conn && conn.send({ type: 'seek', track: hit.track, tick: Math.max(0, Math.round(hit.tick)) });
  }
  state.reject = null;
  schedule();
});

host.addEventListener('pointerdown', (e) => {
  const hit = tracker.hitTest(e.clientX, e.clientY, state.scrollX);
  if (!hit) return;
  // Clicking the grid takes the keyboard back from whichever pane had it. The
  // rack keeps focus until something else asks for it, and "something else" has
  // to include the obvious one: clicking on the notes.
  state.focus = 'centre';
  host.setPointerCapture(e.pointerId);
  dragAnchor = hit;
  state.cursor.row = hit.row; state.cursor.track = hit.track; state.cursor.col = hit.col;
  state.selection = null;
  schedule();
});

host.addEventListener('pointermove', (e) => {
  if (!dragAnchor) return;
  const hit = tracker.hitTest(e.clientX, e.clientY, state.scrollX);
  if (!hit) return;
  const a = fieldOf(dragAnchor), b = fieldOf(hit);
  state.selection = {
    r0: Math.min(dragAnchor.row, hit.row), r1: Math.max(dragAnchor.row, hit.row),
    f0: Math.min(a, b), f1: Math.max(a, b),
  };
  state.cursor.row = hit.row; state.cursor.track = hit.track; state.cursor.col = hit.col;
  schedule();
});

host.addEventListener('pointerup', (e) => {
  dragAnchor = null;
  if (host.hasPointerCapture(e.pointerId)) host.releasePointerCapture(e.pointerId);
});

// Wheel over the tracker: vertical scrolls rows, shift-wheel scrolls the track
// strip sideways. Both move the VIEW ONLY — the cursor stays put, like PageUp
// and PageDown, so scrolling to look at something never changes where the next
// keystroke lands.
//
// Pixels accumulate across events instead of each event converting to whole
// rows on its own. A trackpad sends streams of one- and two-pixel deltas, and
// rounding each independently either discards all of them or jumps a full row
// per event, depending which way you round. Keeping the remainder is what makes
// a slow trackpad drag continuous while a mouse notch still moves a predictable
// number of rows. See WHEEL_LINE_PX in arrangemodel for why the unit conversion
// is a named function and not a multiplier inlined here.
let wheelAccY = 0;
host.addEventListener('wheel', (e) => {
  const viewH = boxOf(host, true), viewW = boxOf(host, false);
  // Shift-wheel is how a mouse asks for horizontal; a trackpad sends a real
  // deltaX and needs no modifier. Honour whichever the device produced. With
  // shift held a mouse still reports its notch on deltaY, so read that.
  const sideways = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (sideways) {
    const px = wheelPixels(e.deltaX || e.deltaY, e.deltaMode, viewW);
    if (!px) return;
    e.preventDefault();
    state.scrollX = Math.max(0, Math.min(state.scrollX + px, tracker.maxScrollX(viewW)));
  } else {
    const px = wheelPixels(e.deltaY, e.deltaMode, viewH);
    if (!px) return;
    e.preventDefault();
    wheelAccY += px;
    // Truncate toward zero, so a remainder of either sign keeps its direction.
    const rows = (wheelAccY / metrics.rowHeight) | 0;
    if (!rows) return;                       // sub-row travel: nothing to redraw
    wheelAccY -= rows * metrics.rowHeight;
    const visible = Math.max(1, Math.floor(viewH / metrics.rowHeight));
    state.start = Math.max(0, Math.min(state.start + rows,
                                       Math.max(0, TOTAL_ROWS - visible)));
  }
  // Hand-scrolling and follow-the-playhead both own state.start, and follow runs
  // every frame — it would drag the view back before you saw it. Reaching for the
  // wheel means you want to look somewhere, so it wins and follow turns itself
  // off, the same bargain the arrow keys already make above.
  state.followPlayhead = false;
  schedule();
}, { passive: false });

addEventListener('resize', schedule);

// Save on a timer rather than on every change: view state moves constantly while
// scrolling and localStorage writes are synchronous.
setInterval(saveSession, 2000);
addEventListener('beforeunload', saveSession);

draw();

/**
 * Whether to open a socket at all.
 *
 * `?engine=off` boots the page standalone. The fixture-based tests — goldens,
 * allocation, frame work, the soak — use it, because a test that measures the
 * page must not also hold a live socket open: the soak ran four minutes attached
 * to a running engine, which makes it a measurement of two things and puts an
 * extra client on a stack somebody else may be using. The e2e is the exception
 * and connects, because a live engine is the thing it is testing.
 */
const WANTS_ENGINE = new URLSearchParams(location.search).get('engine') !== 'off';

// The first paint must know what fits; the resize listener only fires on change.
measureRoom();
// Watch the four hosts whose box the draw path needs. Registered here rather
// than beside each host's declaration so there is one list to keep in step with
// boxOf()'s callers, and so it runs once every host exists.
hostRo.observe(host);
hostRo.observe(arrangeHost);
hostRo.observe(pianoHost);
hostRo.observe(mixerHost);

// Live engine, when the sidecar is up. Falls back to the fixture so the page —
// and every golden — still renders standalone. Connected after the first draw:
// connectEngine calls onStatus synchronously, and touching `state` before its
// declaration is a temporal-dead-zone throw that kills the whole module.
/**
 * Which sidecar to talk to: the one belonging to the page you loaded.
 *
 * These were hardcoded to 8174/8175, which meant a second stack could not be
 * used at all — `tools/webstack.sh` happily brings one up on its own shared
 * memory segment and its own ports, and then its page connects to the FIRST
 * stack's engine. You get a window that looks right, reports "live", and is
 * driving somebody else's project. The script already derives its sidecar ports
 * as page+1 and page+2; this is the other half of that agreement.
 *
 * Falls back to the default pair when the page is opened from a file:// URL or
 * any other origin with no port, which is where the constants came from.
 */
const PAGE_PORT = Number(location.port) || 8173;
const WS_STATE_URL = `ws://127.0.0.1:${PAGE_PORT + 1}`;
const WS_CMD_URL = `ws://127.0.0.1:${PAGE_PORT + 2}`;
conn = WANTS_ENGINE ? connectEngine({
  url: WS_STATE_URL,
  cmdUrl: WS_CMD_URL,
  onStatus: (s, d) => { state.link = s + (d ? ': ' + d : ''); schedule(); },
  /**
   * The engine's own refusals, drained from its outbound ring by the sidecar.
   *
   * These are the ones nothing else could tell us: a connection the sidecar's
   * port table thought was fine and the engine's graph did not, a chain error, a
   * resync. Until this, an edit the ENGINE rejected looked identical to one it
   * accepted — the command was sent, the ack said ok, and the read-back simply
   * did not change.
   */
  /**
   * The engine's scale registry (SHM v16). Static, so this arrives once.
   *
   * Until it did, the tuning half of the harmony card said the wire carried no
   * cents — true when it was written and false twenty minutes later. A panel
   * that states what is missing has to stop saying it the moment it arrives, or
   * it becomes the most confidently wrong thing on the screen.
   */
  onScales: (list) => { scales = list; schedule(); },
  /**
   * A device's real name and parameters (SHM v17).
   *
   * Kept per device id, because the region holds only the newest answer and the
   * rack shows several cards at once — dropping the previous one would make the
   * strip flicker between "named" and "unnamed" as you clicked along it.
   */
  // Filed under (track, device), never the device alone — see paramKey. Device
  // ids are per-track, so `deviceParams[0]` was one slot shared by every track's
  // first device and the last answer to land won it.
  onDeviceParams: (dp) => { deviceParams[paramKey(dp.track, dp.device)] = dp; schedule(); },
  /**
   * The audio source table, and which clip reads which source.
   *
   * Arrives on a project load and not again, so it is plain state rather than
   * anything version-guarded on this side. Keyed by id for the renderer, which
   * asks "what does clip 7 read" once per visible audio clip per frame.
   */
  onAudioSources: (a) => {
    audioSources = Object.create(null);
    audioClips = Object.create(null);
    for (const s of a.sources || []) audioSources[s.id] = s;
    for (const c of a.clips || []) audioClips[c.clipId] = c;
    audioBpmMilli = a.bpmMilli || 120000;
    // A reload replaces the files, so every window cached against the old ones
    // describes audio that is no longer there. Device ids taught this lesson
    // already (GUIDELINES 2.1): a cache whose key survives a load but whose
    // subject does not is a cache that lies.
    waveCache.clear();
    waveRevision++;
    schedule();
  },
  /**
   * One windowed waveform answer.
   *
   * `w.pairs` is a VIEW over the socket's buffer, so it has to be copied to be
   * kept — the next answer reuses the record and the buffer is gone. The copy is
   * the only one in this path and it is what makes the cache a cache.
   */
  onWaveform: (w) => {
    /**
     * The answer is filed under what it DESCRIBES, not under what was asked.
     *
     * The request id is allocated by the SIDECAR — deliberately, so that two tabs
     * cannot mint colliding ids into a four-slot region — which means this side
     * never learns it and cannot correlate on it. It does not need to: the answer
     * carries its own source, decimation and first frame, and that tuple is
     * exactly the cache key. An answer that describes itself cannot be filed
     * under the wrong question, which a correlation id can.
     */
    // Through the SAME builder the request uses. Two spellings of one key is how an answer ends
    // up filed under a question nobody asked.
    const key = waveKey(w.sourceId, w.samplerAddr, w.decimation, w.firstFrame);
    waveAsked.delete(key);
    if (w.status === 3 || !w.pairs) { schedule(); return; }
    // Only a window that LANDED is news. A refusal deliberately does not bump it:
    // the renderer would repaint, ask the same question, be refused again, and
    // spin at answer rate. Left alone, the window stays missing and the renderer's
    // own retry clock asks again a few times a second, which is bounded.
    waveRevision++;
    waveCache.set(key, {
      // `samplerAddr` is stored as well as keyed on. The key proves the two entries are
      // separate; a reader that wants to know WHICH sampler an entry is for — the probe, and
      // anything that ever draws two at once — needs the number, not the string it is in.
      sourceId: w.sourceId, samplerAddr: w.samplerAddr | 0,
      decimation: w.decimation, columns: w.columns,
      channels: w.channels, firstFrame: w.firstFrame, status: w.status,
      keyLo: w.keyLo, keyHi: w.keyHi, pairs: Int16Array.from(w.pairs),
    });
    // Bounded: a pan across a long file would otherwise accumulate a window per
    // step for the life of the session. Oldest-out, which for a pan is also
    // least-recently-looked-at.
    if (waveCache.size > WAVE_CACHE_MAX) {
      const oldest = waveCache.keys().next().value;
      waveCache.delete(oldest);
    }
    schedule();
  },
  onChains: (list, rev) => {
    if (rev === chainRev) return;
    chainRev = rev;
    // Replace per track rather than merge: the sidecar already resolved which
    // chainVersion won, and merging here would reintroduce the question it
    // answered.
    for (const c of list) chains[c.track] = c;
    // Bumped so anything derived from the chain set can be cached against it.
    // See `allPatcherRoots`, which walks every track and must not do so per
    // frame — a `for...in` allocates its key list, which is the one thing the
    // draw path may not do (GUIDELINES 3).
    chainRevision++;
    // An insert is answered by the rack republishing, so this is where the answer
    // can be checked against what was asked for.
    checkPendingInsert();
    // ...and NAME any modulation link the engine has just assigned an id to. Here because
    // this is where the engine's answer arrives, and the uid16 cannot be sent before it —
    // SetModLinkUid16 matches an id exactly and there is no "the one you just made".
    namePendingMaps();
    schedule();
  },
  onEngineEvent: (list, missed) => {
    for (const e of list) {
      const text = describeEngineEvent(e);
      // A resync is NOT a refusal. It means the engine swapped a whole track

         * feature would render nothing and every golden would agree with it

         * which is the fixture's error becoming visible rather than a regression.

         * was played. `delayTicks` is a ROW OP applied on top of that, and the two
         * are composed, not alternatives — which is why counting one twice was wrong
         * in the first place.

         *

         * only the hidden case — and a golden that shows one state of a two-state feature is

        const ret = t === 1 ? 2 : 0;

  useArrangeFixture: () => {
    // A fixture is a WHOLE WORLD, so it starts from no chains. Without this the
    // patcher fixture's device chain leaked into every scene captured after it
    // and moved twelve goldens at once — the rack drew a card where the scene
    // had none.
