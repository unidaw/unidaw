  conn.send({ type: 'reqchain', track });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Move a device to a position in its chain.
 *
 * ORDER IS WHAT A CHAIN IS. The same compressor before and after a distortion are two
 * different sounds, and until now the rack could add a device and remove one and not
 * change where it sat — so the only way to reorder was to delete and re-add, which
 * loses the device's settings.
 *
 * `pos` is the device's FINAL index. The engine erases it and re-inserts, so the index
 * is into the list without it — which happens to make it the resting position, but only
 * because the two cancel. Read as an index into the ORIGINAL list it is off by one for
 * every rightward move.
 *
 * No `reqchain` afterwards: the engine emits a chain snapshot on every accepted move.
 */
function moveDevice(track, device, pos) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'movedevice', track, device, pos });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Switch a device off without removing it.
 *
 * No `reqchain` afterwards, unlike delDevice: the engine emits a chain snapshot
 * on every accepted UpdateDevice, so the state comes back by itself. Asking as
 * well would be a second question with the same answer.
 *
 * The STATE is sent, never "the other one" — see the sidecar's builder. It also
 * means a press that agrees with what the engine already has is refused (chain
 * error 4), which only happens from a stale card and is better than a toggle
 * that silently inverts the wrong way.
 */
function bypassDevice(track, device, on) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'bypass', track, device, on: on ? 1 : 0 });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Pull a lane toward a grid, without moving a note.
 *
 * The engine applies this to a separate SCHEDULING copy of the flat clip: the
 * authored tick is what is stored, saved and drawn here, and quantize changes only
 * where the note sounds. So this sends no base version — quantize cannot conflict
 * with an edit, and gating it on the clip version would let an unrelated keystroke
 * refuse a setting.
 *
 * Thousandths, both of them, because that is what the engine takes. The console
 * converts from percent at its own boundary; nothing between here and the wire
 * changes units again.
 */
function setQuantize(track, gridNanoticks, strengthMilli, swingMilli) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return false; }
  conn.send({ type: 'quantize', track, grid: gridNanoticks,
              strength: strengthMilli, swing: swingMilli });
  state.reject = null;
  schedule();
  return true;
}

/**
 * WHICH TRACK THE RACK IS ABOUT.
 *
 * The cursor's track normally — but `state.chainTrack` PINS it, which is how the
 * master's chain is reachable at all: the master has no lane, so no cursor position
 * means it.
 *
 * ONE DEFINITION, because it was two. The draw path computed this and the rack's own
 * key handler read `state.cursor.track` directly, so with the rack pinned to the
 * master every keystroke acted on a different track from the one on screen. The
 * worst was Backspace: it asked "Remove Zebralette?" — naming the card you were
 * looking at, from the master's chain — and then deleted a device from whatever
 * track the cursor happened to be on, unrecoverably.
 *
 * A confirmation that names one thing and destroys another is worse than none,
 * because it turns a mistake into a mistake you approved.
 */
function rackTrack() {
  return state.chainTrack === null ? state.cursor.track : state.chainTrack;
}

/** Add a node of the armed type. */
function addPatcherNode() {
  return sendGraph({ type: 'patchadd', nodeType: state.patchAddType, track: 0 });
}

/**
 * The engine's ceiling on tracks — kUiMaxTracks. Not a style choice: it is how
 * many the shared-memory region can publish, so a 65th track would exist in the
 * document and be invisible to every reader.
 */
const MAX_TRACKS = 64;

/**
 * Append a track (kShmVersion 22, AddTrack=46). v1 appends at the extent — there
 * is no insert-after until the engine grows a display-order field — so the new
 * lane always arrives at the end, which is at least somewhere you can predict.
 *
 * The cap is checked HERE as well as in the engine. The engine refuses loudly and
 * publishes nothing, which is correct but arrives as silence: the button would
 * look broken. Saying why locally costs one comparison.
 */
function addTrack() {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; return false; }
  const live = engine ? engine.trackCount : 0;
  if (live >= MAX_TRACKS) {
    state.reject = `${MAX_TRACKS} tracks is the limit`;
    schedule();
    return false;
  }
  conn.send({ type: 'addtrack' });
  state.reject = null;
  schedule();
  return true;
}

/**
 * Remove a track by its STABLE id (RemoveTrack=47).
 *
 * Confirmed, because v1 is not undoable: track structure is outside the
 * store-swap undo model, which swaps clips and placements. Backend has logged
 * making it undoable as follow-up work, and this confirm comes out when that
 * lands — a confirm is what you do when you cannot offer undo, not a substitute
 * for it.
 *
 * Refuses a child track locally as well as engine-side. An aux stem is a view
 * into its parent's bus rather than a track in its own right, so the honest
 * answer names the parent instead of failing silently on a rejected command.
 */
function removeTrack(track) {
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; return false; }
  const t = track === undefined ? state.cursor.track : track;
  if (!engine || t < 0 || t >= engine.trackCount) {
    state.reject = 'no such track'; schedule(); return false;
  }
  const flags = engine.trackFlags ? engine.trackFlags[t] : 0;
  if ((flags & 2) !== 0) {
    state.reject = 'that is an aux stem — remove its instrument instead';
    schedule();
    return false;
  }
  // The last track is not removable. An empty track list has no cursor to put
  // anywhere and nothing to draw, and "delete everything" is what New Song is.
  let live = 0;
  for (let i = 0; i < engine.trackCount; i++) if ((engine.trackFlags[i] & 4) === 0) live++;
  if (live <= 1) { state.reject = 'the last track cannot be removed'; schedule(); return false; }

  const name = trackName(engine, t) || `track ${t + 1}`;
  if (!confirm(`Remove ${name}? This cannot be undone.`)) return false;
  conn.send({ type: 'removetrack', track: t });
  // Step the cursor off the track that is about to become a tombstone. The slot
  // stays in the array by design, so nothing moves it for us, and a cursor left
  // sitting on a removed lane would take keystrokes into a track that is gone.
  if (state.cursor.track === t) {
    let n = -1;
    for (let i = 0; i < engine.trackCount; i++) {
      if (i !== t && (engine.trackFlags[i] & 4) === 0) { n = i; if (i > t) break; }
    }
    if (n >= 0) state.cursor.track = n;
  }
  state.reject = null;
  schedule();
  return true;
}

/** Remove the selected node. Its edges go with it, on the engine's side. */
function removePatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (!sendGraph({ type: 'patchdel', node: node.id, track: 0 })) return false;
  state.selectedNode = -1;
  state.patchLinkFrom = null;
  return true;
}

/**
 * Connect in two steps: arm on the source, fire on the destination. Ports are
 * resolved by the sidecar from the two node types, so nobody types a port id.
 */
function linkPatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (state.patchLinkFrom === null) {
    state.patchLinkFrom = { id: node.id, type: node.type };
    state.reject = null;
    return true;
  }
  const from = state.patchLinkFrom;
  state.patchLinkFrom = null;
  if (from.id === node.id) { state.reject = 'a node cannot connect to itself'; return false; }
  return sendGraph({ type: 'patchlink', src: from.id, srcType: from.type,
                     dst: node.id, dstType: node.type, track: 0 });
}

/** Drop the pending entries the engine has confirmed. Once per engine frame. */
function reconcilePatcher() {
  if (!patchPending.size || !engine) return;
  for (const id of patchPending.keys()) {
    const n = engine.patcherNodes.find((x) => x.id === id);
    // A node that left the graph takes its pending edit with it. Without this the
    // map is keyed on something the engine can stop publishing, which is a slow
    // leak and a stale value waiting for an id to be reused.
    if (!n) { patchPending.delete(id); continue; }
    const sent = patchPending.get(id);
    let same = true;
    for (let i = 0; i < 8; i++) if (n.config[i] !== sent[i]) { same = false; break; }
    if (same) patchPending.delete(id);
  }
}

/**
 * Nudge one field of the selected node. Returns the config sent, or null.
 *
 * All eight values go back, the edited one aside exactly as they were read; the
 * sidecar packs them into the type's byte layout. Packing here would put a
 * second copy of a layout that is not a struct next to the one that is — and the
 * engine rebuilds the whole config from what it receives, so a value this UI
 * dropped is a value the engine zeroes.
 */
function nudgePatcher(dir) {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return null; }
  const next = nudgeConfig(node.type, configOf(node), state.selectedField, dir);
  if (!next) { state.reject = 'that node has no editable configuration'; return null; }
  const msg = { type: 'patchcfg', node: node.id, nodeType: node.type, track: 0 };
  for (let i = 0; i < 8; i++) msg['c' + i] = next[i];
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return null; }
  patchPending.set(node.id, next);
  state.reject = null;
  return next;
}

// The two refusals a plugin row can produce, interned. The first is the state
// of the world and not the user's fault; the second is the scanner's own reason
// repeated back, because a row that says "failed" and will not say how is a row
// you have to go and investigate elsewhere.
// Declared ABOVE the handler that reads them: `const` does not hoist, and four
// temporal-dead-zone bugs in this file is four more than enough (GUIDELINES 2.2).
const PLUGIN_SCAN_REFUSAL = 'that plugin did not scan: ';
const PLUGIN_NO_SLOT = 'that plugin has no place in the engine\'s scan, so it cannot be named';

/**
 * The device kinds the engine counts as instruments — device_chain.h's
 * DeviceKind, mirrored because the rule below depends on it.
 *
 * A chain may hold exactly one (device_chain.cpp isInstrumentKind/hasInstrument),
 * which is a real musical rule and not a limitation: a track is one voice.
 */
const KIND_PATCHER_INSTRUMENT = 1;
const KIND_VST_INSTRUMENT = 3;
function chainHasInstrument(track) {
  const here = chains[track];
  const devices = here && here.devices;
  if (!devices) return false;
  for (let i = 0; i < devices.length; i++) {
    const k = devices[i].kind;
    if (k === KIND_PATCHER_INSTRUMENT || k === KIND_VST_INSTRUMENT) return true;
  }
  return false;
}

/**
 * The plugin an AddDevice was just sent for, so the answer can be checked.
 *
 * The insert selects a plugin by its INDEX in the engine's scan, and the
 * catalogue this side lists is a snapshot of the file the engine scanned. If
 * anything rescans in between, that index means a different plugin — the same
 * shape as the vstRef bug one level up, and it cannot be prevented from here
 * because the command carries no room for an identity.
 *
 * So it is detected instead. The rack republishes on change; when it does, the
 * device that arrived is compared against the plugin that was asked for, and a
 * mismatch is reported rather than drawn. A wrong plugin that announces itself is
 * recoverable; one that looks right is not.
 */
let pendingInsert = null;

const browserHost = document.getElementById('browser');
const browser = new Browser(browserHost, {
  onSave: (name) => {
    if (!conn || !conn.saveProject(name)) { state.reject = 'no engine'; schedule(); return; }
    state.currentProject = name;
    // The engine writes the file after it processes the command, and there is no
    // ack for "the file exists now" — an immediate re-list returns the old set and
    // the project you just saved is missing from its own browser. Re-list once the
    // write has plausibly landed; the rail also re-lists whenever it opens.
    setTimeout(() => { if (conn) { conn.send({ type: 'list' }); schedule(); } }, 700);
    state.reject = null;
    schedule();
  },
  /**
   * Opening a row. Two kinds of row now, and only one of them can be honoured.
   *
   * A project loads. A PLUGIN CANNOT BE INSERTED YET, and says so rather than
   * doing nothing (GUIDELINES 4.5: anything unimplemented refuses out loud).
   * The engine's `AddDevice` sets `hostSlotIndex` — an index into a directory
   * scan — and never populates `vstRef`, which device_chain.h calls in its own
   * words "the durable identity of a hosted plugin ... what a saved project
   * must carry instead". Inserting one today would write projects that name a
   * plugin by a number meaning a different plugin the moment anything is
   * installed or removed, which is precisely the thing that header exists to
   * forbid. The engine change is requested.
   *
   * THE SEAM, for whoever wires it when it lands: everything needed is already
   * on `row.plugin` — the catalogue entry, carrying `vendor`, `name`, `path`
   * and `uid`. It becomes
   *
   *     conn.send({ type: 'adddevice', track: state.cursor.track,
   *                 vendor: p.vendor, name: p.name, path: p.path, uid: p.uid })
   *
   * with the sidecar filling a VstRef from those four and the engine resolving
   * the slot itself. Nothing else about this rail has to move: the row already
   * knows which plugin it is, and it already knows the scan failed for the ones
   * that cannot be inserted at all.
   */
  onOpen: (row) => {
    if (!row) return;
    if (row.kind === KIND_PLUGIN) { insertPlugin(row); return; }
    const name = row.name;
    forgetPatcherGraph();
    forgetChains();
    if (!conn || !conn.loadProject(name)) { state.reject = 'no engine'; schedule(); return; }
    state.currentProject = name;
    state.browserOpen = false;
    state.reject = null;
    schedule();
  },
});

/**
 * Put a plugin from the rail into the cursor's track.
 *
 * The engine identifies a VST in AddDevice by `hostSlotIndex` — an index into its
 * plugin scan — and until recently stored only that, so a project saved after an
 * insert named its plugin by a number that meant something else the moment
 * anything was installed. The engine now fills `vstRef` (vendor, name, path,
 * uid16) from the entry that index resolved to, which is what makes this safe to
 * wire at all: the index is used once, at insert, and the durable identity is what
 * gets written down.
 *
 * An instrument and an effect are different device kinds and the catalogue already
 * says which this is, so nobody is asked to choose twice.
 */
function insertPlugin(row) {
  if (!row.ok) { state.reject = PLUGIN_SCAN_REFUSAL + row.meta; schedule(); return; }
  if (!(row.pluginIndex >= 0)) { state.reject = PLUGIN_NO_SLOT; schedule(); return; }
  if (!conn || !conn.canSend()) { state.reject = 'no engine'; schedule(); return; }
  const track = state.cursor.track;
  // Checked HERE rather than left to the engine. A chain holds one instrument,
  // and the engine enforces it by returning a chain error whose code the UI can
  // only render as "chain error on track 0 (code 1)" — true, and useless. The
  // rule is knowable from the chain we already hold, so it is worth saying
  // properly: the same refusal, in words a person can act on.
  if (row.instrument && chainHasInstrument(track)) {
    state.reject = 'track ' + (track + 1) + ' already has an instrument — '
                 + 'remove it first, or add this on another track';
    schedule();
    return;
  }
  const ok = conn.send({ type: 'adddevice', track,
                         kind: row.instrument ? 'vst instrument' : 'vst effect',
                         slot: row.pluginIndex });
  if (!ok) { state.reject = 'no engine'; schedule(); return; }
  // What was asked for, so the chain that comes back can be checked against it.
  pendingInsert = { track, name: row.name, at: performance.now() };
  // The rack caches parameters by device id and the engine may reuse one, so the
  // cache has to go — same reason the "+" card clears it.
  paramsAsked.clear();
  state.reject = null;
  // The rail has done its job; the thing you just added is in the rack, which is
  // on screen. Leaving the rail open over it hides the result of the action.
  state.browserOpen = false;
  schedule();
}

/**
 * Check an insert against what came back, once.
 *
 * Called when the rack republishes. The engine names a device from the plugin it
 * actually loaded, so a name that does not contain what was asked for means the
 * index resolved somewhere else — a rescan between the catalogue being read and
 * the command being sent. Compared loosely (case-insensitive containment) because
 * a host may decorate the name, and the question here is "is this a different
 * plugin", not "is this string equal".
 */
function checkPendingInsert() {
  if (!pendingInsert) return;
  const here = chains[pendingInsert.track];
  const devices = here && here.devices;
  if (!devices || !devices.length) return;
  const got = devices[devices.length - 1];
  const gotName = (got && got.name) || '';
  const want = pendingInsert.name;
  if (gotName) {
    const a = gotName.toLowerCase(), b = want.toLowerCase();
    if (!a.includes(b) && !b.includes(a)) {
      state.reject = 'asked for "' + want + '" and the engine loaded "' + gotName
                   + '" — the plugin scan moved under us; press r to re-read it';
    }
    pendingInsert = null;
    schedule();
  }
}

/**
 * Adopt a `{"type":"plugins"}` reply.
 *
 * Two shapes come back and both are answers: `{"ok":true,"pluginCache":{…}}`,
 * or `{"error":"…"}` when the catalogue is missing or a scan is mid-write. The
 * error is kept, not dropped — "the engine writes it when it scans" is the
 * reason the list is empty and the rail shows it in place of one.
 *
 * A function rather than four lines inside onAck so the fixture can feed the
 * SAME text the socket does, through the same parse (GUIDELINES 3.0.2: measure
 * the path the program is on). Parsing alone inside the try, per GUIDELINES 2.2
 * — a catch written to tolerate malformed JSON must not also swallow a bug in
 * the code that reads the result.
 */
function applyPluginReply(msg) {
  let parsed = null;
  try { parsed = JSON.parse(msg); } catch (e) { /* reported below */ }
  if (!parsed) {
    pluginCache = null; pluginError = 'the plugin catalogue reply was not JSON';
  } else if (parsed.error) {
    pluginCache = null; pluginError = String(parsed.error);
  } else {
    const list = parsed.pluginCache && parsed.pluginCache.plugins;
    if (Array.isArray(list)) { pluginCache = list; pluginError = ''; }
    // A reply that is neither an error nor a list is not an empty catalogue.
    else { pluginCache = null; pluginError = 'the plugin catalogue reply carried no plugin list'; }
  }
  schedule();
}

const helpHost = document.getElementById('help');
const help = createHelp(helpHost);
/**
 * What fits.
 *
 * The centre is the work; the panels are context. Below these widths the rails
 * would leave the tracker too narrow to read, so they yield rather than squeeze
 * it — at 900px the first version gave the tracker 300px and kept 598px of

     * thing it destroys.
     *
     * Hidden until the header is hovered, because sixteen visible ✕ marks along the top of a
     * tracker is an invitation, and this cannot be undone. `removeTrack` names the track in its
     * confirm; nothing here asks a second time.
     */
    /*
     * SHOW THIS TRACK'S OPS COLUMN, on the track's own header.
     *
     * The column is hidden on a track no note of which carries a per-note op, which means the
     * cell you would type the first one into is not on screen. Without a pointer path here the
     * feature would be reachable only by `ops <track> on` \u2014 console-only, which does not count
     * as done.
     *
     * Hidden until hover and drawn as `\u00b7` when off, `ops` when forced on, ABSENT when the
     * engine's own width is what is showing the column: a control that claims to be the reason
     * a thing is visible when it is not is a control that lies the moment you click it off and
     * nothing happens.
     */
    /*
     * QUANTIZE THIS TRACK TO THE HARMONY TIMELINE, on the track's own header.
     *
     * A per-track property of what the NOTES MEAN — a degree resolved against the field rather
     * than a fixed pitch — so it belongs beside the lane it changes rather than in the mixer,
     * whose byte it merely rides.
     *
     * Drawn `~` when on and hidden until hover when off, like the other header controls. It
     * shows its own state, which is the entire reason this could be built: the flag has been
     * published all along and my own note said it was not.

    const hqBtn = document.createElement('span');

    hqBtn.appendChild(document.createTextNode('~'));
    hqBtn.title = 'Quantize this track’s notes to the harmony timeline';
    el.appendChild(hqBtn);
    el._hqBtn = hqBtn; el._hqV = null;

    const opsBtn = document.createElement('span');
    opsBtn.className = 'hops';
    opsBtn.appendChild(document.createTextNode('\u00b7'));
    opsBtn.title = 'Show this track\u2019s per-note op column';
    el.appendChild(opsBtn);
    el._opsBtn = opsBtn; el._opsState = null;

    const del = document.createElement('span');
    del.className = 'hdel';
    del.appendChild(document.createTextNode('\u00d7'));

   * chrome's pair stays, because the arrangement and the mixer have no header row and removing
   * the global path would make adding a track pointer-unreachable in two of five surfaces.

  add.title = 'Add a track';

  // per track per frame; `.children` is a live HTMLCollection and indexing it is
  // a binding call, for a list that cannot change without this function running
  // again. Same reasoning as the tracker rows' `_cells`.
  /*
   * THE QUANTIZE BADGE IS THE CONTROL.
   *
   * Lane quantize was console-only: the badge SHOWED the setting and the deviation bars
   * showed its effect, and the only way to change it was typing a command. Which is the
   * complaint this app keeps producing, inverted — not a control you can see and cannot
   * change, but a setting you can see and can only reach by typing.
   *
   * CLICK CYCLES THE GRID, DRAG SCRUBS STRENGTH. The drag is the half that matters: a
   * setting you can turn while watching the bars shorten is the only version of this
   * control that can be EVALUATED, which is the whole argument for non-destructive
   * quantize in the first place. A number you type and then squint at is a slower
   * destructive quantize.
   *
   * SCRUBBING AT FRAME RATE IS SAFE HERE, and it is not safe for most things: quantize
   * is unversioned and moves no authored note, so a stream of these cannot collide with
   * anyone's edit and cannot be refused by a stale base. That is precisely why this is
   * the one per-lane control that can be dragged live.

   * and a listener per head would be rebound with them.
   */

     * a header, so a press on either is also a press on the header, and the badge's handler
     * starts a strength scrub. Without this order pressing ✕ would also drag the lane's quantize
     * — and then open a confirm on top of it.

     * THE LANE'S GRID READOUT IS THE CONTROL (opcode 92).
     *
     * The header has drawn `4/b` since per-lane grids landed and it was a label. Clicking it

      // command cannot come to mean different things.
      if (Number.isFinite(t)) dockApi.harmonyQuantize(t);
      return;
    }
    const opsBtn = e.target.closest('.hops');
    if (opsBtn) {
      e.preventDefault();
      const t = Number(opsBtn.parentElement.dataset.track);
      // Toggles, through the SAME function the `ops` verb calls — the control and the command
      // are one implementation, which is what stops the two from drifting into different rules
      // about when the column may be hidden.
      if (Number.isFinite(t)) dockApi.opsColumn(t);
      return;
    }
    const killer = e.target.closest('.hdel');
    if (killer) {
      e.preventDefault();
      const t = Number(killer.parentElement.dataset.track);
      // THIS track, from the element — not the cursor's. That is the whole point of the control.
      if (Number.isFinite(t)) removeTrack(t);
      return;
    }
    const badge = e.target.closest('.hquant');
    if (!badge) return;
    const track = Number(badge.parentElement.dataset.track);
    if (!Number.isFinite(track)) return;
    e.preventDefault();
    const q = quantizeOf(track);
    headRow.setPointerCapture(e.pointerId);
    quantDrag = { track, x0: e.clientX, grid: q.grid, strength: q.strength,
                  swing: q.swing, moved: false };
  });
  headRow.addEventListener('pointermove', (e) => {
    if (!quantDrag) return;
    // No button, no drag — the same guard the arrangement needs, for the same reason:
    // a release the element never saw would otherwise leave this armed.
    if (e.buttons === 0) { quantDrag = null; return; }
    const dx = e.clientX - quantDrag.x0;
    if (!quantDrag.moved && Math.abs(dx) < 3) return;   // a click is still a click
    quantDrag.moved = true;
    if (!quantDrag.grid) return;                        // nothing to scrub on an off lane
    // 200px for the full range, so the whole sweep is one comfortable gesture and a
    // pixel is half a percent. Shift is finer, as everywhere else here.
    const scale = e.shiftKey ? 1000 : 200;
    const want = Math.max(0, Math.min(1000,
      Math.round(quantDrag.strength + (dx / scale) * 1000)));
    setQuantize(quantDrag.track, quantDrag.grid, want, quantDrag.swing);
  });

    if (!quantDrag) return;

    if (d.moved) return;

     * A CLICK CYCLES THE GRID, and off is in the cycle rather than being a separate
     * gesture — turning it off is as ordinary as changing it, and hunting for a
     * different control to do that is how a setting becomes one you never turn off.
     * Shift-click goes backwards, so a cycle of eight is not a one-way street.
     */
    const next = nextQuantizeGrid(d.grid, e.shiftKey ? -1 : 1);

  // `headRow.children.length !== state.tracks + 1`, and the harmony column's
  // header — added later, right above — made that count tracks + 2. So the test
  // was true on every frame and the entire header strip was destroyed and
  // rebuilt sixty times a second: ~1.3 KB of garbage per frame and a fresh set
  // of DOM nodes for the browser to lay out, all of it invisible because the
  // result looked identical. Naming the shape explicitly means adding another
  // fixed column cannot silently do this again.
  headRow._tracks = state.tracks;
  headRow._stride = stride;
  headRow._laneSig = tracker._laneSig;
  headRow._hiddenSig = tracker._hiddenSig;
  headRow._opsSig = tracker._opsSig;
  head.append(headRow);
  paintHeadLpb();
}

/** Write each lane's lines-per-beat into its header. Guarded, so a frame where

function paintHeadLpb() {

    const el = heads[t];

    const name = trackName(state.useEngine === false ? null : engine, t);
    if (el._nameVal !== name) { el._nameVal = name; el._nameNode.nodeValue = name; }

     * THE NUMBER IN FORCE AT THE CURSOR ROW, not the track's fallback.
     *
     * A lane's rows resolve clip -> track -> zoom, so on a track whose clip carries
     * its own subdivision the track's number is not what anything on screen is drawn
     * at. This badge printed it anyway — a label naming a value nothing was using,
     * which is the same defect as a write gate that disagrees with the drawn grid.
     *
     * A clip-level answer is marked, because "6/b" from the clip and "6/b" from the
     * track are different facts that a click acts on differently.
     */

    const n = engine ? (g.from === 'zoom' ? 0 : g.lpb) : 0;
    const src = engine ? g.from : 'zoom';

     * `quantizeVersion` is the engine's own counter for exactly that and never
     * moves when a note does, so this costs one integer compare on every frame
     * where nobody has turned the knob.

      // which is nearly all of them — costs no padding and no border.

     *

     * control is not drawn at all: it cannot turn the column off (`opsColumn` refuses, because
     * the glyphs would have nowhere to go), and a control that does nothing when clicked is
     * worse than no control.

     * 'off' — the column is hidden and this is how it comes back.

    // project someone else saved draws correctly the moment it loads.

      el._hqV = hqOn;
      el._hqBtn.classList.toggle('on', hqOn);
    }

    const byEngine = !!(w && t < w.length && w[t] > 0);
    const st = byEngine ? 'engine' : (opsForced[t] ? 'on' : 'off');
    if (el._opsState !== st && el._opsBtn) {
      el._opsState = st;
      el._opsBtn.firstChild.nodeValue = st === 'on' ? 'ops' : '·';
      el._opsBtn.classList.toggle('on', st === 'on');
      el._opsBtn.classList.toggle('hidden', st === 'engine');
    }
  }
}

/**

 * nobody ever turns off. `dir` -1 goes back, so eight steps is not a one-way street.
 *

   * 0xFFFF0000, has no lane to draw on. If the wire ever carries per-index ids,

const NANOTICKS_PER_BEAT = 960000;

     * status line at the top of the window — while the cell you were looking at
     * showed whatever was there before, which is indistinguishable from the
     * write having succeeded and done nothing.

      && state.badToken.track === state.cursor.track
