<script type="module">
import { Tracker } from './src/tracker.js';
import { buildViewModel, ZOOM_LEVELS, createBuffer } from './src/viewmodel.js';
import M from './design/out/tokens.js';
import { connectEngine, noEngine } from './src/engine.js';
import { Chain } from './src/chain.js';
import { Harmony } from './src/harmony.js';
import { buildHarmonyModel, createHarmonyBuffer } from './src/harmonymodel.js';
import { Palette } from './src/palette.js';
import { buildChainModel, createChainBuffer } from './src/chainmodel.js';
import { createChrome } from './src/chrome.js';
import { Arrange } from './src/arrange.js';
import { buildArrangeModel, createArrangeBuffer, ARRANGE_ZOOM, trackName,
         TICKS_PER_BAR, snapLoop } from './src/arrangemodel.js';
import { Mixer } from './src/mixer.js';
import { Scope } from './src/scope.js';
import { buildMixerModel, createMixerBuffer, createMixerState, reconcileMixer,
         gainAtPosition, FLAG_MUTE, FLAG_SOLO } from './src/mixermodel.js';
import { Piano } from './src/piano.js';
import { buildPianoModel, createPianoBuffer, PIANO_ZOOM, fitLowPitch,
         notesInRect, noteKey, transposedKey } from './src/pianomodel.js';
import { Browser } from './src/browser.js';
import { Dock } from './src/dock.js';
import { createHelp, GLOBAL_KEYS, SURFACE_KEYS } from './src/help.js';
import { Patcher } from './src/patcher.js';
import { buildPatcherModel, createPatcherBuffer, configFields, nudgeConfig,
         describeConfig, NODE_TYPES } from './src/patchermodel.js';
import { createEntry, feed, cancel, begin, parseToken, parseChord, editing, NOTE_KEYS, NOTE_OFF_KEY,
         TOKEN_KEY, pitchOf, pitchToToken, hexValue, shiftDigit } from './src/entry.js';

const metrics = {
  rowHeight: M.metrics.rowHeight,
  gutterWidth: M.metrics.gutterWidth,
  laneWidth: M.metrics.laneWidth,
  cellWidth: M.metrics.cellWidth,
};

const host = document.getElementById('tracker');
const head = document.getElementById('head');
const chrome = createChrome(document.getElementById('chrome'), {
  onPlay: () => cmd('play'),
  onStop: () => { cmd('stop'); state.reject = null; schedule(); },
});
// No write path yet — the command ring needs a channel the write-only socket
// does not have. The buttons exist and say so rather than pretending.
function cmd(what) {
  // Starting or stopping the transport re-arms following: it is the moment you
  // are asking to watch the music rather than to look around it.
  if (what === 'play' || what === 'stop') state.followPlayhead = true;
  if (!conn || !conn.send({ type: what })) { state.link = 'no engine'; schedule(); }
}
const hud = document.getElementById('hud');
const tracker = new Tracker(host, metrics);
const arrangeHost = document.getElementById('arrange');
const arrange = new Arrange(arrangeHost, metrics, {
  onLoop: (a, b, done, opts) => setLoopFromDrag(a, b, done, opts),
});
const ARRANGE_LANE_H = 44;

/**
 * The loop the UI is showing: a drag in progress, else a set we sent and the
 * engine has not published back, else nothing and the engine's own span wins.
 *
 * Two overrides rather than one because they end differently. A drag ends when
 * the pointer lifts; a pending set ends when the engine agrees, and if the
 * engine refuses it the bracket has to snap back rather than sit there lying.
 */
let loopDrag = null;
let loopPending = null;
function loopOverride() { return loopDrag || loopPending; }

/**
 * Snap a dragged loop to whole bars, or to beats with Shift held.
 *
 * A loop is a musical span, and a bar is what one is almost always wanted in;
 * the sub-bar case is real but rare enough to be the modifier. The span is at
 * least one unit wide because the engine refuses end <= start, and a click that
 * silently did nothing would look like a broken ruler.
 */
function setLoopFromDrag(a, b, done, opts = {}) {
  if (opts.cancelled) { loopDrag = null; schedule(); return; }
  const { start: lo, end: hi } = snapLoop(a, b, opts.fine);
  loopDrag = { start: lo, end: hi };
  if (!done) { schedule(); return; }
  loopDrag = null;
  if (!conn || !conn.send({ type: 'loop', start: lo, end: hi })) {
    state.reject = 'no engine';
    schedule();
    return;
  }
  // Stamped, because a pending value with no deadline is a bracket that lies
  // forever if the engine never agrees. The notes have the same reaper.
  loopPending = { start: lo, end: hi, at: performance.now() };
  state.reject = null;
  schedule();
}

/** How long the bracket may show a value the engine has not confirmed. */
const LOOP_PENDING_MS = 2000;

/** Drop the pending loop once the engine publishes it, or gives up. */
function reconcileLoop() {
  if (!loopPending || !engine) return;
  if (engine.loopStart === loopPending.start && engine.loopEnd === loopPending.end) {
    loopPending = null;
    return;
  }
  if (performance.now() - loopPending.at > LOOP_PENDING_MS) {
    // The engine did not take it. Snap back to what it actually has and say so,
    // rather than leaving a bracket that describes a loop nothing will play.
    loopPending = null;
    state.reject = 'the engine did not take that loop';
    schedule();
  }
}
let arrangeBuf = null;

// What we last SENT to the mixer. Not the truth any more — the engine publishes
// gain, pan and mute/solo back (SHM v12), and reconcileMixer drops these entries
// as it confirms them. See mixermodel.js.
const mixerState = createMixerState(16);
let mixerBuf = null;
let mixRevision = 0;
const mixerHost = document.getElementById('mixer');

function sendMixer(track) {
  const s = mixerState.strips[track];
  // Composed against this mixer version; the engine's next one settles it.
  s.pendingUntil = engine ? engine.mixerVersion : -1;
  mixRevision++;
  if (!conn || !conn.send({ type: 'mixer', track, gain: s.gain, pan: s.pan, flags: s.flags })) {
    state.reject = 'no engine';
  }
  schedule();
}

const patcherHost = document.getElementById('patcher');
let patcherBuf = null;
const patcher = new Patcher(patcherHost, {
  onSelect: (id) => { state.selectedNode = id; state.selectedField = 0; schedule(); },
});

/**
 * The engine's graph error codes, from daw_engine_main.cpp.
 *
 * Numbers, because that is what crosses the wire; named here because "the
 * engine refused that: code 3" is not an answer to anything. If a code arrives
 * that is not in this table it is printed as a number rather than swallowed —
 * a new code the engine learned is still news.
 */
const GRAPH_ERRORS = ['', 'no such node type', 'no such node', 'that would make a cycle',
                      'the engine could not add it', 'that connection is not allowed',
                      'those ports do not fit'];

/** One engine event as a line a person can read. */
function describeEngineEvent(e) {
  if (e.kind === 'patcher-error') {
    const why = GRAPH_ERRORS[e.code] || ('graph error ' + e.code);
    // Name the nodes when it is about an edge, the node when it is about a node.
    if (e.src !== e.dst && (e.src || e.dst)) return `${why} (#${e.src} to #${e.dst})`;
    return e.node ? `${why} (#${e.node})` : why;
  }
  if (e.kind === 'resync') {
    return `track ${e.track} republished (clip version ${e.clipVersion})`;
  }
  return `${e.kind.replace('-', ' ')} on track ${e.track} (code ${e.code})`;
}

/** The engine's node the patcher has selected, or null. */
function selectedPatcherNode() {
  if (!engine || state.selectedNode < 0) return null;
  for (const n of engine.patcherNodes) if (n.id === state.selectedNode) return n;
  return null;
}

/**
 * The last config we SENT for a node, kept until the engine reports it back.
 *
 * Two things need it. A second nudge before the engine has answered must build
 * on the first, or `patch 0 steps 3` sends 17 three times instead of 17, 18, 19.
 * And the box must show the value you just typed rather than the one the engine
 * has not caught up to — the same optimism the faders have, for the same reason.
 *
 * Keyed on node id, which backend confirmed is stable (unlike placement_id,
 * which is an index). The entry is dropped once the engine agrees, so an edit
 * the engine refuses reverts on screen instead of lying forever.
 */
const patchPending = new Map();

/** A node's config as far as this UI is concerned: what we sent, else what is. */
function configOf(node) {
  const sent = patchPending.get(node.id);
  return sent || node.config;
}

/**
 * Add, remove or connect nodes. The graph is the engine's, so all three are a
 * send and a wait — there is nothing sensible to show optimistically, because a
 * node the engine has not created yet has no id to draw.
 */
function sendGraph(msg) {
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return false; }
  state.reject = null;
  return true;
}

/** Add a node of the armed type. */
function addPatcherNode() {
  return sendGraph({ type: 'patchadd', nodeType: state.patchAddType, track: 0 });
}

/** Remove the selected node. Its edges go with it, on the engine's side. */
function removePatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (!sendGraph({ type: 'patchdel', node: node.id, track: 0 })) return false;
  state.selectedNode = -1;
  state.patchLinkFrom = null;
  return true;
}

/**
 * Connect in two steps: arm on the source, fire on the destination. Ports are
 * resolved by the sidecar from the two node types, so nobody types a port id.
 */
function linkPatcherNode() {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return false; }
  if (state.patchLinkFrom === null) {
    state.patchLinkFrom = { id: node.id, type: node.type };
    state.reject = null;
    return true;
  }
  const from = state.patchLinkFrom;
  state.patchLinkFrom = null;
  if (from.id === node.id) { state.reject = 'a node cannot connect to itself'; return false; }
  return sendGraph({ type: 'patchlink', src: from.id, srcType: from.type,
                     dst: node.id, dstType: node.type, track: 0 });
}

/** Drop the pending entries the engine has confirmed. Once per engine frame. */
function reconcilePatcher() {
  if (!patchPending.size || !engine) return;
  for (const id of patchPending.keys()) {
    const n = engine.patcherNodes.find((x) => x.id === id);
    // A node that left the graph takes its pending edit with it. Without this the
    // map is keyed on something the engine can stop publishing, which is a slow
    // leak and a stale value waiting for an id to be reused.
    if (!n) { patchPending.delete(id); continue; }
    const sent = patchPending.get(id);
    let same = true;
    for (let i = 0; i < 8; i++) if (n.config[i] !== sent[i]) { same = false; break; }
    if (same) patchPending.delete(id);
  }
}

/**
 * Nudge one field of the selected node. Returns the config sent, or null.
 *
 * All eight values go back, the edited one aside exactly as they were read; the
 * sidecar packs them into the type's byte layout. Packing here would put a
 * second copy of a layout that is not a struct next to the one that is — and the
 * engine rebuilds the whole config from what it receives, so a value this UI
 * dropped is a value the engine zeroes.
 */
function nudgePatcher(dir) {
  const node = selectedPatcherNode();
  if (!node) { state.reject = 'select a node first'; return null; }
  const next = nudgeConfig(node.type, configOf(node), state.selectedField, dir);
  if (!next) { state.reject = 'that node has no editable configuration'; return null; }
  const msg = { type: 'patchcfg', node: node.id, nodeType: node.type, track: 0 };
  for (let i = 0; i < 8; i++) msg['c' + i] = next[i];
  if (!conn || !conn.send(msg)) { state.reject = 'no engine'; return null; }
  patchPending.set(node.id, next);
  state.reject = null;
  return next;
}

const browserHost = document.getElementById('browser');
const browser = new Browser(browserHost, {
  onSave: (name) => {
    if (!conn || !conn.saveProject(name)) { state.reject = 'no engine'; schedule(); return; }
    state.currentProject = name;
    // The engine writes the file after it processes the command, and there is no
    // ack for "the file exists now" — an immediate re-list returns the old set and
    // the project you just saved is missing from its own browser. Re-list once the
    // write has plausibly landed; the rail also re-lists whenever it opens.
    setTimeout(() => { if (conn) { conn.send({ type: 'list' }); schedule(); } }, 700);
    state.reject = null;
    schedule();
  },
  onOpen: (name) => {
    if (!conn || !conn.loadProject(name)) { state.reject = 'no engine'; schedule(); return; }
    state.currentProject = name;
    state.browserOpen = false;
    state.reject = null;
    schedule();
  },
});

const helpHost = document.getElementById('help');
const help = createHelp(helpHost);
/**
 * What fits.
 *
 * The centre is the work; the panels are context. Below these widths the rails
 * would leave the tracker too narrow to read, so they yield rather than squeeze
 * it — at 900px the first version gave the tracker 300px and kept 598px of
 * rails, which is the wrong answer confidently laid out.
 *
 * Driven from JS rather than a media query so that STATE AND SCREEN AGREE: a
 * panel hidden by CSS that the focus model still believed in would swallow the
 * keyboard from behind a display:none, which is this morning's
 * pointer-events lesson in a different costume.
 */
const CENTRE_MIN = 560;
const RAIL_W = 266;
const DOCK_W = 332;
const CHAIN_H = 196;
const STAGE_MIN = 300;
function measureRoom() {
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;
  // The rail goes first: it is a picker you visit, where the dock is a running
  // conversation you watch.
  const roomForDock = w >= CENTRE_MIN + DOCK_W;
  const roomForRail = w >= CENTRE_MIN + DOCK_W + RAIL_W;
  const roomForChain = h >= STAGE_MIN + CHAIN_H + 90;   // 90 = chrome + crumb + status
  const changed = roomForRail !== state.roomForRail
               || roomForDock !== state.roomForDock
               || roomForChain !== state.roomForChain;
  state.roomForRail = roomForRail;
  state.roomForDock = roomForDock;
  state.roomForChain = roomForChain;
  // Focus cannot point at something that is not on screen.
  if (!roomForRail && state.focus === 'browser') state.focus = 'centre';
  if (!roomForDock && state.focus === 'dock') state.focus = 'centre';
  return changed;
}
addEventListener('resize', () => { measureRoom(); schedule(); });

const harmonyHost = document.getElementById('harmony');
const harmonyCard = new Harmony(harmonyHost, {});
const harmonyBuf = createHarmonyBuffer();

const chainHost = document.getElementById('chain');
const chain = new Chain(chainHost, {
  onSelect: (pos) => { state.chainSelected = pos; schedule(); },
});
const chainBuf = createChainBuffer();

/**
 * Per-track device chains, as the sidecar accumulates them.
 *
 * The engine publishes chains only as diffs, so this is state the sidecar has
 * gathered rather than something readable on demand. `chainRev` is the
 * sidecar's own revision counter: a snapshot can straddle two of its drain
 * ticks, so devices for one chainVersion can still be arriving while the
 * version stands still. Keying a redraw on the version alone would pin whatever
 * half arrived first — GUIDELINES 2.1, one more time.
 */
let chains = Object.create(null);
let chainRev = -1;
/** The engine's scale registry: [{id, name, octaveCents, stepCents[]}]. */
let scales = null;

const dockHost = document.getElementById('dock');
const rdockHost = document.getElementById('rdock');
const crumbHost = document.getElementById('crumb');

/**
 * The breadcrumb: project, track, surface. Its own row in the design, and worth
 * one, because "which track am I typing into" is the question a tracker answers
 * worst — the cursor is one cell among hundreds and the chrome is about the
 * transport.
 *
 * Pooled and guarded like every other draw path: this runs every frame.
 */
const crumbCells = [];
function crumbCell(i, cls) {
  while (crumbCells.length <= i) {
    const el = document.createElement('span');
    el.appendChild(document.createTextNode(''));
    el._t = null; el._c = null;
    crumbHost.appendChild(el);
    crumbCells.push(el);
  }
  const el = crumbCells[i];
  if (el._c !== cls) { el._c = cls; el.className = cls; }
  return el;
}
function crumbSet(i, cls, text) {
  const el = crumbCell(i, cls);
  if (el._t !== text) { el._t = text; el.firstChild.nodeValue = text; }
}
function drawCrumb() {
  const name = state.currentProject || 'untitled';
  crumbSet(0, 'cr-strong', name + '.uni');
  crumbSet(1, 'cr-sep', '\u00b7');
  crumbSet(2, 'cr-strong', trackName(engine, state.cursor.track));
  crumbSet(3, 'cr-sep', '\u00b7');
  crumbSet(4, '', SURFACE_TITLE[state.view] || state.view);
  crumbSet(5, 'cr-right', currentKey());
}

/** What the breadcrumb calls each surface. */
const SURFACE_TITLE = {
  tracker: 'Tracker', arrange: 'Arrangement', piano: 'Scale roll',
  mixer: 'Mixer', patcher: 'Patcher',
};
// One API object: every console command goes through the same paths the keyboard
// does, so the two can never drift into doing different things.
// Named rather than inline so `window.__uni` can hand an agent the SAME function
// the console calls, not a second one that has to be kept in step with it.
const dockApi = {
  setView: (v) => { if (v) { state.view = v; if (v === 'piano') fitPiano(); } schedule(); return state.view; },
  load: (n) => { const ok = conn && conn.loadProject(n); if (ok) state.currentProject = n; return ok; },
  save: (n) => { const ok = conn && conn.saveProject(n); if (ok) state.currentProject = n; return ok; },
  listProjects: () => conn && conn.send({ type: 'list' }),
  transport: (what) => cmd(what),
  seek: (tick) => conn && conn.send({ type: 'seek', track: state.cursor.track, tick: Math.max(0, tick) }),
  note: (pitch, dur, vel) => {
    const base = engine ? engine.clipVersion : 0;
    const d = dur === undefined || Number.isNaN(dur) ? laneRowTicks(state.cursor.track) : dur;
    const v = vel === undefined || Number.isNaN(vel) ? state.velocity : vel;
    if (!conn || !conn.send({ type: 'note', track: state.cursor.track, pitch,
                              tick: tickOfCursorRow(), dur: d, vel: v })) throw new Error('no engine');
    addPending(state.cursor.row, state.cursor.track, 0, pitchToToken(pitch), base);
    schedule();
  },
  del: () => { if (!deleteAtCursor()) throw new Error(state.reject || 'nothing deleted'); schedule(); },
  goto: (row, track) => {
    state.cursor.row = Math.max(0, row);
    if (track !== undefined) state.cursor.track = Math.max(0, Math.min(state.tracks - 1, track));
    follow(); schedule();
  },
  zoom: (z) => { state.zoom = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, z)); schedule(); },
  octave: (o) => { state.octave = Math.max(0, Math.min(9, o)); schedule(); },
  gain: (t, db) => {
    mixerState.strips[t].gain = Math.round(Math.max(-96, Math.min(12, db)) * 100);
    sendMixer(t);
  },
  strip: (t, which) => {
    mixerState.strips[t].flags ^= which === 'mute' ? FLAG_MUTE : FLAG_SOLO;
    sendMixer(t);
  },
  state: () => ({ view: state.view, cursor: state.cursor, zoom: state.zoom,
                  octave: state.octave, project: state.currentProject }),
  engine: () => (engine ? { transport: engine.transport, tick: engine.playheadTick,
                            notes: engine.noteCount, tracks: engine.trackCount,
                            clipVersion: engine.clipVersion, stale: engine.stale } : null),
  close: () => { state.focus = 'centre'; schedule(); },
  // Everything the keyboard can do, the console can do — otherwise "one grammar
  // that drives every surface" is only true of the parts I remembered.
  follow: (on) => { state.followPlayhead = on === undefined ? !state.followPlayhead : !!on;
                    schedule(); return state.followPlayhead; },
  rename: (t, name) => {
    if (!conn || !conn.send({ type: 'rename', track: t, name })) throw new Error('no engine');
    schedule();
  },
  select: (r0, r1, track) => {
    const t = track === undefined ? state.cursor.track : track;
    const f = t * state.columns;
    state.selection = { r0: Math.min(r0, r1), r1: Math.max(r0, r1),
                        f0: f, f1: f + state.columns - 1, _anchor: r0 };
    schedule();
    return notesInSelection().length;
  },
  transpose: (n) => { if (!transposeSelection(n)) throw new Error(state.reject || 'nothing to transpose'); schedule(); },
  setLoop: (fromBar, toBar) => {
    // Bars, 1-based, the same numbers the ruler prints. Ticks would match `seek`,
    // but nobody reads a loop out of a project in nanoticks and the ruler is
    // right there saying 5.
    if (!(fromBar >= 1) || !(toBar >= 1)) throw new Error('bars are 1-based');
    const a = (fromBar - 1) * TICKS_PER_BAR;
    const b = (toBar - 1) * TICKS_PER_BAR;
    setLoopFromDrag(a, b, true);
    if (state.reject) throw new Error(state.reject);
    const l = loopOverride() || { start: a, end: Math.max(b, a + TICKS_PER_BAR) };
    return 'loop bars ' + (l.start / TICKS_PER_BAR + 1) + '–' + (l.end / TICKS_PER_BAR + 1);
  },
  nodes: () => (engine ? engine.patcherNodes.map((n) => ({
    id: n.id, type: NODE_TYPES[n.type] || n.type,
    fields: configFields(n.type).map((f) => f.name),
    config: Array.from(configOf(n)),
  })) : []),
  addNode: (type) => {
    const t = NODE_TYPES.indexOf(String(type));
    const n = t >= 0 ? t : Number(type);
    if (!(n >= 0 && n < NODE_TYPES.length)) {
      throw new Error('node types: ' + NODE_TYPES.join(' '));
    }
    state.patchAddType = n;
    if (!addPatcherNode()) throw new Error(state.reject || 'refused');
    return 'adding ' + NODE_TYPES[n];
  },
  delNode: (id) => {
    state.selectedNode = id;
    if (!removePatcherNode()) throw new Error(state.reject || 'refused');
    return 'removing #' + id;
  },
  linkNodes: (a, b, kind) => {
    const nodes = engine ? engine.patcherNodes : [];
    const src = nodes.find((n) => n.id === a), dst = nodes.find((n) => n.id === b);
    if (!src) throw new Error('no node ' + a);
    if (!dst) throw new Error('no node ' + b);
    const msg = { type: 'patchlink', src: a, srcType: src.type,
                  dst: b, dstType: dst.type, track: 0 };
    if (kind !== undefined && !Number.isNaN(kind)) msg.kind = kind;
    if (!sendGraph(msg)) throw new Error(state.reject || 'refused');
    return 'linking #' + a + ' to #' + b;
  },
  patch: (id, field, delta) => {
    const node = engine && engine.patcherNodes.find((n) => n.id === id);
    if (!node) throw new Error('no node ' + id);
    const fields = configFields(node.type);
    // By NAME, because an agent reading `nodes` sees names. Taking an index here
    // would make the two halves of the grammar disagree about what field 2 is.
    const at = fields.findIndex((f) => f.name === field);
    if (at < 0) {
      throw new Error(fields.length
